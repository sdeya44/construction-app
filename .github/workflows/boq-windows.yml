# Builds the KAYAN BOQ Windows installer. Runs the test suite first; the installer is
# attached to the run as an artifact (Actions → run → Artifacts → KAYAN-BOQ-Setup).
name: KAYAN BOQ — Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'boq/**'
      - '.github/workflows/boq-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: boq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: KAYAN-BOQ-Setup
          path: boq/dist/*.exe
          if-no-files-found: error
