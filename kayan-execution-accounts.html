// ═══════════════════════════════════════════════════════════════════════
//  MODULE: ACCOUNTS  (draft/locked lifecycle, immutable snapshots, history)
//
//  Design note (this is the key fix over the pre-v3 data model):
//  the old app stamped each row with ONE approval account + at most one
//  correction, so a second correction silently lost the first one. Here,
//  every measurement row carries an append-only `history[]`, and every
//  LOCKED account stores a full immutable `snapshot` reconstructed from
//  that history as of its own account number. Snapshots are written once
//  and never mutated again — viewing "what Account 002 looked like" is a
//  plain read of account.snapshot, correct forever regardless of later
//  corrections. See buildSnapshotForNumber(), the single function both
//  Accounts.lock() and Migration use to freeze a point in time.
// ═══════════════════════════════════════════════════════════════════════
const Accounts = {
  list(project){ return project.accounts.slice().sort((a,b)=>+a.number-+b.number); },
  current(project){ // the single draft (open) account — auto-repairs if missing
    let d=project.accounts.find(a=>a.status==='draft');
    if(!d){ d=makeAccount(this.nextNumber(project)); project.accounts.push(d); }
    return d;
  },
  byId(project,id){ return project.accounts.find(a=>a.id===id); },
  byNumber(project,num){ return project.accounts.find(a=>a.number===String(num).padStart(3,'0')); },
  nextNumber(project){
    const nums=project.accounts.map(a=>+a.number).filter(n=>!isNaN(n));
    return String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
  },
  lockedAccounts(project){ return this.list(project).filter(a=>a.status==='locked'); },
  previousLocked(project,beforeNumber){
    const n=+beforeNumber;
    const locked=this.lockedAccounts(project).filter(a=>+a.number<n);
    return locked.length ? locked[locked.length-1] : null;
  },
  previousSnapshot(project,account){ const p=this.previousLocked(project,account.number); return p?p.snapshot:null; },

  // freeze the state of every measurement row AS OF `accountNumber`, using each
  // row's history[] (latest entry with accountNumber <= target). Used both for
  // live locking (target = the account being locked, whose history entries were
  // just appended) and for legacy-migration reconstruction.
  buildSnapshotForNumber(project,accountNumber){
    const target=+accountNumber;
    const rows=[];
    project.measurements.forEach(m=>{
      if(m.isGroup) return;
      const entries=(m.history||[]).filter(h=>+h.accountNumber<=target).sort((a,b)=>+a.accountNumber-+b.accountNumber);
      if(!entries.length) return; // row did not exist yet at this account
      const last=entries[entries.length-1];
      rows.push({id:m.id,itemId:m.itemId,value:last.action==='cancelled'?0:nz(last.value),
        cancelled:last.action==='cancelled', desc:m.desc,area:m.area,shape:m.shape,
        d1:m.d1,d2:m.d2,d3:m.d3,t:m.t,qty:m.qty,sign:m.sign,notes:m.notes,
        claimedValue: last.claimedValue!=null?nz(last.claimedValue):nz(last.value),
        approvalStatus: last.approvalStatus||null, approvalNote: last.approvalNote||''});
    });
    const items=cloneObj(project.items);
    const totals=this.computeTotals(project,rows,items);
    return {accountNumber:String(accountNumber).padStart(3,'0'),lockedAt:null,items,measurements:rows,totals};
  },
  computeTotals(project,rows,items){
    const byItem={}; let grandQty=0,grandAmount=0;
    items.forEach(it=>{
      const q=rows.filter(r=>r.itemId===it.id && !r.cancelled).reduce((a,r)=>a+nz(r.value),0);
      const amt=q*nz(it.unitPrice);
      byItem[it.id]={qty:q,amount:amt};
      grandAmount+=amt;
    });
    const vat=nz(project.vat)/100;
    return {byItem, grandAmount, vatAmount:grandAmount*vat, totalWithVat:grandAmount*(1+vat)};
  },

  // per-item movement for a given account (draft = live data, locked = its own snapshot)
  itemMovement(project,item,account){
    const isDraft=account.status==='draft';
    const curRows = isDraft
      ? project.measurements.filter(m=>!m.isGroup && m.itemId===item.id)
      : (account.snapshot?account.snapshot.measurements.filter(r=>r.itemId===item.id):[]);
    const prevSnap=this.previousSnapshot(project,account);
    let previousCumulative=0,addition=0,correction=0;
    let claimedPrevious=0,claimedAddition=0,claimedCorrection=0,pendingCount=0;
    const rowClaimed=r=>r.cancelled?0:(isDraft?calcRow(r,item):nz(r.claimedValue!=null?r.claimedValue:r.value));
    const seen=new Set();
    curRows.forEach(r=>{
      seen.add(r.id);
      const curVal = r.cancelled?0:(isDraft?approvedRowValue(r,item):nz(r.value));
      const claimedVal = rowClaimed(r);
      if(isDraft && !r.cancelled && r.approval && r.approval.status==='pending') pendingCount++;
      const prevRow = prevSnap ? prevSnap.measurements.find(x=>x.id===r.id) : null;
      if(prevRow){
        const pv=prevRow.cancelled?0:nz(prevRow.value); previousCumulative+=pv; correction+=(curVal-pv);
        const cpv=prevRow.cancelled?0:nz(prevRow.claimedValue!=null?prevRow.claimedValue:prevRow.value);
        claimedPrevious+=cpv; claimedCorrection+=(claimedVal-cpv);
      } else { addition+=curVal; claimedAddition+=claimedVal; }
    });
    if(prevSnap) prevSnap.measurements.filter(r=>r.itemId===item.id).forEach(pr=>{
      if(!seen.has(pr.id)){
        const pv=pr.cancelled?0:nz(pr.value); previousCumulative+=pv; correction-=pv;
        const cpv=pr.cancelled?0:nz(pr.claimedValue!=null?pr.claimedValue:pr.value); claimedPrevious+=cpv; claimedCorrection-=cpv;
      }
    });
    const currentCumulative=previousCumulative+addition+correction;
    const claimedCurrentCumulative=claimedPrevious+claimedAddition+claimedCorrection;
    const contractQty=nz(item.contractQty);
    const balance=contractQty-currentCumulative;
    const completionPct=contractQty>0?(currentCumulative/contractQty*100):(Math.abs(currentCumulative)>1e-9?100:0);
    // a LOCKED account must be priced at whatever was in effect when it was locked — never
    // the item's current live price, or editing a price later would silently rewrite the ₪
    // figures on an already-approved historical account (progress-payment certificate).
    const unitPrice = isDraft ? nz(item.unitPrice) : nz(this.frozenPrice(account,item));
    return {previousCumulative,addition,correction,currentCumulative,contractQty,balance,completionPct,
      overrun:contractQty>0 && currentCumulative>contractQty+1e-9, unitPrice,
      amount:currentCumulative*unitPrice, periodAmount:(addition+correction)*unitPrice, previousAmount:previousCumulative*unitPrice,
      claimedCurrentCumulative,claimedAddition,claimedCorrection,pendingCount};
  },
  // the unit price as frozen in a locked account's own snapshot (snapshot.items is a full
  // clone of every BOQ item taken at lock time) — falls back to the live price only for an
  // item that didn't exist yet at that lock, which can't have any priced quantity anyway.
  frozenPrice(account,item){
    if(!account.snapshot) return item.unitPrice;
    const frozen=account.snapshot.items.find(x=>x.id===item.id);
    return frozen ? frozen.unitPrice : item.unitPrice;
  },
  // rows that actually moved in this account (for "רק תנועה בחשבון זה")
  movementRows(project,item,account){
    const isDraft=account.status==='draft';
    const curRows = isDraft
      ? project.measurements.filter(m=>!m.isGroup && m.itemId===item.id)
      : (account.snapshot?account.snapshot.measurements.filter(r=>r.itemId===item.id):[]);
    const prevSnap=this.previousSnapshot(project,account);
    return curRows.filter(r=>{
      const curVal=r.cancelled?0:(isDraft?approvedRowValue(r,item):nz(r.value));
      const prevRow=prevSnap?prevSnap.measurements.find(x=>x.id===r.id):null;
      const prevVal=prevRow?(prevRow.cancelled?0:nz(prevRow.value)):0;
      return Math.abs(curVal-prevVal)>1e-9 || (r.cancelled && prevRow && !prevRow.cancelled);
    });
  },
  projectTotals(project,account){
    let contractTotal=0,cumulativeAmount=0,previousAmount=0,periodAmount=0;
    project.items.filter(it=>!it.cancelled).forEach(it=>{
      contractTotal+=nz(it.contractQty)*nz(it.unitPrice);
      const mv=this.itemMovement(project,it,account);
      cumulativeAmount+=mv.amount; previousAmount+=mv.previousAmount; periodAmount+=mv.periodAmount;
    });
    const vat=nz(project.vat)/100;
    return {contractTotal,cumulativeAmount,previousAmount,periodAmount,
      cumulativeWithVat:cumulativeAmount*(1+vat),periodWithVat:periodAmount*(1+vat),
      balance:contractTotal-cumulativeAmount, completionPct: contractTotal>0?(cumulativeAmount/contractTotal*100):0};
  },
  draftHasMovement(project){
    const d=this.current(project);
    return project.items.some(it=>{ const mv=this.itemMovement(project,it,d); return Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9; });
  },

  // ── LOCK: validate → stamp history on every changed row → freeze snapshot → open next draft ──
  lock(project){
    const v=Validation.run(project);
    if(v.critical.length) return {ok:false,critical:v.critical,warnings:v.warnings};
    const draft=this.current(project);
    if(draft.status!=='draft') return {ok:false,critical:[{msg:'אין חשבון טיוטה פתוח לנעילה'}],warnings:[]};
    const today=todayISO();
    project.measurements.forEach(m=>{
      if(m.isGroup) return;
      const item=findItem(project,m.itemId);
      const lastEntry=m.history.length?m.history[m.history.length-1]:null;
      if(m.cancelled){
        if(lastEntry && lastEntry.action!=='cancelled'){
          m.history.push({accountId:draft.id,accountNumber:draft.number,action:'cancelled',value:0,prevValue:nz(lastEntry.value),date:today,claimedValue:0});
        }
        return;
      }
      if(!item) return;
      // the OFFICIAL figure that gets frozen is the approved value, never the raw claim —
      // the claim is stamped alongside it (claimedValue) purely for audit/comparison
      const cur=approvedRowValue(m,item);
      const claimed=calcRow(m,item);
      const approvalStatus=m.approval?m.approval.status:null;
      const approvalNote=m.approval?(m.approval.note||''):'';
      if(!lastEntry){
        if(Math.abs(cur)>1e-9) m.history.push({accountId:draft.id,accountNumber:draft.number,action:'created',value:cur,prevValue:0,date:today,claimedValue:claimed,approvalStatus,approvalNote});
      } else if(Math.abs(cur-nz(lastEntry.value))>1e-9){
        m.history.push({accountId:draft.id,accountNumber:draft.number,action:'corrected',value:cur,prevValue:nz(lastEntry.value),date:today,claimedValue:claimed,approvalStatus,approvalNote});
      }
    });
    // garbage-collect rows that were cancelled before ever being part of a locked account
    project.measurements=project.measurements.filter(m=>m.isGroup || !m.cancelled || m.history.length);
    const snapshot=this.buildSnapshotForNumber(project,draft.number);
    snapshot.lockedAt=nowISO();
    draft.status='locked'; draft.lockedAt=nowISO(); draft.snapshot=snapshot;
    const next=makeAccount(this.nextNumber(project));
    project.accounts.push(next);
    return {ok:true,warnings:v.warnings,locked:draft,next};
  },
  // safety-gated undo of the most recent lock (not part of the core spec, but
  // protects against a mis-click — refuses if the account after it already has work)
  unlockLast(project){
    const locked=this.lockedAccounts(project);
    const last=locked[locked.length-1];
    if(!last) return {ok:false,msg:'אין חשבון נעול לביטול'};
    if(this.draftHasMovement(project)) return {ok:false,msg:'לא ניתן לבטל — כבר הוזנו נתונים בחשבון הפתוח. יש להסיר אותם קודם.'};
    project.measurements.forEach(m=>{ m.history=(m.history||[]).filter(h=>h.accountNumber!==last.number); });
    const draft=project.accounts.find(a=>a.status==='draft');
    if(draft) project.accounts=project.accounts.filter(a=>a.id!==draft.id);
    last.status='draft'; last.snapshot=null; last.lockedAt=null;
    return {ok:true};
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: VALIDATION ENGINE
//  Critical findings BLOCK locking; warnings require an explicit confirm.
// ═══════════════════════════════════════════════════════════════════════
// accepts "5", "5.2", ".5", "5.", "-.5" etc. — anything nz() can actually parse.
// (the old stricter pattern rejected ".5"/"5." even though they're common, valid
// input and calculated correctly — it just blocked locking with a false "invalid
// number" error on a number that was never actually invalid)
const NUM_RE=/^-?(\d+([.,]\d*)?|[.,]\d+)$/;
const Validation = {
  run(project){
    const critical=[], warnings=[];
    const draft=Accounts.current(project);
    // duplicate item codes
    const byCode={};
    project.items.filter(it=>!it.cancelled).forEach(it=>{ const c=itemFullCode(it); (byCode[c]=byCode[c]||[]).push(it); });
    Object.entries(byCode).forEach(([code,arr])=>{ if(arr.length>1) arr.forEach(it=>
      critical.push({code:'dup',itemId:it.id,msg:`קוד סעיף כפול: ${code} (${arr.length} מופעים)`})); });
    // orphan measurement rows
    project.measurements.forEach(m=>{ if(m.isGroup||m.cancelled) return;
      if(!findItem(project,m.itemId)) critical.push({code:'orphan',rowId:m.id,msg:'שורת מדידה מקושרת לסעיף שאינו קיים'}); });
    project.items.filter(it=>!it.cancelled).forEach(it=>{
      const kind=itemUnitKind(it);
      if(!it.unit) critical.push({code:'nounit',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסרה יחידת מידה`});
      if(!it.description) warnings.push({code:'nodesc',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסר תיאור`});
      if(it.unitPrice===''||it.unitPrice==null) warnings.push({code:'noprice',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסר מחיר יחידה`});
      if(it.contractQty===''||it.contractQty==null) warnings.push({code:'noqty',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסרה כמות חוזית`});
      const rows=project.measurements.filter(m=>!m.isGroup && m.itemId===it.id && !m.cancelled);
      rows.forEach(m=>{
        ['d1','d2','d3','t','qty'].forEach(k=>{ const v=m[k]; if(v!=='' && v!=null && !NUM_RE.test(String(v).trim()))
          critical.push({code:'nan',rowId:m.id,itemId:it.id,msg:`סעיף ${itemFullCode(it)}: ערך לא מספרי בשדה ${k}`}); });
        const touched = ['d1','d2','d3','t','qty'].some(k=>m[k]!=='' && m[k]!=null);
        if(!touched) return;
        const bv=baseVal(m,kind);
        if(kind==='volume' && !bv.complete) critical.push({code:'incomplete-vol',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)} (מ"ק): שורת מדידה חסרה עובי/אורך — לא ניתן לחשב נפח`});
        if(kind==='area' && nz(m.t)>0) critical.push({code:'area-thick',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)} (מ"ר): לא ניתן להזין עובי בסעיף שטח`});
        if(bv.complete && Math.abs(calcRow(m,it))<1e-9) warnings.push({code:'zero',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)}: שורת מדידה מחושבת ל-0`});
      });
      const mv=Accounts.itemMovement(project,it,draft);
      if(mv.overrun) warnings.push({code:'overrun',itemId:it.id,
        msg:`סעיף ${itemFullCode(it)}: חריגה מהכמות החוזית (${pct(mv.completionPct)}, +${fn(mv.currentCumulative-mv.contractQty)} ${it.unit} · השפעה כספית ${money((mv.currentCumulative-mv.contractQty)*mv.unitPrice)})`});
      if(mv.pendingCount>0) warnings.push({code:'pending',itemId:it.id,
        msg:`סעיף ${itemFullCode(it)}: ${mv.pendingCount} שור${mv.pendingCount===1?'ה ממתינה':'ות ממתינות'} לאישור — לא ייכללו במצטבר עד שיוכרעו`});
    });
    return {critical,warnings};
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: STATE  (current in-memory project + autosave)
// ═══════════════════════════════════════════════════════════════════════
const State = {
  project:null,
  saveTimer:null,
  scheduleSave(){
    UI.setSaveStatus('saving');
    clearTimeout(this.saveTimer);
    this.saveTimer=setTimeout(()=>this.save(),400);
  },
  async save(){
    if(!this.project) return;
    this.project.updatedAt=nowISO();
    try{ await Storage.saveProject(this.project); UI.setSaveStatus('saved'); }
    catch(e){ console.error(e); UI.setSaveStatus('err'); }
  },
};

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: APP  (boot, navigation, topbar)

const App = {
  async boot(){

    if(savedProfile) CompanyProfile=Object.assign({},DEFAULT_COMPANY_PROFILE,savedProfile);
    this.paintBrand();
    const migrated=await Migration.run();

        <div class="fld"><label>שם הפרויקט *</label><input id="np-name" placeholder="לדוגמה: מגדל רוגוזין"></div>

        <div class="fld"><label>מס׳ חוזה</label><input id="np-contract"></div>
        <div class="fld"><label>קבלן מבצע</label><input id="np-contractor"></div>
        <div class="fld"><label>מפקח</label><input id="np-supervisor"></div>
        <div class="fld"><label>מנהל פרויקט</label><input id="np-manager"></div>
        <div class="fld"><label>מע"מ %</label><input id="np-vat" type="number" value="18"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>
        <button class="btn btn-gold" onclick="Projects.createFromModal()">צור פרויקט</button></div>`);
    setTimeout(()=>byId('np-name').focus(),50);
  },
  async createFromModal(){
    const name=byId('np-name').value.trim();
    if(!name){ toast('יש להזין שם פרויקט','err'); return; }
    const p=makeProject({name, location:byId('np-loc').value.trim(), contractNumber:byId('np-contract').value.trim(),
      contractor:byId('np-contractor').value.trim(), supervisor:byId('np-supervisor').value.trim(),
      manager:byId('np-manager').value.trim(), vat:+byId('np-vat').value||18});
    p.accounts=[makeAccount('001')];
    await Storage.saveProject(p);
    UI.closeModal(); toast('הפרויקט נוצר');
    await this.open(p.id);
  },
  async open(id){ await App.openProject(id); },
  async duplicate(id){
    const src=await Storage.getProject(id); if(!src) return;
    // duplication is a BOQ/settings template copy: items & pricing carry over,
    // but execution history (measurements/accounts) starts fresh — duplicating
    // a project is normally "same building type, new site", not "same job twice".
    const p=makeProject({name:src.name+' (עותק)', location:src.location, contractNumber:src.contractNumber,
      contractor:src.contractor, supervisor:src.supervisor, manager:src.manager, vat:src.vat,
      logo:src.logo, logoMode:src.logoMode, useAreas:src.useAreas});
    p.buildings=cloneObj(src.buildings); p.chapters=cloneObj(src.chapters); p.subchapters=cloneObj(src.subchapters);
    p.items=cloneObj(src.items).map(it=>({...it,id:uid('item_'),createdInAccount:null}));
    p.accounts=[makeAccount('001')];
    await Storage.saveProject(p);
    toast('הפרויקט שוכפל (כתב הכמויות בלבד — ללא היסטוריית חשבונות)');
    this.renderList();
  },
  async remove(id){
    const p=await Storage.getProject(id); if(!p) return false;
    if(!confirm(`למחוק לצמיתות את הפרויקט "${p.name}"?\nפעולה זו אינה הפיכה. מומלץ לייצא גיבוי קודם.`)) return false;
    await Storage.deleteProject(id);
    toast('הפרויקט נמחק');
    if(!State.project||State.project.id!==id) this.renderList();
    return true;
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: BOQ  (Building → Chapter → Subchapter → Item tree)
// ═══════════════════════════════════════════════════════════════════════
const BOQ = {
  _expanded:new Set(),
  _lastHighlight:null,
  _showCancelled:false,
  key(b,c,s){ return [b,c,s].filter(x=>x!=null).join('.'); },
  isExpanded(key){ return this._expanded.has(key); },
  toggleNode(key){ this._expanded.has(key)?this._expanded.delete(key):this._expanded.add(key); App.refresh(); },
  expandAll(){
    const p=State.project;
    this._expanded.clear();
    this.visibleItems(p).forEach(it=>{
      this._expanded.add(this.key(it.building)); this._expanded.add(this.key(it.building,it.chapter)); this._expanded.add(this.key(it.building,it.chapter,it.sub));
    });
    App.refresh();
  },
  collapseAll(){ this._expanded.clear(); App.refresh(); },
  toggleShowCancelled(){ this._showCancelled=!this._showCancelled; App.refresh(); },
  // a cancelled item's code is intentionally still "taken" — reusing it would make an
  // active item and its cancelled predecessor show the same code in reports/history.
  // The user must explicitly restore the old item instead of creating a lookalike.
  duplicateExists(project,building,chapter,sub,item,excludeId){
    const code=`${building}.${chapter}.${sub}.${item}`;
    return project.items.some(it=>it.id!==excludeId && itemFullCode(it)===code);
  },
  restoreItem(id){
    const it=findItem(State.project,id); if(!it) return;
    it.cancelled=false;
    State.scheduleSave(); toast('הסעיף שוחזר'); App.refresh();
  },
  ensureMeta(project,building,chapter,sub,names){
    if(building!=null){ project.buildings[building]=project.buildings[building]||{name:names&&names.building||''};
      if(names&&names.building) project.buildings[building].name=names.building; }
    if(building!=null&&chapter!=null){ const k=building+'.'+chapter; project.chapters[k]=project.chapters[k]||{name:names&&names.chapter||''};
      if(names&&names.chapter) project.chapters[k].name=names.chapter; }
    if(building!=null&&chapter!=null&&sub!=null){ const k=building+'.'+chapter+'.'+sub; project.subchapters[k]=project.subchapters[k]||{name:names&&names.sub||''};
      if(names&&names.sub) project.subchapters[k].name=names.sub; }
  },
  addOrUpdateItem(project,fields,editId){
    const building=Util.normDigits(fields.building,2), chapter=Util.normDigits(fields.chapter,2),
      sub=Util.normDigits(fields.sub,2), item=Util.normDigits(fields.item,4);
    if(this.duplicateExists(project,building,chapter,sub,item,editId)){
      const code=`${building}.${chapter}.${sub}.${item}`;
      const clash=project.items.find(it=>it.id!==editId&&itemFullCode(it)===code);
      return {ok:false,msg: clash&&clash.cancelled
        ? `קוד סעיף ${code} שייך לסעיף מבוטל — יש לשחזר אותו (☑ הצג סעיפים מבוטלים) במקום ליצור סעיף חדש עם אותו קוד`
        : `קוד סעיף ${code} כבר קיים בפרויקט זה`};
    }
    this.ensureMeta(project,building,chapter,sub,{building:fields.buildingName,chapter:fields.chapterName,sub:fields.subName});
    let it=editId?findItem(project,editId):null;
    if(it){ Object.assign(it,{building,chapter,sub,item,description:fields.description,unit:fields.unit,
      contractQty:fields.contractQty,unitPrice:fields.unitPrice,notes:fields.notes}); }
    else{ it=makeBoqItem({building,chapter,sub,item,description:fields.description,unit:fields.unit,
      contractQty:fields.contractQty,unitPrice:fields.unitPrice,notes:fields.notes,createdInAccount:Accounts.current(project).number});
      project.items.push(it); }
    return {ok:true,item:it};
  },
  itemHasHistory(project,itemId){ return project.measurements.some(m=>!m.isGroup && m.itemId===itemId && m.history && m.history.length); },
  removeItem(project,itemId){
    if(this.itemHasHistory(project,itemId)){
      const it=findItem(project,itemId); it.cancelled=true;
      return {ok:true,soft:true};
    }
    project.items=project.items.filter(it=>it.id!==itemId);
    project.measurements=project.measurements.filter(m=>m.itemId!==itemId);
    return {ok:true,soft:false};
  },
  visibleItems(project){ return this._showCancelled ? project.items : project.items.filter(it=>!it.cancelled); },
  tree(project){
    const items=this.visibleItems(project);
    const bMap={};
    items.forEach(it=>{
      bMap[it.building]=bMap[it.building]||{chapters:{},items:[]};
      const B=bMap[it.building];
      B.chapters[it.chapter]=B.chapters[it.chapter]||{subs:{}};
      const C=B.chapters[it.chapter];
      C.subs[it.sub]=C.subs[it.sub]||{items:[]};
      C.subs[it.sub].items.push(it);
    });
    return bMap;
  },
  draftHasActivity(project,itemIds){
    const draft=Accounts.current(project);
    return itemIds.some(id=>{ const it=findItem(project,id); if(!it) return false;
      const mv=Accounts.itemMovement(project,it,draft); return Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9; });
  },
  render(){
    const p=State.project, tree=this.tree(p);
    const bKeys=Object.keys(tree).sort((a,b)=>a.localeCompare(b));
    const cancelledCount=p.items.filter(i=>i.cancelled).length;
    let h=`<div class="card"><div class="card-hd">📋 כתב כמויות<span class="hd-sub">${p.items.filter(i=>!i.cancelled).length} סעיפים${cancelledCount?` · ${cancelledCount} מבוטלים`:''}</span></div>
      <div class="card-bd">
      <div class="boq-toolbar">
        <div class="boq-search"><input id="boq-search-in" placeholder="חיפוש לפי קוד, תיאור, פרק…" oninput="BOQSearch.onInput(this.value)" onkeydown="BOQSearch.onKey(event)">
          <span class="ic">🔍</span><div id="boq-search-results" class="boq-search-results"></div></div>
        <button class="btn btn-ghost btn-sm" onclick="BOQ.expandAll()">⤢ הרחב הכל</button>
        <button class="btn btn-ghost btn-sm" onclick="BOQ.collapseAll()">⤡ כווץ הכל</button>
        ${cancelledCount?`<label class="opt" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"><input type="checkbox" ${this._showCancelled?'checked':''} onchange="BOQ.toggleShowCancelled()">הצג ${cancelledCount} סעיפים מבוטלים</label>`:''}
        <button class="btn btn-gold btn-sm" onclick="BOQ.openItemModal()">＋ סעיף חדש</button>
      </div>`;
    if(!bKeys.length){
      h+=`<div class="empty"><div class="ic">📋</div><div class="t">אין עדיין סעיפים בכתב הכמויות</div>
        <div class="s">הוסף סעיף ידנית או ייבא מקובץ SKN בלשונית ״ייבוא״</div></div>`;
    } else {
      h+=`<div class="btree">`+bKeys.map(b=>this.renderBuilding(p,b,tree[b])).join('')+`</div>`;
    }
    h+=`</div></div>`;
    return h;
  },
  renderBuilding(p,b,B){
    const key=this.key(b), exp=this.isExpanded(key);
    const allIds=Object.values(B.chapters).flatMap(c=>Object.values(c.subs).flatMap(s=>s.items.map(i=>i.id)));
    const count=allIds.length;
    const active=this.draftHasActivity(p,allIds);
    const name=(p.buildings[b]&&p.buildings[b].name)||'';
    const chKeys=Object.keys(B.chapters).sort((a,b2)=>a.localeCompare(b2));
    return `<div class="b-node${exp?'':' collapsed'}" data-node="${key}">
      <div class="b-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle">▼</span>
        <span class="code">מבנה ${esc(b)}</span><span class="name">${esc(name)}</span>
        ${active?'<span class="b-activity" title="פעילות בחשבון הנוכחי"></span>':''}<span class="b-count">${count} סעיפים</span></div>
      <div class="b-body">${chKeys.map(c=>this.renderChapter(p,b,c,B.chapters[c])).join('')}</div></div>`;
  },
  renderChapter(p,b,c,C){
    const key=this.key(b,c), exp=this.isExpanded(key);
    const allIds=Object.values(C.subs).flatMap(s=>s.items.map(i=>i.id));
    const active=this.draftHasActivity(p,allIds);
    const name=(p.chapters[b+'.'+c]&&p.chapters[b+'.'+c].name)||'';
    const subKeys=Object.keys(C.subs).sort((a,b2)=>a.localeCompare(b2));
    return `<div class="c-node" data-node="${key}">
      <div class="c-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle" style="color:var(--navy2)">▼</span>
        <span class="code">${esc(b)}.${esc(c)}</span><span class="name">${esc(name)}</span>
        ${active?'<span class="b-activity" style="background:var(--gold-dk)" title="פעילות בחשבון הנוכחי"></span>':''}<span class="c-count">${allIds.length}</span></div>
      <div class="c-body${exp?'':' collapsed'}">${subKeys.map(s=>this.renderSub(p,b,c,s,C.subs[s])).join('')}</div></div>`;
  },
  renderSub(p,b,c,s,S){
    const key=this.key(b,c,s), exp=this.isExpanded(key);
    const ids=S.items.map(i=>i.id);
    const active=this.draftHasActivity(p,ids);
    const name=(p.subchapters[b+'.'+c+'.'+s]&&p.subchapters[b+'.'+c+'.'+s].name)||'';
    return `<div class="s-node" data-node="${key}">
      <div class="s-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle" style="font-size:9px">▼</span>
        <span class="code">${esc(b)}.${esc(c)}.${esc(s)}</span><span class="name">${esc(name)}</span>
        ${active?'<span class="b-activity" style="background:var(--gold-dk)" title="פעילות בחשבון הנוכחי"></span>':''}<span class="c-count">${S.items.length}</span></div>
      <div class="s-body${exp?'':' collapsed'}">${S.items.sort((x,y)=>x.item.localeCompare(y.item)).map(it=>this.renderItem(p,it)).join('')}</div></div>`;
  },
  renderItem(p,it){
    if(it.cancelled){
      return `<div class="i-row" data-item-id="${it.id}" style="opacity:.55" title="סעיף מבוטל — נשאר לצורך היסטוריה, לא פעיל בחשבון הנוכחי">
        <span class="code">${esc(itemFullCode(it))}</span>
        <span class="desc" style="text-decoration:line-through">${esc(it.description||'(ללא תיאור)')}</span>
        <span class="unit-chip">${esc(it.unit)}</span>
        <span class="stat chg">מבוטל</span>
        <span class="actions" onclick="event.stopPropagation()">
          <button class="icon-btn" title="שחזור הסעיף" onclick="BOQ.restoreItem('${it.id}')">↺</button>
        </span></div>`;
    }
    const draft=Accounts.current(p);
    const mv=Accounts.itemMovement(p,it,draft);
    const activity=Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9;
    return `<div class="i-row" data-item-id="${it.id}" onclick="Measurements.openItem('${it.id}')">
      <span class="code">${esc(itemFullCode(it))}</span>
      <span class="desc">${esc(it.description||'(ללא תיאור)')}</span>
      <span class="unit-chip">${esc(it.unit)}</span>
      <span class="qty num">${it.contractQty!==''?fn(it.contractQty):'—'}</span>
      <span class="price num">${it.unitPrice!==''?money(it.unitPrice):'—'}</span>
      ${activity?'<span class="stat grow">פעיל בחשבון</span>':''}
      <span class="actions" onclick="event.stopPropagation()">
        <button class="icon-btn" title="דף חישוב להדפסה" onclick="Reports.openItemSheet('${it.id}')">🖨</button>
        <button class="icon-btn" title="עריכה" onclick="BOQ.openItemModal('${it.id}')">✎</button>
        <button class="icon-btn del" title="מחיקה" onclick="BOQ.confirmRemoveItem('${it.id}')">🗑</button>
      </span></div>`;
  },
  openItemModal(editId){
    const p=State.project;
    const it=editId?findItem(p,editId):null;
    const bList=Object.keys(p.buildings), cList=Object.keys(p.chapters), sList=Object.keys(p.subchapters);
    UI.openModal(`<div class="modal-hd">${it?'עריכת סעיף':'סעיף חדש'}<span class="x" onclick="UI.closeModal()">✕</span></div>
      <div class="grid4">
        <div class="fld"><label>מבנה (קוד)</label><input id="im-b" value="${it?esc(it.building):'01'}" list="dl-b"></div>
        <div class="fld"><label>פרק (קוד)</label><input id="im-c" value="${it?esc(it.chapter):'01'}" list="dl-c"></div>
        <div class="fld"><label>תת-פרק (קוד)</label><input id="im-s" value="${it?esc(it.sub):'01'}" list="dl-s"></div>
        <div class="fld"><label>סעיף (קוד)</label><input id="im-i" value="${it?esc(it.item):''}" placeholder="0010"></div>
      </div>
      <div class="grid3" style="margin-top:10px">
        <div class="fld"><label>שם מבנה</label><input id="im-bn" value="${it?esc((p.buildings[it.building]||{}).name||''):''}"></div>
        <div class="fld"><label>שם פרק</label><input id="im-cn" value="${it?esc((p.chapters[it.building+'.'+it.chapter]||{}).name||''):''}"></div>
        <div class="fld"><label>שם תת-פרק</label><input id="im-sn" value="${it?esc((p.subchapters[it.building+'.'+it.chapter+'.'+it.sub]||{}).name||''):''}"></div>
      </div>
      <div class="fld" style="margin-top:10px"><label>תיאור הסעיף</label><textarea id="im-desc">${it?esc(it.description):''}</textarea></div>
      <div class="grid3" style="margin-top:10px">

const BOQSearch = {
  results(project,q){
    q=(q||'').trim().toLowerCase(); if(!q) return [];
    // cancelled items are included on purpose — search is the recovery path for a
    // wrongly-cancelled item (see BOQ.restoreItem); they're just marked as such.
    return project.items.filter(it=>{
      const bn=(project.buildings[it.building]||{}).name||'';
      const cn=(project.chapters[it.building+'.'+it.chapter]||{}).name||'';
      const sn=(project.subchapters[it.building+'.'+it.chapter+'.'+it.sub]||{}).name||'';
      const hay=[itemFullCode(it),it.description,bn,cn,sn].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0,30);
  },
  onInput(v){
    const host=byId('boq-search-results');
    const res=this.results(State.project,v);
    if(!v.trim()||!res.length){ host.classList.remove('show'); host.innerHTML=''; return; }
    host.innerHTML=res.map(it=>{
      const bn=(State.project.buildings[it.building]||{}).name||'';
      return `<div class="boq-search-row" onclick="BOQSearch.goTo('${it.id}')">
        <span class="code">${esc(itemFullCode(it))}</span>
        <span style="flex:1">${esc(it.description||'(ללא תיאור)')}${it.cancelled?' <span class=\"stat chg\">מבוטל</span>':''}</span>
        <span class="path">מבנה ${esc(it.building)} ${esc(bn)}</span></div>`;
    }).join('');
    host.classList.add('show');
  },
  onKey(e){ if(e.key==='Enter'){ const first=qs('#boq-search-results .boq-search-row'); if(first) first.click(); } },
  goTo(itemId){
    const p=State.project, it=findItem(p,itemId); if(!it) return;
    byId('boq-search-results').classList.remove('show');
    if(it.cancelled) BOQ._showCancelled=true;
    BOQ._expanded.add(BOQ.key(it.building)); BOQ._expanded.add(BOQ.key(it.building,it.chapter)); BOQ._expanded.add(BOQ.key(it.building,it.chapter,it.sub));
    App.showTab('boq');
    setTimeout(()=>{
      const row=qs(`.i-row[data-item-id="${itemId}"]`);
      if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.classList.add('hl'); setTimeout(()=>row.classList.remove('hl'),3200); }
    },60);
  },
};

//  MODULE: MEASUREMENTS  (unit-driven entry table, scoped to one BOQ item)

const Measurements = {
  _activeItemId:null,
  _periodOnly:false,
  openItem(itemId){ this._activeItemId=itemId; App.showTab('measurements'); },
  liveRowStatus(m){
    if(m.cancelled) return 'cancelled';
    if(!m.history||!m.history.length) return 'new';
    const item=findItem(State.project,m.itemId);
    const last=m.history[m.history.length-1];
    const cur=approvedRowValue(m,item); // relative to the approved trajectory, not the raw claim
    return Math.abs(cur-nz(last.value))>1e-9 ? 'corrected' : 'approved';
  },
  addRow(itemId){
    const p=State.project;
    p.measurements.push(makeMeasurement({itemId}));
    State.scheduleSave(); App.refresh();
    setTimeout(()=>{ const rows=qsa(`#meas-table tbody tr[data-row-id]`); const last=rows[rows.length-1];
      if(last){ const inp=last.querySelector('input,select,textarea'); inp&&inp.focus(); } },50);
  },
  addGroup(itemId){
    const p=State.project;
    p.measurements.push(makeMeasurement({itemId,isGroup:true,groupLabel:'קבוצה חדשה'}));
    State.scheduleSave(); App.refresh();
  },
  duplicateRow(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    const c=makeMeasurement({...cloneObj(m),id:uid('meas_'),history:[],cancelled:false,approval:null});
    const idx=p.measurements.findIndex(x=>x.id===rowId);
    p.measurements.splice(idx+1,0,c);
    State.scheduleSave(); App.refresh();
  },
  toggleSign(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    m.sign=(m.sign===-1?1:-1); revalidateApproval(m,findItem(p,m.itemId)); State.scheduleSave(); App.refresh();
  },
  setShape(rowId,shape){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    const item=findItem(p,m.itemId), kind=itemUnitKind(item);
    m.shape=shape; m.d1=m.d2=m.d3=''; if(kind!=='volume') m.t='';
    revalidateApproval(m,item);
    State.scheduleSave();
    // area-grouped view has per-area subtotals that a shape change can invalidate
    // (the row's value changes) — those need a real recompute, so fall through
    // to a full refresh there. Otherwise, patch just this <tr> so the rest of
    // the table (scroll position, other rows' in-progress typing) is undisturbed.
    const tr=qs(`tr[data-row-id="${rowId}"]`);
    if(!p.useAreas && tr){
      const n=tr.querySelector('td')?tr.querySelector('td').textContent:'';
      tr.outerHTML=this.renderRow(m,item,kind,p.useAreas,n);
      this.attachKeyNav();
      this.patchItemContext();
    } else {
      App.refresh();
    }
  },
  removeRow(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    if(m.history && m.history.length){
      if(!confirm('לשורה זו יש היסטוריית אישור בחשבון נעול — לא ניתן למחוק לצמיתות. לסמן כמבוטלת?')) return;
      m.cancelled=true;
    } else {
      if(!confirm('למחוק את שורת המדידה?')) return;
      p.measurements=p.measurements.filter(x=>x.id!==rowId);
    }
    State.scheduleSave(); App.refresh();
  },
  restoreRow(rowId){
    const m=State.project.measurements.find(x=>x.id===rowId); if(!m) return;
    m.cancelled=false; State.scheduleSave(); App.refresh();
  },
  removeGroup(rowId){ if(!confirm('למחוק את הקבוצה?')) return;
    State.project.measurements=State.project.measurements.filter(x=>x.id!==rowId); State.scheduleSave(); App.refresh(); },
  liveUpdate(rowId,key,val){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    m[key]=val;
    const item=findItem(p,m.itemId); const kind=itemUnitKind(item);
    if(['d1','d2','d3','t','qty'].includes(key)) revalidateApproval(m,item);
    State.scheduleSave();
    const fEl=byId('f-'+rowId), rEl=byId('r-'+rowId), stEl=byId('st-'+rowId), apEl=byId('ap-'+rowId), shapeEl=byId('shape-'+rowId);
    if(fEl) fEl.innerHTML=this.formulaHTML(m,kind);
    if(rEl){ const v=calcRow(m,item); rEl.textContent=fn(v,3); rEl.className='res '+(v<0?'n':'p'); }
    if(stEl){ const s=this.liveRowStatus(m); stEl.outerHTML=`<span id="st-${rowId}" class="stat ${ROW_STATUS_CLASS[s]}">${ROW_STATUS_LABEL[s]}</span>`; }
    if(apEl) apEl.outerHTML=this.approvalCellHTML(m);
    if(shapeEl) shapeEl.innerHTML=shapeSVG(m.shape,m.d1,m.d2,m.d3,m.sign===-1,false,m.t,kind);
    this.patchItemContext();
    // area-grouped view shows per-area subtotals and buckets rows by their area
    // value — a dimension or area-name edit can invalidate both (wrong subtotal,
    // row in the wrong bucket). The per-row patch above already gives instant
    // feedback, so debounce a full re-render to fix subtotals/placement shortly
    // after the user pauses, rather than re-rendering the whole table every keystroke.
    if(p.useAreas && ['d1','d2','d3','t','qty','area'].includes(key)){
      clearTimeout(this._areaRefreshTimer);
      this._areaRefreshTimer=setTimeout(()=>App.refresh(),700);
    }
  },
  formulaHTML(m,kind){
    const bv=baseVal(m,kind);
    const txt=rowFormulaText(m,kind);
    const warn = kind==='volume' && !bv.complete ? '<span class="ru warn">חסר עובי/אורך</span>' : '';
    return `${esc(txt)}${warn}`;
  },
  patchItemContext(){
    const p=State.project, it=findItem(p,this._activeItemId); if(!it) return;
    const draft=Accounts.current(p); const mv=Accounts.itemMovement(p,it,draft);
    const host=byId('item-ctx-stats'); if(host) host.innerHTML=this.ctxStatsHTML(mv,it);
    const sumEl=byId('meas-sec-sum'); if(sumEl) sumEl.innerHTML=fn(mv.currentCumulative)+' <span class="u">'+esc(it.unit)+'</span>';
  },
  ctxStatsHTML(mv,it){
    const claimedDiffers=Math.abs(mv.claimedCurrentCumulative-mv.currentCumulative)>1e-9;
    return `<div>חוזי<b>${fn(mv.contractQty)}</b></div><div>מצטבר קודם<b>${fn(mv.previousCumulative)}</b></div>
      <div>בתקופה<b>${fn(mv.addition)}</b></div><div>תיקון<b>${fn(mv.correction)}</b></div>
      <div>מצטבר נוכחי (מאושר)<b>${fn(mv.currentCumulative)}</b></div><div>יתרה<b>${fn(mv.balance)}</b></div>
      <div>% ביצוע<b>${pct(mv.completionPct)}</b></div>
      ${claimedDiffers?`<div>מצטבר נתבע<b style="color:var(--gold)">${fn(mv.claimedCurrentCumulative)}</b></div>`:''}
      ${mv.pendingCount>0?`<div>ממתין לאישור<b style="color:var(--gold)">${mv.pendingCount}</b></div>`:''}`;
  },
  openHistory(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    const item=findItem(p,m.itemId);
    let rows='';
    if(!m.history.length) rows='<div class="empty"><div class="ic">🕓</div><div class="t">טרם אושרה בחשבון כלשהו</div></div>';
    else rows=m.history.map(h=>{
      const claimDiffers=h.claimedValue!=null && Math.abs(nz(h.claimedValue)-nz(h.value))>1e-9;

      ${h.action==='created'?`אושר: <b>${fn(h.value)}</b>`:`${fn(h.prevValue)} ← אושר: <b>${fn(h.value)}</b>`} ${item?esc(item.unit):''}
      ${claimDiffers?`<br><span style="color:var(--gold-dk)">נתבע: ${fn(h.claimedValue)} ${item?esc(item.unit):''} (${esc(APPROVAL_STATUS_LABEL[h.approvalStatus]||'הופחת')})</span>`:''}
      ${h.approvalNote?`<br><span style="color:var(--muted);font-size:11px">הערה: ${esc(h.approvalNote)}</span>`:''}
      </div></div>`;
    }).join('');
    UI.openDrawer(`<div class="drawer-hd">🕓 היסטוריית שורה<span class="x" onclick="UI.closeDrawer()">✕</span></div>
      <div class="drawer-bd-content"><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${esc(item?itemFullCode(item):'')} — ${esc(m.desc||'')}</div>
      <div class="val-panel">${rows}</div></div>`);

  openCopyModal(rowIds,fromItemId){
    const p=State.project;
    const opts=p.items.filter(it=>!it.cancelled).map(it=>`<option value="${it.id}">${esc(itemFullCode(it))} — ${esc(it.description||'')}</option>`).join('');

      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>

  },
  doCopy(rowIds){

  },
  // ── submission vs. approval: the reviewer's decision on one row's current claim ──
  openApproval(rowId){

      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>

  },
  toggleApprovalValueField(status){ const f=byId('ap-value-fld'); if(f) f.style.display = status==='reduced'?'block':'none'; },
  saveApproval(rowId){

  attachKeyNav(){
    const table=byId('meas-table'); if(!table) return;
    const els=qsa('input,select,textarea',table);
    els.forEach((el,i)=>{
      el.addEventListener('focus',()=>{ if(el.select) el.select(); });

          e.preventDefault();
          if(i===els.length-1){ this.addRow(this._activeItemId); }
          else { els[i+1].focus(); }
        } else if(e.key==='ArrowDown'&&el.tagName!=='SELECT'){ e.preventDefault(); els[Math.min(i+1,els.length-1)].focus(); }
        else if(e.key==='ArrowUp'&&el.tagName!=='SELECT'){ e.preventDefault(); els[Math.max(i-1,0)].focus(); }
      });

  tableHeaders(kind,useAreas){
    let h=['#','תיאור'];
    if(useAreas) h.push('אזור');
    if(kind==='area'||kind==='volume') h.push('צורה');
    h.push('שרטוט');
    if(kind==='length') h.push('אורך'); else if(kind==='count') h.push('כמות'); else h.push('מידה 1','מידה 2','מידה 3');
    if(kind==='volume') h.push('עובי / אורך');
    h.push('N','נוסחה','±','נתבע','אישור','סטטוס','הערות','');
    return h;
  },
  approvalCellHTML(m){
    const b=approvalBadge(m);
    return `<button id="ap-${m.id}" class="stat ${b.cls}" style="border:none;cursor:pointer" onclick="Measurements.openApproval('${m.id}')" title="לחיצה לקביעת סטטוס אישור">${esc(b.label)}</button>`;
  },
  dimCells(m,kind,shape){
    if(kind==='length') return `<td class="col-dim"><input class="dim-in" placeholder="אורך" value="${esc(m.d1)}" oninput="Measurements.liveUpdate('${m.id}','d1',this.value)"></td>`;
    if(kind==='count') return `<td class="col-dim"><input class="dim-in" placeholder="כמות" value="${esc(m.d1)}" oninput="Measurements.liveUpdate('${m.id}','d1',this.value)"></td>`;
    const dims=shapeDims(shape); let out='';
    for(let i=0;i<3;i++){ const key='d'+(i+1); const lbl=dims[i];
      out+= lbl ? `<td class="col-dim"><input class="dim-in" placeholder="${esc(lbl)}" value="${esc(m[key])}" oninput="Measurements.liveUpdate('${m.id}','${key}',this.value)"></td>` : `<td class="col-dim"></td>`; }
    return out;

  renderRow(m,item,kind,useAreas,n){
    if(m.isGroup){
      const span=this.tableHeaders(kind,useAreas).length-3; // total headers minus (#, תיאור) minus the trailing actions column
      return `<tr class="grp-row" data-row-id="${m.id}" style="background:#F0F4F9"><td colspan="2"><input value="${esc(m.groupLabel)}" style="font-weight:700;color:var(--navy)" oninput="Measurements.liveUpdate('${m.id}','groupLabel',this.value)"></td>
        <td colspan="${span}"></td><td><button class="icon-btn del" onclick="Measurements.removeGroup('${m.id}')">🗑</button></td></tr>`;
    }
    const status=this.liveRowStatus(m);
    const v=calcRow(m,item);
    const shapeSelectable = kind==='area'||kind==='volume';
    let cells=`<td>${n}</td>`;
    cells+=`<td class="col-desc"><textarea class="desc-in" rows="1" oninput="Measurements.liveUpdate('${m.id}','desc',this.value)">${esc(m.desc)}</textarea></td>`;
    if(useAreas) cells+=`<td><input value="${esc(m.area)}" style="min-width:70px" oninput="Measurements.liveUpdate('${m.id}','area',this.value)"></td>`;
    if(shapeSelectable) cells+=`<td><select onchange="Measurements.setShape('${m.id}',this.value)">${Object.keys(CROSS).map(s=>`<option ${m.shape===s?'selected':''}>${s}</option>`).join('')}</select></td>`;
    cells+=`<td class="shape-cell" id="shape-${m.id}">${shapeSVG(m.shape,m.d1,m.d2,m.d3,m.sign===-1,false,m.t,kind)}</td>`;
    cells+=this.dimCells(m,kind,m.shape);
    if(kind==='volume'){ const lbl=m.shape==='שטח מיוחד'?'אורך':'עובי';
      cells+=`<td class="col-dim thick-on"><input class="dim-in" placeholder="${lbl}" value="${esc(m.t)}" oninput="Measurements.liveUpdate('${m.id}','t',this.value)"></td>`; }
    cells+=`<td style="max-width:52px"><input value="${esc(m.qty)}" placeholder="1" oninput="Measurements.liveUpdate('${m.id}','qty',this.value)"></td>`;
    cells+=`<td class="formula" id="f-${m.id}">${this.formulaHTML(m,kind)}</td>`;
    cells+=`<td><span class="sign-pill ${m.sign===-1?'n':'p'}" onclick="Measurements.toggleSign('${m.id}')">${m.sign===-1?'－':'＋'}</span></td>`;
    cells+=`<td class="res ${v<0?'n':'p'}" id="r-${m.id}">${fn(v,3)}</td>`;
    cells+=`<td>${this.approvalCellHTML(m)}</td>`;
    cells+=`<td id="st-${m.id}"><span class="stat ${ROW_STATUS_CLASS[status]}">${ROW_STATUS_LABEL[status]}</span></td>`;
    cells+=`<td><input value="${esc(m.notes)}" style="min-width:80px" oninput="Measurements.liveUpdate('${m.id}','notes',this.value)"></td>`;
    cells+=`<td><span class="actions" style="display:flex;gap:3px;justify-content:center">
      ${m.cancelled?`<button class="icon-btn" title="שחזור" onclick="Measurements.restoreRow('${m.id}')">↺</button>`:`
      <button class="icon-btn" title="שכפול" onclick="Measurements.duplicateRow('${m.id}')">⧉</button>
      <button class="icon-btn" title="היסטוריה" onclick="Measurements.openHistory('${m.id}')">🕓</button>
      <button class="icon-btn" title="העתק לסעיף אחר" onclick="Measurements.openCopyModal(['${m.id}'])">⇥</button>
      <button class="icon-btn del" title="מחיקה" onclick="Measurements.removeRow('${m.id}')">🗑</button>`}
      </span></td>`;
    return `<tr data-row-id="${m.id}" class="${m.cancelled?'cancelled-row':''} ${m.sign===-1?'ded-row':''}">${cells}</tr>`;
  },
  // groups rows by their free-text "area" field (in original order within each
  // area), with a subtotal after each area — turns the column from a label
  // into an actual quantity-by-zone breakdown. Rows without an area sort last
  // under "ללא אזור". Manual isGroup label rows fall into whichever area
  // bucket their own (usually empty) area value puts them in.
  renderAreaGrouped(rows,item,kind,useAreas,colspan){
    const idx=new Map(rows.map((m,i)=>[m,i]));
    const key=m=>{ const a=(m.area||'').trim(); return a||'￿'; };
    const sorted=rows.slice().sort((a,b)=>{ const ka=key(a),kb=key(b); if(ka!==kb) return ka.localeCompare(kb,'he'); return idx.get(a)-idx.get(b); });
    let out='', curArea=undefined, bucket=[], n=0;
    const flush=()=>{
      if(!bucket.length) return;
      const total=bucket.filter(m=>!m.isGroup&&!m.cancelled).reduce((s,m)=>s+calcRow(m,item),0);
      out+=`<tr class="grp-row"><td colspan="${colspan}" style="text-align:right;background:#F0EAD8;color:var(--gold-dk);font-weight:700">📍 ${esc(curArea||'ללא אזור')}</td></tr>`;
      bucket.forEach(m=>{ n++; out+=this.renderRow(m,item,kind,useAreas,n); });
      out+=`<tr class="grp-row"><td colspan="${colspan}" style="text-align:left;direction:ltr;font-weight:800;color:var(--navy)">סה"כ ${esc(curArea||'ללא אזור')}: ${fn(total)} ${esc(item.unit)}</td></tr>`;
      bucket=[];
    };
    sorted.forEach(m=>{
      const a=key(m)==='￿'?'':key(m);
      if(a!==curArea){ flush(); curArea=a; }
      bucket.push(m);
    });
    flush();
    return out;
  },
  render(){
    const p=State.project;
    let itemSel=`<select class="sel-sec" onchange="Measurements.openItem(this.value)">
      <option value="">— בחר סעיף —</option>
      ${p.items.filter(it=>!it.cancelled).sort((a,b)=>itemFullCode(a).localeCompare(itemFullCode(b))).map(it=>
        `<option value="${it.id}" ${this._activeItemId===it.id?'selected':''}>${esc(itemFullCode(it))} — ${esc(it.description||'ללא תיאור')}</option>`).join('')}
      </select>`;
    let h=`<div class="card"><div class="card-hd">📐 מדידות</div><div class="card-bd">
      <div class="meas-tools">${itemSel}
        <label class="opt" style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" ${this._periodOnly?'checked':''} onchange="Measurements._periodOnly=this.checked;App.refresh()">רק שינויים בתקופה הנוכחית</label>
      </div>`;
    const it=this._activeItemId?findItem(p,this._activeItemId):null;
    if(!it){ h+=`<div class="empty"><div class="ic">📐</div><div class="t">בחר סעיף מכתב הכמויות כדי להזין מדידות</div></div></div></div>`; return h; }
    const kind=itemUnitKind(it);
    const draft=Accounts.current(p);
    const mv=Accounts.itemMovement(p,it,draft);
    h+=`<div class="item-context"><div><div class="ic-code">${esc(itemFullCode(it))}</div><div class="ic-name">${esc(it.description||'')}</div></div>
      <div class="ic-stats" id="item-ctx-stats">${this.ctxStatsHTML(mv,it)}</div>
      <button class="icon-btn" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff" title="דף חישוב להדפסה (A4)" onclick="Reports.openItemSheet('${it.id}')">🖨</button></div>`;
    h+=`<div class="formula-hint">⌨ <span class="kbd">Enter</span> שדה הבא / שורה חדשה בסוף &nbsp; <span class="kbd">↑↓</span> ניווט &nbsp;
      <b>יחידת הסעיף: ${esc(it.unit)} (${UNIT_KIND[it.unit].label})</b> — רק צורות וחישובים תואמים ליחידה זו זמינים</div>`;
    let rows=p.measurements.filter(m=>m.itemId===it.id);
    if(this._periodOnly){
      const moved=new Set(Accounts.movementRows(p,it,draft).map(r=>r.id));
      rows=rows.filter(m=>m.isGroup||moved.has(m.id));
    }
    rows=rows.filter(m=>!m.cancelled || true); // keep cancelled visible (dimmed) for traceability
    const headers=this.tableHeaders(kind,p.useAreas);
    h+=`<div class="tbl-wrap responsive-cards"><table id="meas-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
    if(!rows.length) h+=`<tr><td colspan="${headers.length}" style="padding:24px"><div class="empty"><div class="ic">📐</div><div class="t">אין שורות מדידה</div></div></td></tr>`;
    else if(p.useAreas) h+=this.renderAreaGrouped(rows,it,kind,p.useAreas,headers.length);
    else h+=rows.map((m,i)=>this.renderRow(m,it,kind,p.useAreas,i+1)).join('');
    h+=`</tbody></table></div>`;
    if(p.useAreas) h+=`<div class="hint" style="margin:8px 0 -4px;color:var(--muted)">שורות מקובצות וסוכמות לפי עמודת ״אזור״ — השאירו אזור ריק כדי לשייך שורה ל״ללא אזור״</div>`;
    h+=`
      <div class="boq-actions-row" style="margin-top:10px">
        <button class="btn btn-navy btn-sm" onclick="Measurements.addRow('${it.id}')">＋ שורת מדידה</button>
        <button class="btn btn-ghost btn-sm" onclick="Measurements.addGroup('${it.id}')">＋ קבוצה</button>
      </div>
      <div class="sec-sum"><div class="l"><span class="code">${esc(itemFullCode(it))}</span> — ${esc(it.description||'')}</div>
        <div class="r" id="meas-sec-sum">${fn(mv.currentCumulative)} <span class="u">${esc(it.unit)}</span></div></div>
      </div></div>`;
    setTimeout(()=>this.attachKeyNav(),30);
    return h;
  },
};

//  MODULE: WORK WORKSHEET  (fast flat per-account entry grid, Banarit-style —
//  one row per BOQ item with a directly-editable "quantity this period" cell.
//  A quick number still creates a real measurement row under the hood (same
//  approval/history/snapshot machinery as the full geometry calculator), it
//  just uses a trivial pass-through shape so no dimensions are required.
//  Once an item carries a real, detailed calc row, the quick cell locks —
//  otherwise two entry paths could silently disagree about the same figure.
// ═══════════════════════════════════════════════════════════════════════
const WorksheetUI = {
  _building:null,_chapter:null,_sub:null,
  buildings(p){ return [...new Set(p.items.filter(it=>!it.cancelled).map(it=>it.building))].sort(); },
  chapters(p,b){ return [...new Set(p.items.filter(it=>!it.cancelled&&it.building===b).map(it=>it.chapter))].sort(); },
  subs(p,b,c){ return [...new Set(p.items.filter(it=>!it.cancelled&&it.building===b&&it.chapter===c).map(it=>it.sub))].sort(); },
  scopedItems(p){
    return p.items.filter(it=>!it.cancelled&&it.building===this._building&&it.chapter===this._chapter&&it.sub===this._sub)
      .sort((a,b)=>itemFullCode(a).localeCompare(itemFullCode(b)));
  },
  // rows added since the last lock (this period's own additions) for one item —
  // mirrors exactly what Accounts.itemMovement() counts as "addition"
  newRowsForItem(p,it,account){
    const prevSnap=Accounts.previousSnapshot(p,account);
    const prevIds=prevSnap?new Set(prevSnap.measurements.map(x=>x.id)):new Set();
    return p.measurements.filter(m=>!m.isGroup&&!m.cancelled&&m.itemId===it.id&&!prevIds.has(m.id));
  },
  quickInfo(p,it,account){
    const rows=this.newRowsForItem(p,it,account);
    if(!rows.length) return {locked:false,row:null,value:0};
    if(rows.length===1 && rows[0].quickEntry) return {locked:false,row:rows[0],value:calcRow(rows[0],it)};
    return {locked:true,row:null,value:rows.reduce((a,r)=>a+calcRow(r,it),0)};
  },
  quickShapeFor(kind){
    if(kind==='length') return {shape:'קו'};
    if(kind==='count') return {shape:'יחידה'};
    if(kind==='area') return {shape:'שטח מיוחד'};
    return {shape:'שטח מיוחד',t:1}; // volume: direct total — area=d1, ×extrusion 1 = d1
  },
  setScope(level,val){
    if(level==='building'){ this._building=val; this._chapter=null; this._sub=null; }
    else if(level==='chapter'){ this._chapter=val; this._sub=null; }
    else this._sub=val;
    App.refresh();
  },
  setQty(itemId,rowId,val,inputEl){
    const p=State.project, it=findItem(p,itemId); if(!it) return;
    let m;
    if(rowId){
      m=p.measurements.find(x=>x.id===rowId); if(!m) return;
      m.d1=val;
    } else {
      const kind=itemUnitKind(it);
      m=makeMeasurement(Object.assign({itemId,quickEntry:true,d1:val},this.quickShapeFor(kind)));
      p.measurements.push(m);
      if(inputEl) inputEl.dataset.rowId=m.id;
    }
    revalidateApproval(m,it);
    State.scheduleSave();
    this.patchRow(itemId);
  },
  patchRow(itemId){
    const p=State.project, it=findItem(p,itemId); if(!it) return;
    const draft=Accounts.current(p), mv=Accounts.itemMovement(p,it,draft);
    const cumEl=byId('ws-cum-'+itemId); if(cumEl) cumEl.textContent=fn(mv.currentCumulative);
    const pctEl=byId('ws-pct-'+itemId); if(pctEl) pctEl.textContent=pct(mv.completionPct);
    const amtEl=byId('ws-amt-'+itemId); if(amtEl) amtEl.textContent=money(mv.amount);
    const totalEl=byId('ws-sum-total');
    if(totalEl){
      const sum=this.scopedItems(p).reduce((a,x)=>a+Accounts.itemMovement(p,x,draft).amount,0);
      totalEl.textContent=money(sum);
    }
  },
  render(){
    const p=State.project, draft=Accounts.current(p);
    const buildings=this.buildings(p);
    if(!buildings.length) return `<div class="card"><div class="card-hd">🧮 גיליון עבודה מהיר</div><div class="card-bd">
      <div class="empty"><div class="ic">📋</div><div class="t">אין סעיפים בכתב הכמויות עדיין</div></div></div></div>`;
    if(this._building===null||!buildings.includes(this._building)) this._building=buildings[0];
    const chapters=this.chapters(p,this._building);
    if(this._chapter===null||!chapters.includes(this._chapter)) this._chapter=chapters[0];
    const subs=this.subs(p,this._building,this._chapter);
    if(this._sub===null||!subs.includes(this._sub)) this._sub=subs[0];
    let h=`<div class="card"><div class="card-hd">🧮 גיליון עבודה מהיר<span class="hd-sub">חשבון ${esc(draft.number)} (טיוטה) — הזנת כמות בתקופה ישירות בטבלה</span></div>
      <div class="card-bd">
      <div class="rc-row" style="border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:12px;flex-wrap:wrap;display:flex;gap:16px;align-items:center">
        <label class="opt">מבנה<select onchange="WorksheetUI.setScope('building',this.value)">
          ${buildings.map(b=>`<option value="${esc(b)}" ${this._building===b?'selected':''}>${esc(b)}</option>`).join('')}
        </select></label>
        <label class="opt">פרק<select onchange="WorksheetUI.setScope('chapter',this.value)">
          ${chapters.map(c=>`<option value="${esc(c)}" ${this._chapter===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select></label>
        <label class="opt">תת פרק<select onchange="WorksheetUI.setScope('sub',this.value)">
          ${subs.map(s=>`<option value="${esc(s)}" ${this._sub===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select></label>
      </div>`;
    const items=this.scopedItems(p);
    if(!items.length){
      h+=`<div class="empty"><div class="ic">🔍</div><div class="t">אין סעיפים בתת-הפרק הזה</div></div></div></div>`;
      return h;
    }
    h+=`<div class="tbl-wrap responsive-cards"><table class="rtbl ws-table"><thead><tr>
        <th style="width:90px">סעיף</th><th>תיאור</th><th style="width:50px">יחידה</th>
        <th style="width:75px">כמות חוזה</th><th style="width:75px">מצטבר קודם</th>
        <th style="width:120px">כמות בתקופה</th><th style="width:80px">מצטברת</th>
        <th style="width:60px">% ביצוע</th><th style="width:80px">מחיר יחידה</th><th style="width:90px">סה"כ מצטבר</th>
      </tr></thead><tbody>`;
    let sumAmount=0;
    items.forEach(it=>{
      const mv=Accounts.itemMovement(p,it,draft);
      sumAmount+=mv.amount;
      const info=this.quickInfo(p,it,draft);
      const qtyCell = info.locked
        ? `<span class="ws-locked" title="לסעיף זה יש שורות מדידה מפורטות — עריכה דרך המחשבון בלבד">${fn(info.value,3)} 🔒</span>
           <button class="icon-btn" title="פתיחת חישוב כמויות מפורט" onclick="Measurements.openItem('${it.id}');App.showTab('measurements')">🧮</button>`
        : `<input class="ws-qty-in" id="ws-in-${it.id}" data-row-id="${info.row?info.row.id:''}" value="${info.row?esc(info.row.d1):''}" placeholder="0"
             oninput="WorksheetUI.setQty('${it.id}', this.dataset.rowId||null, this.value, this)">
           <button class="icon-btn" title="חישוב כמויות מפורט (שרטוט/נוסחה)" onclick="Measurements.openItem('${it.id}');App.showTab('measurements')">🧮</button>`;
      h+=`<tr>
        <td class="rcode" data-lbl="סעיף">${esc(itemFullCode(it))}</td>
        <td class="rname" data-lbl="תיאור">${esc(it.description||'')}</td>
        <td data-lbl="יחידה">${esc(it.unit)}</td>
        <td class="num" data-lbl="כמות חוזה">${fn(mv.contractQty)}</td>
        <td class="num" data-lbl="מצטבר קודם">${fn(mv.previousCumulative)}</td>
        <td class="ws-qty-cell" data-lbl="כמות בתקופה">${qtyCell}</td>
        <td class="num" id="ws-cum-${it.id}" data-lbl="מצטברת">${fn(mv.currentCumulative)}</td>
        <td class="num" id="ws-pct-${it.id}" data-lbl="% ביצוע">${pct(mv.completionPct)}</td>
        <td class="num" data-lbl="מחיר יחידה">${money(mv.unitPrice)}</td>
        <td class="num" id="ws-amt-${it.id}" data-lbl="סה&quot;כ מצטבר">${money(mv.amount)}</td>
      </tr>`;
    });
    h+=`</tbody><tfoot><tr class="t1"><td colspan="9" style="text-align:left;font-weight:800">סה"כ תת-פרק</td>
        <td class="num" id="ws-sum-total" style="font-weight:800">${money(sumAmount)}</td></tr></tfoot></table></div>
      </div></div>`;
    return h;
  },
};
Screens.worksheet=()=>WorksheetUI.render();

const Dashboard = {
  render(){

      <div class="dash-card"><div class="k">בתקופה הנוכחית</div><div class="v num">${money(totals.periodWithVat)}</div></div>
      <div class="dash-card accent"><div class="k">מצטבר נוכחי (כולל מע"מ)</div><div class="v num">${money(totals.cumulativeWithVat)}</div></div>
      <div class="dash-card"><div class="k">יתרת חוזה</div><div class="v num">${money(totals.balance)}</div></div>
      <div class="dash-card"><div class="k">% ביצוע</div><div class="v">${pct(totals.completionPct)}</div></div>
      <div class="dash-card"><div class="k">סעיפים בכתב הכמויות</div><div class="v">${p.items.filter(it=>!it.cancelled).length}</div></div>

      <div class="dash-card ${v.warnings.length?'warn':''}"><div class="k">אזהרות בדיקה</div><div class="v">${v.warnings.length}</div></div>
      <div class="dash-card ${v.critical.length?'warn':''}"><div class="k">שגיאות קריטיות</div><div class="v">${v.critical.length}</div></div>
      <div class="dash-card"><div class="k">גיבוי אחרון</div><div class="v" style="font-size:15px">${p.lastBackupAt?fdate(p.lastBackupAt):'—'}</div></div>
      <div class="dash-card"><div class="k">חשבונות נעולים</div><div class="v">${Accounts.lockedAccounts(p).length}</div></div>
    </div>`;
    const alerts=[];
    if(v.critical.length) alerts.push({t:'err',msg:`${v.critical.length} שגיאות קריטיות חוסמות נעילת חשבון — יש לתקן בלשונית הבדיקה`});
    if(v.warnings.length) alerts.push({t:'warn',msg:`${v.warnings.length} אזהרות פתוחות לבדיקה לפני נעילה`});
    if(!p.lastBackupAt) alerts.push({t:'info',msg:'טרם בוצע גיבוי לפרויקט זה — מומלץ לייצא גיבוי JSON'});
    const overruns=p.items.filter(it=>!it.cancelled).filter(it=>Accounts.itemMovement(p,it,draft).overrun);
    if(overruns.length) alerts.push({t:'warn',msg:`${overruns.length} סעיפים חורגים מהכמות החוזית`});
    if(alerts.length) h+=`<div class="card"><div class="card-hd">התראות</div><div class="card-bd"><div class="dash-alerts">
      ${alerts.map(a=>`<div class="dash-alert ${a.t}">${a.t==='err'?'⛔':a.t==='warn'?'⚠':'ℹ'} ${esc(a.msg)}</div>`).join('')}
      </div></div></div>`;
    return h;
  },
};

//  MODULE: ACCOUNTS UI  (list screen, lock flow, per-account detail views)
// ═══════════════════════════════════════════════════════════════════════
const AccountsUI = {
  _detailId:null, _mode:'cumulative',
  openDetail(id){ this._detailId=id; this._mode='cumulative'; App.refresh(); },
  back(){ this._detailId=null; App.refresh(); },
  render(){
    const p=State.project;
    if(this._detailId) return this.renderDetail(p,Accounts.byId(p,this._detailId));
    return this.renderList(p);
  },
  renderList(p){
    const draft=Accounts.current(p);
    const v=Validation.run(p);
    let h=`<div class="card"><div class="card-hd">📒 חשבונות</div><div class="card-bd"><div class="acct-list">`+
      Accounts.list(p).slice().reverse().map(a=>{
        const totals=Accounts.projectTotals(p,a);
        return `<div class="acct-row" onclick="AccountsUI.openDetail('${a.id}')">
          <div class="a-no">${esc(a.number)}</div>

          <div class="a-amt">${money(totals.cumulativeWithVat)}</div></div>`;
      }).join('')+`</div></div></div>`;
    h+=`<div class="card"><div class="card-hd">בדיקת תקינות — חשבון ${esc(draft.number)} (טיוטה)<span class="hd-sub">יש לתקן שגיאות קריטיות לפני נעילה</span></div>
      <div class="card-bd">${this.validationPanelHTML(v)}
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-lg" ${v.critical.length?'disabled':''} onclick="AccountsUI.lock()">🔒 אישור ונעילת חשבון ${esc(draft.number)}</button>
        ${Accounts.lockedAccounts(p).length?`<button class="btn btn-ghost" onclick="AccountsUI.unlock()">↺ ביטול נעילה אחרונה</button>`:''}
      </div>
      <div class="hint" style="margin-top:8px;color:var(--muted)">לחיצה זו מאשרת ונועלת את חשבון ${esc(draft.number)} לצמיתות (מצב "נעול", לקריאה בלבד) ופותחת אוטומטית חשבון ${esc(Accounts.nextNumber(p))} כטיוטה חדשה להמשך עבודה.</div>
      </div></div>`;
    return h;
  },
  validationPanelHTML(v){
    const okCount=State.project.items.filter(it=>!it.cancelled).length - new Set(v.critical.map(x=>x.itemId)).size;
    let h=`<div class="val-summary">
      <div class="vs ok"><div class="n">${Math.max(0,okCount)}</div>סעיפים תקינים</div>
      <div class="vs warn"><div class="n">${v.warnings.length}</div>אזהרות</div>
      <div class="vs err"><div class="n">${v.critical.length}</div>שגיאות קריטיות</div></div><div class="val-panel">`;
    v.critical.forEach(c=>h+=`<div class="val-row err"><span class="ic">✕</span><div class="txt">${esc(c.msg)}</div></div>`);
    v.warnings.forEach(w=>h+=`<div class="val-row warn"><span class="ic">⚠</span><div class="txt">${esc(w.msg)}</div></div>`);
    if(!v.critical.length&&!v.warnings.length) h+=`<div class="val-row ok"><span class="ic">✓</span><div class="txt">כל הסעיפים תקינים — ניתן לנעול את החשבון</div></div>`;
    return h+'</div>';
  },
  lock(){
    const p=State.project, v=Validation.run(p);
    if(v.critical.length){ toast('⛔ יש לתקן שגיאות קריטיות לפני נעילה','err'); return; }
    if(v.warnings.length && !confirm(`יש ${v.warnings.length} אזהרות פתוחות (למשל חריגה מכמות חוזית). להמשיך ולנעול בכל זאת?`)) return;
    const draft=Accounts.current(p);
    if(!confirm(`לנעול את חשבון ${draft.number}? לאחר הנעילה לא ניתן יהיה לערוך את נתוניו — כל שינוי עתידי יירשם כתיקון בחשבון הבא.`)) return;
    const r=Accounts.lock(p);
    if(!r.ok){ toast('⛔ '+(r.critical[0]&&r.critical[0].msg||'שגיאה בנעילה'),'err'); return; }
    State.scheduleSave(); toast(`חשבון ${r.locked.number} ננעל — נפתח חשבון ${r.next.number}`,'ok'); App.refresh();
  },
  unlock(){
    const r=Accounts.unlockLast(State.project);
    if(!r.ok){ toast('⛔ '+r.msg,'err'); return; }
    State.scheduleSave(); toast('הנעילה בוטלה'); App.refresh();
  },
  renderDetail(p,a){
    if(!a) return this.renderList(p);
    const totals=Accounts.projectTotals(p,a);
    const items=p.items.filter(it=>!it.cancelled||(a.snapshot&&a.snapshot.items.some(x=>x.id===it.id)));
    let h=`<div class="card"><div class="card-hd"><button class="icon-btn" style="background:rgba(255,255,255,.15);color:#fff;border:none" onclick="AccountsUI.back()">→</button>
      חשבון ${esc(a.number)}<span class="stat ${a.status}" style="margin-inline-start:6px">${ACCOUNT_STATUS_LABEL[a.status]}</span>
      <span class="hd-sub">${fdate(a.date)}${a.lockedAt?' · ננעל '+fdate(a.lockedAt):''}</span></div>
      <div class="card-bd">
      <div class="mode-toggle" style="max-width:420px;margin-bottom:14px">
        <button class="${this._mode==='cumulative'?'on':''}" onclick="AccountsUI.setMode('cumulative')">מצטבר עד חשבון זה</button>
        <button class="${this._mode==='movement'?'on':''}" onclick="AccountsUI.setMode('movement')">רק תנועה בחשבון זה</button></div>
      <div class="scards">
        <div class="scard"><div class="sc-k">מצטבר קודם</div><div class="sc-v">${money(totals.previousAmount)}</div></div>
        <div class="scard"><div class="sc-k">בתקופה</div><div class="sc-v">${money(totals.periodAmount)}</div></div>
        <div class="scard"><div class="sc-k">מצטבר נוכחי</div><div class="sc-v">${money(totals.cumulativeAmount)}</div></div>
        <div class="scard"><div class="sc-k">כולל מע"מ</div><div class="sc-v">${money(totals.cumulativeWithVat)}</div></div>
        <div class="scard"><div class="sc-k">% ביצוע</div><div class="sc-v">${pct(totals.completionPct)}</div></div></div>
      <div class="tbl-wrap responsive-cards"><table><thead><tr><th>קוד</th><th>תיאור</th><th>יח'</th><th>חוזי</th>
        <th>מצטבר קודם</th><th>בתקופה</th><th>תיקון</th><th>מצטבר נתבע</th><th>מצטבר מאושר</th><th>יתרה</th><th>% ביצוע</th></tr></thead><tbody>`;
    let rowsOut=0;
    items.forEach(it=>{
      const mv=Accounts.itemMovement(p,it,a);
      if(this._mode==='movement' && Math.abs(mv.addition)+Math.abs(mv.correction)<1e-9) return;
      rowsOut++;
      const claimDiffers=Math.abs(mv.claimedCurrentCumulative-mv.currentCumulative)>1e-9;
      h+=`<tr onclick="Measurements.openItem('${it.id}');App.showTab('measurements')" style="cursor:pointer">
        <td data-lbl="קוד" class="num">${esc(itemFullCode(it))}</td><td data-lbl="תיאור" style="text-align:right">${esc(it.description||'')}</td>
        <td data-lbl="יח'">${esc(it.unit)}</td><td data-lbl="חוזי" class="num">${fn(mv.contractQty)}</td>
        <td data-lbl="מצטבר קודם" class="num">${fn(mv.previousCumulative)}</td>
        <td data-lbl="בתקופה" class="num ${mv.addition?'per-pos':''}">${fn(mv.addition)}</td>
        <td data-lbl="תיקון" class="num ${mv.correction?'per-neg':''}">${fn(mv.correction)}</td>
        <td data-lbl="מצטבר נתבע" class="num" style="${claimDiffers?'color:var(--gold-dk)':''}">${fn(mv.claimedCurrentCumulative)}</td>
        <td data-lbl="מצטבר מאושר" class="num" style="font-weight:700">${fn(mv.currentCumulative)}</td>
        <td data-lbl="יתרה" class="num">${fn(mv.balance)}</td>
        <td data-lbl="% ביצוע" class="num ${mv.overrun?'per-neg':''}">${pct(mv.completionPct)}</td></tr>`;
    });
    if(!rowsOut) h+=`<tr><td colspan="11"><div class="empty"><div class="t">אין תנועה להצגה במצב זה</div></div></td></tr>`;
    h+=`</tbody></table></div>
      <div style="margin-top:14px"><button class="btn btn-ghost" onclick="Reports.openAccountReport('${a.id}')">🖨 דוח חשבון זה</button></div>
      </div></div>`;
    return h;
  },
  setMode(m){ this._mode=m; App.refresh(); },
};
