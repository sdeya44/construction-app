//  MODULE: MEASUREMENTS  (unit-driven entry table, scoped to one BOQ item)
// ═══════════════════════════════════════════════════════════════════════
const Measurements = {
  _activeItemId:null,
  _periodOnly:false,
  openItem(itemId){ this._activeItemId=itemId; App.showTab('measurements'); },
  liveRowStatus(m){
    if(m.cancelled) return 'cancelled';
    if(!m.history||!m.history.length) return 'new';
    const item=findItem(State.project,m.itemId);
    const last=m.history[m.history.length-1];
    const cur=calcRow(m,item);
    return Math.abs(cur-nz(last.value))>1e-9 ? 'corrected' : 'approved';
  },
  addRow(itemId){
    const p=State.project;
    p.measurements.push(makeMeasurement({itemId}));
    State.scheduleSave(); App.refresh();
    setTimeout(()=>{ const rows=qsa(`#meas-table tbody tr[data-row-id]`); const last=rows[rows.length-1];
      if(last){ const inp=last.querySelector('input,select,textarea'); inp&&inp.focus(); } },50);
  },
  addGroup(itemId){
    const p=State.project;
    p.measurements.push(makeMeasurement({itemId,isGroup:true,groupLabel:'קבוצה חדשה'}));
    State.scheduleSave(); App.refresh();
  },
  duplicateRow(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    const c=makeMeasurement({...cloneObj(m),id:uid('meas_'),history:[],cancelled:false});
    const idx=p.measurements.findIndex(x=>x.id===rowId);
    p.measurements.splice(idx+1,0,c);
    State.scheduleSave(); App.refresh();
  },
  toggleSign(rowId){
    const m=State.project.measurements.find(x=>x.id===rowId); if(!m) return;
    m.sign=(m.sign===-1?1:-1); State.scheduleSave(); App.refresh();
  },
  setShape(rowId,shape){
    const m=State.project.measurements.find(x=>x.id===rowId); if(!m) return;
    m.shape=shape; m.d1=m.d2=m.d3=''; if(itemUnitKind(findItem(State.project,m.itemId))!=='volume') m.t='';
    State.scheduleSave(); App.refresh();
  },
  removeRow(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    if(m.history && m.history.length){
      if(!confirm('לשורה זו יש היסטוריית אישור בחשבון נעול — לא ניתן למחוק לצמיתות. לסמן כמבוטלת?')) return;
      m.cancelled=true;
    } else {
      if(!confirm('למחוק את שורת המדידה?')) return;
      p.measurements=p.measurements.filter(x=>x.id!==rowId);
    }
    State.scheduleSave(); App.refresh();
  },
  restoreRow(rowId){
    const m=State.project.measurements.find(x=>x.id===rowId); if(!m) return;
    m.cancelled=false; State.scheduleSave(); App.refresh();
  },
  removeGroup(rowId){ if(!confirm('למחוק את הקבוצה?')) return;
    State.project.measurements=State.project.measurements.filter(x=>x.id!==rowId); State.scheduleSave(); App.refresh(); },
  liveUpdate(rowId,key,val){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    m[key]=val; State.scheduleSave();
    const item=findItem(p,m.itemId); const kind=itemUnitKind(item);
    const fEl=byId('f-'+rowId), rEl=byId('r-'+rowId), stEl=byId('st-'+rowId);
    if(fEl) fEl.innerHTML=this.formulaHTML(m,kind);
    if(rEl){ const v=calcRow(m,item); rEl.textContent=fn(v,3); rEl.className='res '+(v<0?'n':'p'); }
    if(stEl){ const s=this.liveRowStatus(m); stEl.outerHTML=`<span id="st-${rowId}" class="stat ${ROW_STATUS_CLASS[s]}">${ROW_STATUS_LABEL[s]}</span>`; }
    this.patchItemContext();
  },
  formulaHTML(m,kind){
    const bv=baseVal(m,kind);
    const lbl=rowFormulaLabel(m,kind);
    const warn = kind==='volume' && !bv.complete ? '<span class="ru warn">חסר עובי/אורך</span>' : '';
    return `${esc(lbl)}${warn}`;
  },
  patchItemContext(){
    const p=State.project, it=findItem(p,this._activeItemId); if(!it) return;
    const draft=Accounts.current(p); const mv=Accounts.itemMovement(p,it,draft);
    const host=byId('item-ctx-stats'); if(host) host.innerHTML=this.ctxStatsHTML(mv,it);
    const sumEl=byId('meas-sec-sum'); if(sumEl) sumEl.innerHTML=fn(mv.currentCumulative)+' <span class="u">'+esc(it.unit)+'</span>';
  },
  ctxStatsHTML(mv,it){
    return `<div>חוזי<b>${fn(mv.contractQty)}</b></div><div>מצטבר קודם<b>${fn(mv.previousCumulative)}</b></div>
      <div>בתקופה<b>${fn(mv.addition)}</b></div><div>תיקון<b>${fn(mv.correction)}</b></div>
      <div>מצטבר נוכחי<b>${fn(mv.currentCumulative)}</b></div><div>יתרה<b>${fn(mv.balance)}</b></div>
      <div>% ביצוע<b>${pct(mv.completionPct)}</b></div>`;
  },
  openHistory(rowId){
    const p=State.project, m=p.measurements.find(x=>x.id===rowId); if(!m) return;
    const item=findItem(p,m.itemId);
    let rows='';
    if(!m.history.length) rows='<div class="empty"><div class="ic">🕓</div><div class="t">טרם אושרה בחשבון כלשהו</div></div>';
    else rows=m.history.map(h=>`<div class="val-row ${h.action==='cancelled'?'err':(h.action==='created'?'ok':'warn')}">
      <span class="ic">${h.action==='created'?'✚':h.action==='cancelled'?'✕':'✎'}</span>
      <div class="txt"><b>חשבון ${esc(h.accountNumber)}</b> — ${esc(ROW_HIST_LABEL[h.action])} · ${fdate(h.date)}<br>
      ${h.action==='created'?`ערך: <b>${fn(h.value)}</b>`:`${fn(h.prevValue)} ← ${fn(h.value)}`} ${item?esc(item.unit):''}</div></div>`).join('');
    UI.openDrawer(`<div class="drawer-hd">🕓 היסטוריית שורה<span class="x" onclick="UI.closeDrawer()">✕</span></div>
      <div class="drawer-bd-content"><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${esc(item?itemFullCode(item):'')} — ${esc(m.desc||'')}</div>
      <div class="val-panel">${rows}</div></div>`);
  },
  openCopyModal(rowIds,fromItemId){
    const p=State.project;
    const opts=p.items.filter(it=>!it.cancelled).map(it=>`<option value="${it.id}">${esc(itemFullCode(it))} — ${esc(it.description||'')}</option>`).join('');
    UI.openModal(`<div class="modal-hd">העתקה לסעיף אחר<span class="x" onclick="UI.closeModal()">✕</span></div>
      <div class="fld"><label>סעיף יעד</label><select id="cp-target">${opts}</select></div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>
        <button class="btn btn-gold" onclick="Measurements.doCopy(${JSON.stringify(rowIds)})">העתק</button></div>`);
  },
  doCopy(rowIds){
    const p=State.project, target=byId('cp-target').value;
    rowIds.forEach(id=>{ const m=p.measurements.find(x=>x.id===id); if(!m) return;
      p.measurements.push(makeMeasurement({...cloneObj(m),id:uid('meas_'),itemId:target,history:[],cancelled:false})); });
    UI.closeModal(); State.scheduleSave(); toast(`${rowIds.length} שורות הועתקו`); App.refresh();
  },
  attachKeyNav(){
    const table=byId('meas-table'); if(!table) return;
    const els=qsa('input,select,textarea',table);
    els.forEach((el,i)=>{
      el.addEventListener('focus',()=>{ if(el.select) el.select(); });
      el.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          if(i===els.length-1){ this.addRow(this._activeItemId); }
          else { els[i+1].focus(); }
        } else if(e.key==='ArrowDown'&&el.tagName!=='SELECT'){ e.preventDefault(); els[Math.min(i+1,els.length-1)].focus(); }
        else if(e.key==='ArrowUp'&&el.tagName!=='SELECT'){ e.preventDefault(); els[Math.max(i-1,0)].focus(); }
      });
    });
  },
  tableHeaders(kind,useAreas){
    let h=['#','תיאור'];
    if(useAreas) h.push('אזור');
    if(kind==='area'||kind==='volume') h.push('צורה');
    if(kind==='length') h.push('אורך'); else if(kind==='count') h.push('כמות'); else h.push('מידה 1','מידה 2','מידה 3');
    if(kind==='volume') h.push('עובי / אורך');
    h.push('N','נוסחה','±','תוצאה','סטטוס','הערות','');
    return h;
  },
  dimCells(m,kind,shape){
    if(kind==='length') return `<td class="col-dim"><input class="dim-in" placeholder="אורך" value="${esc(m.d1)}" oninput="Measurements.liveUpdate('${m.id}','d1',this.value)"></td>`;
    if(kind==='count') return `<td class="col-dim"><input class="dim-in" placeholder="כמות" value="${esc(m.d1)}" oninput="Measurements.liveUpdate('${m.id}','d1',this.value)"></td>`;
    const dims=shapeDims(shape); let out='';
    for(let i=0;i<3;i++){ const key='d'+(i+1); const lbl=dims[i];
      out+= lbl ? `<td class="col-dim"><input class="dim-in" placeholder="${esc(lbl)}" value="${esc(m[key])}" oninput="Measurements.liveUpdate('${m.id}','${key}',this.value)"></td>` : `<td class="col-dim"></td>`; }
    return out;
  },
  renderRow(m,item,kind,useAreas,n){
    if(m.isGroup){
      const span=5+(useAreas?1:0)+(kind==='volume'?1:0);
      return `<tr class="grp-row" data-row-id="${m.id}" style="background:#F0F4F9"><td colspan="2"><input value="${esc(m.groupLabel)}" style="font-weight:700;color:var(--navy)" oninput="Measurements.liveUpdate('${m.id}','groupLabel',this.value)"></td>
        <td colspan="${span}"></td><td><button class="icon-btn del" onclick="Measurements.removeGroup('${m.id}')">🗑</button></td></tr>`;
    }
    const status=this.liveRowStatus(m);
    const v=calcRow(m,item);
    const shapeSelectable = kind==='area'||kind==='volume';
    let cells=`<td>${n}</td>`;
    cells+=`<td class="col-desc"><textarea class="desc-in" rows="1" oninput="Measurements.liveUpdate('${m.id}','desc',this.value)">${esc(m.desc)}</textarea></td>`;
    if(useAreas) cells+=`<td><input value="${esc(m.area)}" style="min-width:70px" oninput="Measurements.liveUpdate('${m.id}','area',this.value)"></td>`;
    if(shapeSelectable) cells+=`<td><select onchange="Measurements.setShape('${m.id}',this.value)">${Object.keys(CROSS).map(s=>`<option ${m.shape===s?'selected':''}>${s}</option>`).join('')}</select></td>`;
    cells+=this.dimCells(m,kind,m.shape);
    if(kind==='volume'){ const lbl=m.shape==='שטח מיוחד'?'אורך':'עובי';
      cells+=`<td class="col-dim thick-on"><input class="dim-in" placeholder="${lbl}" value="${esc(m.t)}" oninput="Measurements.liveUpdate('${m.id}','t',this.value)"></td>`; }
    cells+=`<td style="max-width:52px"><input value="${esc(m.qty)}" placeholder="1" oninput="Measurements.liveUpdate('${m.id}','qty',this.value)"></td>`;
    cells+=`<td class="formula" id="f-${m.id}">${this.formulaHTML(m,kind)}</td>`;
    cells+=`<td><span class="sign-pill ${m.sign===-1?'n':'p'}" onclick="Measurements.toggleSign('${m.id}')">${m.sign===-1?'－':'＋'}</span></td>`;
    cells+=`<td class="res ${v<0?'n':'p'}" id="r-${m.id}">${fn(v,3)}</td>`;
    cells+=`<td id="st-${m.id}"><span class="stat ${ROW_STATUS_CLASS[status]}">${ROW_STATUS_LABEL[status]}</span></td>`;
    cells+=`<td><input value="${esc(m.notes)}" style="min-width:80px" oninput="Measurements.liveUpdate('${m.id}','notes',this.value)"></td>`;
    cells+=`<td><span class="actions" style="display:flex;gap:3px;justify-content:center">
      ${m.cancelled?`<button class="icon-btn" title="שחזור" onclick="Measurements.restoreRow('${m.id}')">↺</button>`:`
      <button class="icon-btn" title="שכפול" onclick="Measurements.duplicateRow('${m.id}')">⧉</button>
      <button class="icon-btn" title="היסטוריה" onclick="Measurements.openHistory('${m.id}')">🕓</button>
      <button class="icon-btn" title="העתק לסעיף אחר" onclick="Measurements.openCopyModal(['${m.id}'])">⇥</button>
      <button class="icon-btn del" title="מחיקה" onclick="Measurements.removeRow('${m.id}')">🗑</button>`}
      </span></td>`;
    return `<tr data-row-id="${m.id}" class="${m.cancelled?'cancelled-row':''} ${m.sign===-1?'ded-row':''}">${cells}</tr>`;
  },
  render(){
    const p=State.project;
    let itemSel=`<select class="sel-sec" onchange="Measurements.openItem(this.value)">
      <option value="">— בחר סעיף —</option>
      ${p.items.filter(it=>!it.cancelled).sort((a,b)=>itemFullCode(a).localeCompare(itemFullCode(b))).map(it=>
        `<option value="${it.id}" ${this._activeItemId===it.id?'selected':''}>${esc(itemFullCode(it))} — ${esc(it.description||'ללא תיאור')}</option>`).join('')}
      </select>`;
    let h=`<div class="card"><div class="card-hd">📐 מדידות</div><div class="card-bd">
      <div class="meas-tools">${itemSel}
        <label class="opt" style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" ${this._periodOnly?'checked':''} onchange="Measurements._periodOnly=this.checked;App.refresh()">רק שינויים בתקופה הנוכחית</label>
      </div>`;
    const it=this._activeItemId?findItem(p,this._activeItemId):null;
    if(!it){ h+=`<div class="empty"><div class="ic">📐</div><div class="t">בחר סעיף מכתב הכמויות כדי להזין מדידות</div></div></div></div>`; return h; }
    const kind=itemUnitKind(it);
    const draft=Accounts.current(p);
    const mv=Accounts.itemMovement(p,it,draft);
    h+=`<div class="item-context"><div><div class="ic-code">${esc(itemFullCode(it))}</div><div class="ic-name">${esc(it.description||'')}</div></div>
      <div class="ic-stats" id="item-ctx-stats">${this.ctxStatsHTML(mv,it)}</div></div>`;
    h+=`<div class="formula-hint">⌨ <span class="kbd">Enter</span> שדה הבא / שורה חדשה בסוף &nbsp; <span class="kbd">↑↓</span> ניווט &nbsp;
      <b>יחידת הסעיף: ${esc(it.unit)} (${UNIT_KIND[it.unit].label})</b> — רק צורות וחישובים תואמים ליחידה זו זמינים</div>`;
    let rows=p.measurements.filter(m=>m.itemId===it.id);
    if(this._periodOnly){
      const moved=new Set(Accounts.movementRows(p,it,draft).map(r=>r.id));
      rows=rows.filter(m=>m.isGroup||moved.has(m.id));
    }
    rows=rows.filter(m=>!m.cancelled || true); // keep cancelled visible (dimmed) for traceability
    h+=`<div class="tbl-wrap responsive-cards"><table id="meas-table"><thead><tr>${this.tableHeaders(kind,p.useAreas).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
    if(!rows.length) h+=`<tr><td colspan="14" style="padding:24px"><div class="empty"><div class="ic">📐</div><div class="t">אין שורות מדידה</div></div></td></tr>`;
    else h+=rows.map((m,i)=>this.renderRow(m,it,kind,p.useAreas,i+1)).join('');
    h+=`</tbody></table></div>
      <div class="boq-actions-row" style="margin-top:10px">
        <button class="btn btn-navy btn-sm" onclick="Measurements.addRow('${it.id}')">＋ שורת מדידה</button>
        <button class="btn btn-ghost btn-sm" onclick="Measurements.addGroup('${it.id}')">＋ קבוצה</button>
      </div>
      <div class="sec-sum"><div class="l"><span class="code">${esc(itemFullCode(it))}</span> — ${esc(it.description||'')}</div>
        <div class="r" id="meas-sec-sum">${fn(mv.currentCumulative)} <span class="u">${esc(it.unit)}</span></div></div>
      </div></div>`;
    setTimeout(()=>this.attachKeyNav(),30);
    return h;
  },
};
Screens.measurements=()=>Measurements.render();

const Dashboard = {
  render(){
    const p=State.project;
    const draft=Accounts.current(p);
    const totals=Accounts.projectTotals(p,draft);
    const v=Validation.run(p);
    const activeItems=p.items.filter(it=>!it.cancelled).filter(it=>{ const mv=Accounts.itemMovement(p,it,draft); return Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9; });
    let h=`<div class="dash-hero">
      <div class="info"><div class="lbl">חשבון פעיל</div><div class="big">חשבון <b>${esc(draft.number)}</b> · טיוטה</div>
        <div class="completion-bar"><i style="width:${Math.min(100,totals.completionPct)}%"></i></div>
        <div style="font-size:11.5px;color:#B9C7D9;margin-top:6px">${pct(totals.completionPct)} מהיקף החוזה בוצע</div></div>
      <button class="btn btn-gold btn-lg" onclick="App.showTab('boq')">המשך עבודה בחשבון ${esc(draft.number)} ←</button>
    </div>`;
    h+=`<div class="dash-grid">
      <div class="dash-card accent"><div class="k">סה"כ חוזה (כולל מע"מ)</div><div class="v num">${money(totals.contractTotal*(1+nz(p.vat)/100))}</div></div>
      <div class="dash-card"><div class="k">מצטבר קודם</div><div class="v num">${money(totals.previousAmount)}</div></div>
      <div class="dash-card"><div class="k">בתקופה הנוכחית</div><div class="v num">${money(totals.periodWithVat)}</div></div>
      <div class="dash-card accent"><div class="k">מצטבר נוכחי (כולל מע"מ)</div><div class="v num">${money(totals.cumulativeWithVat)}</div></div>
      <div class="dash-card"><div class="k">יתרת חוזה</div><div class="v num">${money(totals.balance)}</div></div>
      <div class="dash-card"><div class="k">% ביצוע</div><div class="v">${pct(totals.completionPct)}</div></div>
      <div class="dash-card"><div class="k">סעיפים בכתב הכמויות</div><div class="v">${p.items.filter(it=>!it.cancelled).length}</div></div>
      <div class="dash-card"><div class="k">סעיפים פעילים בחשבון</div><div class="v">${activeItems.length}</div></div>
      <div class="dash-card ${v.warnings.length?'warn':''}"><div class="k">אזהרות בדיקה</div><div class="v">${v.warnings.length}</div></div>
      <div class="dash-card ${v.critical.length?'warn':''}"><div class="k">שגיאות קריטיות</div><div class="v">${v.critical.length}</div></div>
      <div class="dash-card"><div class="k">גיבוי אחרון</div><div class="v" style="font-size:15px">${p.lastBackupAt?fdate(p.lastBackupAt):'—'}</div></div>
      <div class="dash-card"><div class="k">חשבונות נעולים</div><div class="v">${Accounts.lockedAccounts(p).length}</div></div>
    </div>`;
    const alerts=[];
    if(v.critical.length) alerts.push({t:'err',msg:`${v.critical.length} שגיאות קריטיות חוסמות נעילת חשבון — יש לתקן בלשונית הבדיקה`});
    if(v.warnings.length) alerts.push({t:'warn',msg:`${v.warnings.length} אזהרות פתוחות לבדיקה לפני נעילה`});
    if(!p.lastBackupAt) alerts.push({t:'info',msg:'טרם בוצע גיבוי לפרויקט זה — מומלץ לייצא גיבוי JSON'});
    const overruns=p.items.filter(it=>!it.cancelled).filter(it=>Accounts.itemMovement(p,it,draft).overrun);
    if(overruns.length) alerts.push({t:'warn',msg:`${overruns.length} סעיפים חורגים מהכמות החוזית`});
    if(alerts.length) h+=`<div class="card"><div class="card-hd">התראות</div><div class="card-bd"><div class="dash-alerts">
      ${alerts.map(a=>`<div class="dash-alert ${a.t}">${a.t==='err'?'⛔':a.t==='warn'?'⚠':'ℹ'} ${esc(a.msg)}</div>`).join('')}
      </div></div></div>`;
    return h;
  },
};
Screens.dashboard=()=>Dashboard.render();

//  MODULE: ACCOUNTS UI  (list screen, lock flow, per-account detail views)
// ═══════════════════════════════════════════════════════════════════════
const AccountsUI = {
  _detailId:null, _mode:'cumulative',
  openDetail(id){ this._detailId=id; this._mode='cumulative'; App.refresh(); },
  back(){ this._detailId=null; App.refresh(); },
  render(){
    const p=State.project;
    if(this._detailId) return this.renderDetail(p,Accounts.byId(p,this._detailId));
    return this.renderList(p);
  },
  renderList(p){
    const draft=Accounts.current(p);
    const v=Validation.run(p);
    let h=`<div class="card"><div class="card-hd">📒 חשבונות</div><div class="card-bd"><div class="acct-list">`+
      Accounts.list(p).slice().reverse().map(a=>{
        const totals=Accounts.projectTotals(p,a);
        return `<div class="acct-row" onclick="AccountsUI.openDetail('${a.id}')">
          <div class="a-no">${esc(a.number)}</div>
          <div class="a-date">${fdate(a.date)}</div>
          <div class="a-mid"><span class="stat ${a.status}">${ACCOUNT_STATUS_LABEL[a.status]}</span></div>
          <div class="a-amt">${money(totals.cumulativeWithVat)}</div></div>`;
      }).join('')+`</div></div></div>`;
    h+=`<div class="card"><div class="card-hd">בדיקת תקינות — חשבון ${esc(draft.number)} (טיוטה)<span class="hd-sub">יש לתקן שגיאות קריטיות לפני נעילה</span></div>
      <div class="card-bd">${this.validationPanelHTML(v)}
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-lg" ${v.critical.length?'disabled':''} onclick="AccountsUI.lock()">🔒 נעילת חשבון ${esc(draft.number)}</button>
        ${Accounts.lockedAccounts(p).length?`<button class="btn btn-ghost" onclick="AccountsUI.unlock()">↺ ביטול נעילה אחרונה</button>`:''}
      </div></div></div>`;
    return h;
  },
  validationPanelHTML(v){
    const okCount=State.project.items.filter(it=>!it.cancelled).length - new Set(v.critical.map(x=>x.itemId)).size;
    let h=`<div class="val-summary">
      <div class="vs ok"><div class="n">${Math.max(0,okCount)}</div>סעיפים תקינים</div>
      <div class="vs warn"><div class="n">${v.warnings.length}</div>אזהרות</div>
      <div class="vs err"><div class="n">${v.critical.length}</div>שגיאות קריטיות</div></div><div class="val-panel">`;
    v.critical.forEach(c=>h+=`<div class="val-row err"><span class="ic">✕</span><div class="txt">${esc(c.msg)}</div></div>`);
    v.warnings.forEach(w=>h+=`<div class="val-row warn"><span class="ic">⚠</span><div class="txt">${esc(w.msg)}</div></div>`);
    if(!v.critical.length&&!v.warnings.length) h+=`<div class="val-row ok"><span class="ic">✓</span><div class="txt">כל הסעיפים תקינים — ניתן לנעול את החשבון</div></div>`;
    return h+'</div>';
  },
  lock(){
    const p=State.project, v=Validation.run(p);
    if(v.critical.length){ toast('⛔ יש לתקן שגיאות קריטיות לפני נעילה','err'); return; }
    if(v.warnings.length && !confirm(`יש ${v.warnings.length} אזהרות פתוחות (למשל חריגה מכמות חוזית). להמשיך ולנעול בכל זאת?`)) return;
    const draft=Accounts.current(p);
    if(!confirm(`לנעול את חשבון ${draft.number}? לאחר הנעילה לא ניתן יהיה לערוך את נתוניו — כל שינוי עתידי יירשם כתיקון בחשבון הבא.`)) return;
    const r=Accounts.lock(p);
    if(!r.ok){ toast('⛔ '+(r.critical[0]&&r.critical[0].msg||'שגיאה בנעילה'),'err'); return; }
    State.scheduleSave(); toast(`חשבון ${r.locked.number} ננעל — נפתח חשבון ${r.next.number}`,'ok'); App.refresh();

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: SKN IMPORT
//  Fixed-width SKN line layout (positions confirmed from the reference file):
//    0-2 building, 2-4 chapter, 4-6 subchapter, 6-10 item, 10-12 unit code.
//  Positions 12-21 are unused by the previous version's parser; that gap is
//  exactly where a per-line contract-quantity field would sit in this layout
//  (immediately after the unit code, before the price column at 21-33). We
//  parse it as the contract quantity, but — per spec — do NOT trust that
//  guess blindly: every parsed quantity is shown in the preview below for
//  the user to verify (and correct inline) before anything is imported.
// ═══════════════════════════════════════════════════════════════════════
const SKN_UNIT_MAP={'01':"יחידה",'02':'מ"א','03':'מ"ר','04':'מ"ק','05':'טון','06':'ק"ג','07':'שעות','08':'שעות','09':"יחידה"};
const SKNImport = {
  parsed:null,
  parse(text){
    const lines=text.split(/\r?\n/); const buildings={};
    for(const line of lines){
      if(!line||line.length<10) continue;
      if(line[0]===' '||line[0]==='\t') continue; // continuation lines (wrapped desc) — ignored for structure
      const bld=line.substring(0,2),ch=line.substring(2,4),sub=line.substring(4,6),itm=line.substring(6,10),unit=line.substring(10,12);
      const qtyRaw=line.length>=21?line.substring(12,21).trim():'';
      const price=line.length>=33?line.substring(21,33).trim():'';
      const desc=line.length>33?line.substring(33).trim():'';
      if(!/^\d{2}$/.test(bld)||bld==='00') continue;
      if(!buildings[bld]) buildings[bld]={name:'',chapters:{}}; const B=buildings[bld];
      if(ch==='00'){ if(!B.name&&desc) B.name=desc; continue; }
      if(!B.chapters[ch]) B.chapters[ch]={name:'',subs:{}}; const C=B.chapters[ch];
      if(sub==='00'&&itm==='0000'){ if(!C.name&&desc) C.name=desc; continue; }
      if(!C.subs[sub]) C.subs[sub]={name:'',items:[]}; const S=C.subs[sub];
      if(itm==='0000'){ if(!S.name&&desc) S.name=desc; continue; }
      const ut=unit.trim();
      if(ut&&ut!=='00'){
        const qty=parseFloat(qtyRaw.replace(/[^\d.]/g,''))||'';
        const pv=parseFloat(price.replace(/[^\d.]/g,''))||0;
        S.items.push({item:itm,unit:ut,qty,price:pv,desc});
      }
    }
    return buildings;
  },
  countItems(b){ let n=0; for(const bl of Object.values(b)) for(const c of Object.values(bl.chapters)) for(const s of Object.values(c.subs)) n+=s.items.length; return n; },
  handleFile(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const bytes=new Uint8Array(ev.target.result); let text=null;
        for(const enc of ['windows-1255','iso-8859-8','utf-8']){ try{ text=new TextDecoder(enc).decode(bytes); break; }catch(_){} }
        if(!text) throw new Error('לא ניתן לפענח את קידוד הקובץ');
        this.parsed=this.parse(text);
        const n=this.countItems(this.parsed);
        if(!n) throw new Error('לא נמצאו סעיפים בקובץ');
        toast(`✅ נטענו ${n} סעיפים מהקובץ — יש לאמת ולבחור מה לייבא`,'ok');
      }catch(err){ toast('❌ שגיאה בקריאת הקובץ: '+err.message,'err'); this.parsed=null; }
      App.refresh();
    };
    reader.readAsArrayBuffer(file); e.target.value='';
  },
  itemDuplicate(bld,ch,sub,itm){
    const code=`${bld}.${ch}.${sub}.${itm}`;
    return State.project.items.some(it=>!it.cancelled && itemFullCode(it)===code);
  },
  renderTree(){
    if(!this.parsed) return '';
    let h='';
    Object.keys(this.parsed).sort((a,b)=>+a-+b).forEach(bld=>{
      const B=this.parsed[bld];
      let bTotal=0; Object.values(B.chapters).forEach(c=>Object.values(c.subs).forEach(s=>bTotal+=s.items.length));
      if(!bTotal) return;
      h+=`<div class="skn-building"><div class="skn-bld-hdr" onclick="SKNImport.toggleNode(this)">
        <span class="skn-toggle">▼</span><label onclick="event.stopPropagation()"><input type="checkbox" class="skn-cb" checked onchange="SKNImport.cascade(this)"></label>
        <span class="skn-bld-title">🏗 מבנה ${esc(bld)} — ${esc(B.name||'')}</span>
        <span class="skn-count" style="background:rgba(255,255,255,.2);color:#fff">${bTotal} סעיפים</span></div><div class="skn-bld-body">`;
      Object.keys(B.chapters).sort((a,b)=>+a-+b).forEach(ch=>{
        const C=B.chapters[ch]; let cTotal=0; Object.values(C.subs).forEach(s=>cTotal+=s.items.length);
        if(!cTotal) return;
        h+=`<div class="skn-chapter"><div class="skn-ch-hdr" onclick="SKNImport.toggleNode(this)">
          <span class="skn-toggle">▼</span><label onclick="event.stopPropagation()"><input type="checkbox" class="skn-cb" checked onchange="SKNImport.cascade(this)"></label>
          <span class="skn-ch-code">${esc(bld)}.${esc(ch)}</span><span class="skn-ch-name">${esc(C.name||'')}</span>
          <span class="skn-count">${cTotal}</span></div><div class="skn-ch-body">`;
        Object.keys(C.subs).sort((a,b)=>+a-+b).forEach(sub=>{
          const S=C.subs[sub]; if(!S.items.length) return;
          h+=`<div class="skn-sub"><div class="skn-sub-hdr" onclick="SKNImport.toggleNode(this)">
            <span class="skn-toggle">▼</span><label onclick="event.stopPropagation()"><input type="checkbox" class="skn-cb" checked onchange="SKNImport.cascade(this)"></label>
            <span class="skn-sub-code">${esc(bld)}.${esc(ch)}.${esc(sub)}</span><span class="skn-sub-name">${esc(S.name||'')}</span>
            <span class="skn-count">${S.items.length}</span></div><div class="skn-sub-body">`;
          S.items.forEach(it=>{
            const dup=this.itemDuplicate(bld,ch,sub,it.item);
            h+=`<div class="skn-item"><label onclick="event.stopPropagation()"><input type="checkbox" class="skn-cb skn-item-cb" ${dup?'':'checked'}
              data-bld="${esc(bld)}" data-ch="${esc(ch)}" data-sub="${esc(sub)}" data-itm="${esc(it.item)}"></label>
              <span class="skn-item-code">${esc(bld)}.${esc(ch)}.${esc(sub)}.${esc(it.item)}</span>
              <span class="skn-item-desc">${esc(it.desc)}</span><span class="skn-item-unit">${esc(SKN_UNIT_MAP[it.unit]||it.unit)}</span>
              <span class="skn-item-qty" title="כמות חוזית (יש לאמת)">${it.qty!==''?fn(it.qty):'—'}</span>
              <span class="skn-item-price">${it.price?money(it.price):'—'}</span>
              ${dup?'<span class="skn-item-dup">קיים כבר בפרויקט</span>':''}</div>`;
          });
          h+='</div></div>';
        });
        h+='</div></div>';
      });
      h+='</div></div>';
    });
    return h;
  },
  toggleNode(el){ el.parentElement.classList.toggle('skn-collapsed'); },
  cascade(cb){ const scope=cb.closest('.skn-building,.skn-chapter,.skn-sub'); if(scope) qsa('.skn-cb',scope).forEach(c=>c.checked=cb.checked); },
  doImport(){
    if(!this.parsed){ toast('⚠ לא נטען קובץ SKN','err'); return; }
    const checked=qsa('#skn-tree .skn-item-cb:checked');
    if(!checked.length){ toast('⚠ לא נבחרו סעיפים','err'); return; }
    const p=State.project;
    let imported=0,skipped=0,errors=0;
    checked.forEach(cb=>{
      const {bld,ch,sub,itm}=cb.dataset;
      const item=this.parsed[bld]&&this.parsed[bld].chapters[ch]&&this.parsed[bld].chapters[ch].subs[sub]&&
        this.parsed[bld].chapters[ch].subs[sub].items.find(it=>it.item===itm);
      if(!item){ errors++; return; }
      if(this.itemDuplicate(bld,ch,sub,itm)){ skipped++; return; }
      const r=BOQ.addOrUpdateItem(p,{building:bld,chapter:ch,sub,item:itm,
        buildingName:this.parsed[bld].name,chapterName:this.parsed[bld].chapters[ch].name,subName:this.parsed[bld].chapters[ch].subs[sub].name,
        description:item.desc,unit:SKN_UNIT_MAP[item.unit]||"יחידה",contractQty:item.qty,unitPrice:item.price,notes:''});
      if(r.ok) imported++; else skipped++;
    });
    State.scheduleSave();
    UI.openModal(`<div class="modal-hd">תוצאות ייבוא<span class="x" onclick="UI.closeModal()">✕</span></div>
      <div class="skn-summary"><div class="sm imp"><b>${imported}</b>יובאו</div><div class="sm skip"><b>${skipped}</b>דולגו</div><div class="sm err"><b>${errors}</b>שגיאות</div></div>
      <div class="modal-foot"><button class="btn btn-gold" onclick="UI.closeModal();App.showTab('boq')">אל כתב הכמויות</button></div>`);
    this.parsed=null;
  },
  render(){
    let h=`<div class="card"><div class="card-hd">📥 ייבוא מקובץ SKN</div><div class="card-bd">
      <label class="skn-drop" for="skn-file-in">
        <div style="font-size:30px;margin-bottom:8px">📄</div>
        <div style="font-weight:700;color:var(--navy)">גרור קובץ SKN לכאן או לחץ לבחירה</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px">קובץ טקסט בפורמט תקן חשבונות (SKN) — מבנה, פרק, תת-פרק, סעיף, יחידה, כמות, מחיר</div>
      </label>
      <input id="skn-file-in" type="file" accept=".txt,.skn,.dat" style="display:none" onchange="SKNImport.handleFile(event)">`;
    if(this.parsed){
      const n=this.countItems(this.parsed);
      h+=`<div style="margin:14px 0"><b>${n}</b> סעיפים נטענו מהקובץ. אמת/י את הכמויות המסומנות ובחר/י אילו סעיפים לייבא (סעיפים קיימים כבר סומנו אוטומטית כלא-מיובאים).</div>
        <div id="skn-tree">${this.renderTree()}</div>
        <div style="margin-top:14px;display:flex;gap:10px"><button class="btn btn-gold btn-lg" onclick="SKNImport.doImport()">ייבוא סעיפים מסומנים</button></div>`;
    }
    h+='</div></div>';
    return h;
  },
};

    return `<div class="rsec"><div class="rsec-hd"><span class="rcode">${esc(itemFullCode(it))}</span>

      <table class="rtbl"><thead><tr><th style="width:24px">#</th><th>תיאור</th><th style="width:90px">שרטוט</th><th>נוסחה</th><th style="width:70px">תוצאה</th></tr></thead>

      <div class="rbal">

      </div></div>`;
  },
  auditSidebarHTML(p,it){

      <table class="rtbl"><thead><tr><th>חשבון</th><th>פעולה</th><th>שורה</th><th>מ → אל</th><th>תאריך</th></tr></thead><tbody>

  },
  signaturesHTML(p){
    return `<div class="rsigns"><div>קבלן מבצע<span>${esc(p.contractor||'')}</span></div>
      <div>מפקח<span>${esc(p.supervisor||'')}</span></div><div>מנהל פרויקט<span>${esc(p.manager||'')}</span></div></div>`;
  },
  reportItems(p){
    let items=p.items.filter(it=>!it.cancelled);
    if(this._selected) items=items.filter(it=>this._selected.has(it.id));
    return items.sort((a,b)=>itemFullCode(a).localeCompare(itemFullCode(b)));
  },
  buildHTML(){
    const p=State.project, account=this.account(p);
    if(this._sheetItemId){
      const it=findItem(p,this._sheetItemId); if(!it) return '<div class="empty">סעיף לא נמצא</div>';
      return `<div class="report">${this.headerHTML(p,account,'דף חישוב לסעיף',itemFullCode(it)+' — '+(it.description||''))}
        ${this.itemSectionHTML(p,it,account,'cumulative')}
        ${this.auditSidebarHTML(p,it)}
        ${this.signaturesHTML(p)}</div>`;
    }
    const items=this.reportItems(p);
    const totals=Accounts.projectTotals(p,account);
    const title = this._mode==='period' ? 'דוח תנועה בחשבון' : 'דוח חשבון מצטבר';
    let h=`<div class="report">${this.headerHTML(p,account,title,`חשבון ${account.number} — ${ACCOUNT_STATUS_LABEL[account.status]}`)}
      <div class="scards">
        <div class="scard"><div class="sc-ic">📐</div><div class="sc-k">סה"כ חוזה</div><div class="sc-v">${money(totals.contractTotal)}</div></div>
        <div class="scard"><div class="sc-ic">📒</div><div class="sc-k">מצטבר קודם</div><div class="sc-v">${money(totals.previousAmount)}</div></div>
        <div class="scard"><div class="sc-ic">➕</div><div class="sc-k">בתקופה</div><div class="sc-v">${money(totals.periodAmount)}</div></div>
        <div class="scard"><div class="sc-ic">✅</div><div class="sc-k">מצטבר נוכחי</div><div class="sc-v">${money(totals.cumulativeAmount)}</div></div>
        <div class="scard"><div class="sc-ic">📊</div><div class="sc-k">% ביצוע</div><div class="sc-v">${pct(totals.completionPct)}</div></div>
      </div>`;
    h+=items.map(it=>this.itemSectionHTML(p,it,account,this._mode)).join('');
    h+=this.summaryHTML(p,account)+this.signaturesHTML(p)+'</div>';
    return h;
  },
  render(){
    const p=State.project;
    const account=this.account(p);
    let h=`<div class="report-controls no-print"><div class="rc-row">
      <label class="opt">חשבון<select onchange="Reports._accountId=this.value;Reports._sheetItemId=null;App.refresh()">
        ${Accounts.list(p).map(a=>`<option value="${a.id}" ${account.id===a.id?'selected':''}>${esc(a.number)} — ${ACCOUNT_STATUS_LABEL[a.status]}</option>`).join('')}
      </select></label>
      <label class="opt"><input type="radio" name="rmode" ${this._mode==='cumulative'?'checked':''} onchange="Reports._mode='cumulative';App.refresh()">מצטבר עד חשבון זה</label>
      <label class="opt"><input type="radio" name="rmode" ${this._mode==='period'?'checked':''} onchange="Reports._mode='period';App.refresh()">רק תנועה בחשבון זה</label>
      ${this._sheetItemId?`<button class="btn btn-ghost btn-sm" onclick="Reports._sheetItemId=null;App.refresh()">← חזרה לדוח מלא</button>`:''}
      </div>
      <div class="rc-row" style="border-bottom:none;padding-top:12px">
        <button class="btn btn-navy" onclick="window.print()">🖨 הדפסה</button>
        <button class="btn btn-gold" onclick="ExcelExport.export()">⇩ ייצוא לאקסל</button>
      </div></div>`;
    h+=this.buildHTML();
    return h;
  },
};
Screens.reports=()=>Reports.render();
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: EXCEL EXPORT  (SpreadsheetML — opens natively in Excel, RTL, styled)
// ═══════════════════════════════════════════════════════════════════════
const ExcelExport = {
  xesc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); },
  cS(v,style){ return `<Cell${style?` ss:StyleID="${style}"`:''}><Data ss:Type="String">${this.xesc(v)}</Data></Cell>`; },
  cN(v,style){ return `<Cell${style?` ss:StyleID="${style}"`:''}><Data ss:Type="Number">${(+v||0)}</Data></Cell>`; },
  row(cells){ return `<Row>${cells.join('')}</Row>`; },
  sheet(name,rows,colWidths){
    const cols=(colWidths||[]).map(w=>`<Column ss:Width="${w}"/>`).join('');
    return `<Worksheet ss:Name="${this.xesc(name)}"><Table>${cols}${rows.join('')}</Table>
      <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><RightToLeft/></WorksheetOptions></Worksheet>`;
  },
  buildSummarySheet(p,account){
    const rows=[];
    rows.push(this.row([this.cS('KAYAN — ריכוז חשבון ביצוע','title')]));
    rows.push(this.row([this.cS('פרויקט:'),this.cS(p.name||'')]));
    rows.push(this.row([this.cS('מיקום:'),this.cS(p.location||'')]));
    rows.push(this.row([this.cS('חוזה:'),this.cS(p.contractNumber||'')]));
    rows.push(this.row([this.cS('קבלן:'),this.cS(p.contractor||'')]));
    rows.push(this.row([this.cS('חשבון:'),this.cS(account.number+' — '+ACCOUNT_STATUS_LABEL[account.status])]));
    rows.push(this.row([this.cS('תאריך:'),this.cS(fdate(account.date))]));
    rows.push(this.row([]));
    const heads=['קוד סעיף','תיאור','יח׳','חוזי','מצטבר קודם','בתקופה','תיקון','מצטבר נוכחי','יתרה','% ביצוע','מחיר יחידה','סכום נוכחי'];
    rows.push(this.row(heads.map(h=>this.cS(h,'hdr'))));
    let tContract=0,tPrev=0,tAdd=0,tCorr=0,tCur=0,tAmt=0;
    this.items(p).forEach(it=>{
      const mv=Accounts.itemMovement(p,it,account);
      tContract+=mv.contractQty; tPrev+=mv.previousCumulative; tAdd+=mv.addition; tCorr+=mv.correction; tCur+=mv.currentCumulative; tAmt+=mv.amount;
      rows.push(this.row([this.cS(itemFullCode(it)),this.cS(it.description||''),this.cS(it.unit),
        this.cN(mv.contractQty,'num'),this.cN(mv.previousCumulative,'num'),this.cN(mv.addition,'num'),this.cN(mv.correction,'num'),
        this.cN(mv.currentCumulative,'num'),this.cN(mv.balance,'num'),this.cN(mv.completionPct,'num'),this.cN(it.unitPrice,'num'),this.cN(mv.amount,'num')]));
    });
    rows.push(this.row([this.cS('סה"כ','total'),this.cS('','total'),this.cS('','total'),this.cN(tContract,'total'),this.cN(tPrev,'total'),
      this.cN(tAdd,'total'),this.cN(tCorr,'total'),this.cN(tCur,'total'),this.cS('','total'),this.cS('','total'),this.cS('','total'),this.cN(tAmt,'total')]));
    const vat=nz(p.vat)/100;
    rows.push(this.row([this.cS(`מע"מ (${p.vat}%)`),this.cN(tAmt*vat,'num')]));
    rows.push(this.row([this.cS('סה"כ כולל מע"מ','total'),this.cN(tAmt*(1+vat),'total')]));
    return this.sheet('ריכוז חשבון',rows,[90,220,50,70,80,70,70,80,70,60,70,90]);
  },
  buildDetailSheet(p,account){
    const rows=[this.row(['קוד סעיף','תיאור סעיף','#','תיאור שורה','צורה','מידה 1','מידה 2','מידה 3','עובי/אורך','N','תוצאה','יחידה'].map(h=>this.cS(h,'hdr')))];
    const isLive=account.status==='draft';
    this.items(p).forEach(it=>{
      const kind=itemUnitKind(it);
      const src=isLive? p.measurements.filter(m=>!m.isGroup&&m.itemId===it.id&&!m.cancelled)
                       : (account.snapshot?account.snapshot.measurements.filter(r=>r.itemId===it.id&&!r.cancelled):[]);
      src.forEach((r,i)=>{
        const val=isLive?calcRow(r,it):nz(r.value);
        rows.push(this.row([this.cS(itemFullCode(it)),this.cS(it.description||''),this.cN(i+1),this.cS(r.desc||''),this.cS(r.shape||''),
          this.cN(r.d1,'num'),this.cN(r.d2,'num'),this.cN(r.d3,'num'),this.cN(r.t,'num'),this.cN(r.qty||1,'num'),this.cN(val,'num'),this.cS(it.unit)]));
      });
    });
    return this.sheet('דפי חישוב',rows,[90,200,30,180,70,60,60,60,60,40,70,50]);
  },
  buildHistorySheet(p){
    const rows=[this.row(['קוד סעיף','תיאור שורה','חשבון','פעולה','מערך','לערך','תאריך'].map(h=>this.cS(h,'hdr')))];
    p.measurements.filter(m=>!m.isGroup).forEach(m=>{
      const it=findItem(p,m.itemId); if(!it) return;
      (m.history||[]).forEach(h=>{
        rows.push(this.row([this.cS(itemFullCode(it)),this.cS(m.desc||''),this.cS(h.accountNumber),this.cS(ROW_HIST_LABEL[h.action]),
          this.cN(h.prevValue,'num'),this.cN(h.value,'num'),this.cS(fdate(h.date))]));
      });
    });
    return this.sheet('היסטוריית תיקונים',rows,[90,200,60,70,70,70,80]);
  },
  items(p){ let items=p.items.filter(it=>!it.cancelled); if(Reports._selected) items=items.filter(it=>Reports._selected.has(it.id));
    return items.sort((a,b)=>itemFullCode(a).localeCompare(itemFullCode(b))); },
  export(){
    const p=State.project, account=Reports.account(p);
    const xml=`<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
<Style ss:ID="title"><Font ss:Bold="1" ss:Size="14" ss:Color="#142B45"/></Style>
<Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#142B45" ss:Pattern="Solid"/>
  <Alignment ss:Horizontal="Center" ss:Vertical="Center"/>
  <Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
<Style ss:ID="num"><NumberFormat ss:Format="#,##0.00"/><Alignment ss:Horizontal="Center"/></Style>
<Style ss:ID="total"><Font ss:Bold="1"/><Interior ss:Color="#F0F4F9" ss:Pattern="Solid"/><NumberFormat ss:Format="#,##0.00"/></Style>
</Styles>
${this.buildSummarySheet(p,account)}
${this.buildDetailSheet(p,account)}
${this.buildHistorySheet(p)}
</Workbook>`;
    const blob=new Blob(['﻿'+xml],{type:'application/vnd.ms-excel'});
    Backup.downloadBlob(blob,`KAYAN_${(p.name||'project').replace(/\s/g,'_')}_חשבון_${account.number}.xls`);
    toast('הקובץ יוצא ל-Excel');
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: BACKUP  (JSON export/import — the real cross-device path; see
//  DriveProvider stub in the Storage module for why cloud sync isn't live)
// ═══════════════════════════════════════════════════════════════════════
const Backup = {
  downloadBlob(blob,filename){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },
  async exportProjectById(id){
    const p=(State.project&&State.project.id===id)?State.project:await Storage.getProject(id);
    if(!p){ toast('פרויקט לא נמצא','err'); return; }
    const blob=new Blob([JSON.stringify({kayan:'project',v:3,exported:nowISO(),project:p},null,2)],{type:'application/json'});
    this.downloadBlob(blob,`kayan_${(p.name||'project').replace(/\s+/g,'_')}_${todayISO()}.json`);
    if(State.project&&State.project.id===id){ State.project.lastBackupAt=nowISO(); State.scheduleSave(); }
    toast('גיבוי הורד בהצלחה','ok');
  },
  exportProject(){ if(State.project) this.exportProjectById(State.project.id); },
  async exportAll(){
    const list=await Storage.listProjects();
    const blob=new Blob([JSON.stringify({kayan:'backup',v:3,exported:nowISO(),projects:list},null,2)],{type:'application/json'});
    this.downloadBlob(blob,`kayan_backup_all_${todayISO()}.json`);
    toast(`גובו ${list.length} פרויקטים לקובץ אחד`,'ok');
  },
  importAllPrompt(){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange=e=>this.importFile(e); inp.click();
  },
  async importFile(e){
    const f=e.target.files[0]; if(!f) return;
    try{
      const text=await f.text();
      const d=JSON.parse(text);
      if(d.kayan==='backup'&&Array.isArray(d.projects)){
        let n=0; for(const pr of d.projects){ const np={...cloneObj(pr),id:uid('proj_')}; await Storage.saveProject(np); n++; }
        toast(`שוחזרו ${n} פרויקטים מהגיבוי`,'ok');
        if(!State.project) Projects.renderList();
      } else if(d.kayan==='project'&&d.project){
        const np={...cloneObj(d.project),id:uid('proj_')};
        await Storage.saveProject(np); toast('הפרויקט יובא בהצלחה','ok'); await App.openProject(np.id);
      } else if(d.sections&&d.project!==undefined){ // legacy single-project shape safety net
        const np=Migration.convertLegacyProject(d); await Storage.saveProject(np);
        toast('פרויקט מהגרסה הקודמת יובא','ok'); await App.openProject(np.id);
      } else throw new Error('פורמט קובץ לא מוכר');
    }catch(err){ console.error(err); toast('❌ קובץ לא תקין: '+err.message,'err'); }
    e.target.value='';
  },
  importProjectFile(e){ this.importFile(e); },
};

const Settings = {
  setField(key,val){ State.project[key]=val; State.scheduleSave(); App.paintTopbar(); },
  loadLogo(e){

  },
  setLogoMode(m){ State.project.logoMode=m; State.scheduleSave(); App.refresh(); },
  clearLogo(){ delete State.project.logo; delete State.project.logoMode; State.scheduleSave(); toast('חזרה ללוגו ברירת מחדל'); App.refresh(); },
  toggleAreas(on){ State.project.useAreas=on; State.scheduleSave(); App.refresh(); },

      <div class="grid2">
        ${f('name','שם הפרויקט')}${f('location','מיקום')}
        ${f('contractNumber','מס׳ חוזה')}${f('contractor','קבלן מבצע')}
        ${f('supervisor','מפקח')}${f('manager','מנהל פרויקט')}
        ${f('vat','מע"מ %','number')}
      </div>
      <div class="logo-slot">
        <div class="ls-preview">${p.logo?`<img src="${p.logo}" style="max-height:48px;max-width:160px;object-fit:contain">`:'לוגו ברירת מחדל KAYAN'}</div>
        <div>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">העלאת לוגו<input type="file" accept="image/*" style="display:none" onchange="Settings.loadLogo(event)"></label>
          ${p.logo?`<button class="btn btn-ghost btn-sm" onclick="Settings.clearLogo()">איפוס ללוגו ברירת מחדל</button>`:''}
          <div class="logo-mode">
            <label class="lm-opt"><input type="radio" name="logomode" value="wide" ${p.logoMode!=='corner'?'checked':''} onchange="Settings.setLogoMode('wide')">לוגו רחב <small>(פס עליון מלא)</small></label>
            <label class="lm-opt"><input type="radio" name="logomode" value="corner" ${p.logoMode==='corner'?'checked':''} onchange="Settings.setLogoMode('corner')">לוגו בפינה <small>(עם שם קבלן)</small></label>
          </div>
        </div>
      </div>
      <h2 class="sect-ttl" style="margin-top:20px">אפשרויות</h2>
      <label class="opt" style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${p.useAreas?'checked':''} onchange="Settings.toggleAreas(this.checked)">ניהול מדידות לפי אזורים/מגרשים</label>
      </div></div>
      <div class="card"><div class="card-hd">גיבוי ושחזור</div><div class="card-bd" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-navy" onclick="Backup.exportProject()">⇩ ייצוא גיבוי JSON</button>

        <div class="hint" style="align-self:center;color:var(--muted);font-size:11.5px">גיבוי אחרון: ${p.lastBackupAt?fdate(p.lastBackupAt):'טרם בוצע'}</div>
      </div></div>
      <div class="card"><div class="card-hd" style="background:var(--neg)">אזור מסוכן</div><div class="card-bd">
        <button class="btn btn-danger" onclick="Projects.remove('${p.id}').then(ok=>{if(ok)App.goHome();})">🗑 מחיקת הפרויקט לצמיתות</button>
      </div></div>`;
    return h;
  },
};

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: UI  (toast, modal, drawer, save-status indicator)
// ═══════════════════════════════════════════════════════════════════════
function toast(msg,type){
  const host=byId('toast-host'); if(!host) return;
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' err':type==='ok'?' ok':'');
  el.textContent=msg;
  host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); },2800);
}
const UI = {
  toast,
  openModal(html,size){
    byId('modal-host').innerHTML=`<div class="modal show" onmousedown="if(event.target===this)UI.closeModal()">
      <div class="modal-card ${size==='wide'?'wide':''}">${html}</div></div>`;
  },
  closeModal(){ byId('modal-host').innerHTML=''; },
  openDrawer(html){ byId('drawer-host').innerHTML=`<div class="drawer show">${html}</div>`; byId('drawer-bd').classList.add('show'); },
  closeDrawer(){ byId('drawer-host').innerHTML=''; byId('drawer-bd').classList.remove('show'); },
  setSaveStatus(state){
    const el=byId('save-status'); if(!el) return;
    const txt=byId('save-status-txt');
    el.classList.remove('saving','err');
    if(state==='saving'){ el.classList.add('saving'); txt.textContent='שומר…'; }
    else if(state==='err'){ el.classList.add('err'); txt.textContent='שגיאת שמירה'; }
    else txt.textContent='נשמר';
  },
};
