<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>KAYAN — מערכת חשבונות ביצוע וכמויות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#142B45; --navy2:#1E3A5C; --navy-dk:#0E1F33;
  --gold:#B08D3E; --gold-dk:#957530; --gold-lt:#D9C48A;
  --pos:#2C7A4B; --pos-bg:#EDF5EF;
  --neg:#B4432F; --neg-bg:#F8EEEB;
  --amber:#B07A1E; --amber-bg:#FBF4E4;
  --blue:#2A5A96; --blue-bg:#EAF1FA;
  --ink:#1A222E; --muted:#6E7A88; --line:#E6E9F0; --hair:#EDEFF4;
  --bg:#F4F5F8; --card:#FFFFFF; --paper:#FCFCFA;
  --shadow:0 1px 2px rgba(20,43,69,.05),0 8px 30px rgba(20,43,69,.06);
  --r-sm:6px; --r:10px; --r-lg:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
.num{direction:ltr;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
a{color:inherit}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ══════════ TOP BAR ══════════ */
.topbar{background:var(--navy);color:#fff;padding:0 18px;height:58px;display:flex;align-items:center;
  gap:14px;position:sticky;top:0;z-index:80;box-shadow:0 2px 12px rgba(19,42,70,.25)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none}
.logo svg{width:32px;height:32px;flex:none}
.logo .name{font-weight:800;font-size:18px;letter-spacing:.02em;color:#fff}
.logo .name b{color:var(--gold)}
.logo .tag{font-size:8.5px;letter-spacing:.26em;color:#9FB2C9;margin-top:-2px}
.topbar .proj-name{font-size:13px;color:#CBD6E4;padding-inline-start:14px;border-inline-start:1px solid rgba(255,255,255,.18);
  display:flex;flex-direction:column;gap:1px;max-width:260px;overflow:hidden}
.topbar .proj-name b{color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .proj-name small{color:#8FA2B8;font-size:10.5px}
.topbar .spacer{flex:1}
.save-status{font-size:11px;color:#9FB2C9;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:#5FB37A;flex:none}
.save-status.saving .dot{background:var(--gold);animation:pulse 1s infinite}
.save-status.err .dot{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar .act{background:rgba(255,255,255,.1);color:#fff;padding:7px 13px;border-radius:7px;font-size:12.5px;
  font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.topbar .act:hover{background:rgba(255,255,255,.2)}
.topbar .act.gold{background:var(--gold);color:var(--navy-dk);font-weight:700}
.topbar .act.gold:hover{background:#d4b25c}

/* ══════════ TABS ══════════ */
.tabs{background:var(--navy2);display:flex;padding:0 12px;position:sticky;top:58px;z-index:79;
  box-shadow:0 2px 8px rgba(19,42,70,.15);overflow-x:auto}
.tab{color:#B9C7D9;padding:12px 18px;font-size:13px;font-weight:500;border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:7px;transition:.15s;background:none;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.tab .badge{background:var(--gold);color:var(--navy-dk);font-size:10px;font-weight:800;
  min-width:17px;height:17px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.tab .badge.warn{background:var(--neg);color:#fff}

/* ══════════ LAYOUT ══════════ */
.wrap{max-width:1400px;margin:20px auto;padding:0 18px}
.wrap.narrow{max-width:900px}
.screen{display:none}
.screen.on{display:block;animation:fade .18s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:16px}
.card-hd{background:var(--navy);color:#fff;padding:11px 16px;border-radius:var(--r-lg) var(--r-lg) 0 0;font-weight:700;
  font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-hd .gold-i{color:var(--gold)}
.card-hd .hd-sub{font-weight:400;font-size:11.5px;color:#B9C7D9;margin-inline-start:auto}
.card-bd{padding:16px}
.card-bd.flush{padding:0}
h2.sect-ttl{font-size:15px;color:var(--navy);font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sect-ttl:first-child{margin-top:0}

/* ══════════ FORMS ══════════ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 18px}
.fld label{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;
  background:#fff;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(34,64,106,.1)}
.fld textarea{resize:vertical;min-height:60px}
.fld .hint{font-size:10.5px;color:var(--muted);margin-top:3px}

/* ══════════ BUTTONS ══════════ */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;
  gap:6px;transition:.15s;white-space:nowrap}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:var(--navy-dk);font-weight:700}.btn-gold:hover{background:#d4b25c}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--navy2)}
.btn-danger{background:var(--neg-bg);color:var(--neg);border:1.5px solid #EAD1CB}.btn-danger:hover{background:#f4ddd6}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-lg{padding:13px 24px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1.5px solid var(--line);color:var(--muted);transition:.15s;font-size:15px;flex:none}
.icon-btn:hover{border-color:var(--navy2);color:var(--navy)}
.icon-btn.del:hover{border-color:var(--neg);color:var(--neg);background:var(--neg-bg)}

/* ══════════ TABLES ══════════ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--navy);color:#fff;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:10px 8px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th:first-child{border-radius:0 var(--r) 0 0}
thead th:last-child{border-radius:var(--r) 0 0 0}
tbody td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;font-size:12.5px}
tbody tr:hover{background:#F7FAFD}
tbody tr.ded-row{background:var(--neg-bg)}
tbody tr.ded-row:hover{background:#f9e3de}
tbody tr.cancelled-row{opacity:.5;text-decoration:line-through}
td input,td select{width:100%;padding:5px 6px;border:1px solid transparent;border-radius:5px;background:transparent;text-align:center}
td input:hover,td select:hover{border-color:var(--line);background:#fff}
td input:focus,td select:focus{outline:none;border-color:var(--navy2);background:#fff;box-shadow:0 0 0 2px rgba(34,64,106,.12)}
td.res{font-weight:800;font-size:13.5px}
td.res.p{color:var(--pos)}td.res.n{color:var(--neg)}
td.formula{direction:ltr;font-size:11.5px;color:#3A4757;white-space:nowrap;font-weight:500}
.sign-pill{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;border:2px solid}
.sign-pill.p{color:var(--pos);border-color:var(--pos);background:var(--pos-bg)}
.sign-pill.n{color:var(--neg);border-color:var(--neg);background:var(--neg-bg)}
.unit-chip{background:var(--navy);color:#fff;font-size:10px;font-weight:600;padding:2px 9px;border-radius:4px;white-space:nowrap}

/* ══════════ STATUS CHIPS / PILLS ══════════ */
.stat{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.stat.new{color:var(--navy);background:#E9EEF5}
.stat.ok{color:var(--pos);background:var(--pos-bg)}
.stat.grow{color:var(--gold-dk);background:var(--amber-bg)}
.stat.chg{color:var(--neg);background:var(--neg-bg)}
.stat.draft{color:var(--blue);background:var(--blue-bg)}
.stat.locked{color:var(--muted);background:#EEF0F4}
.stat.submitted{color:var(--gold-dk);background:var(--amber-bg)}
.stat.approved{color:var(--pos);background:var(--pos-bg)}
.stat.lg{font-size:12px;padding:5px 14px;font-weight:800}

/* ══════════ EMPTY / TOAST ══════════ */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:44px;opacity:.4;margin-bottom:10px}
.empty .t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.empty .s{font-size:12px}
#toast-host{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy-dk);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;
  opacity:0;transform:translateY(16px);transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--neg)}
.toast.ok{background:var(--pos)}

/* ══════════ MODAL / DRAWER ══════════ */
.modal{position:fixed;inset:0;background:rgba(14,31,51,.5);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:14px;padding:20px;width:min(480px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:88vh;overflow:auto}
.modal-card.wide{width:min(760px,96vw)}
.modal-hd{font-weight:800;font-size:15.5px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-hd .x{margin-inline-start:auto;cursor:pointer;color:var(--muted);font-size:18px}
.modal-card select,.modal-card input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drawer-bd{position:fixed;inset:0;background:rgba(14,31,51,.4);display:none;z-index:280}
.drawer-bd.show{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,92vw);background:#fff;z-index:290;box-shadow:8px 0 30px rgba(0,0,0,.2);
  transform:translateX(-100%);transition:.22s;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-hd{background:var(--navy);color:#fff;padding:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.drawer-hd .x{margin-inline-start:auto;cursor:pointer;opacity:.8}
.drawer-bd-content{padding:16px;overflow:auto;flex:1}

/* ══════════ DASHBOARD ══════════ */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.dash-card .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:6px}
.dash-card .v{font-size:24px;font-weight:900;color:var(--navy);direction:ltr;display:flex;align-items:baseline;gap:4px;justify-content:flex-end}
.dash-card .v .u{font-size:12px;font-weight:600;color:var(--muted)}
.dash-card.accent{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.dash-card.accent .k{color:#B9C7D9}.dash-card.accent .v{color:var(--gold)}
.dash-card.warn{border-color:var(--gold-lt);background:var(--amber-bg)}
.dash-card.warn .v{color:var(--gold-dk)}
.dash-hero{background:linear-gradient(120deg,var(--navy),var(--navy2) 60%,#24466e);border-radius:var(--r-lg);
  padding:22px 26px;color:#fff;display:flex;align-items:center;gap:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(19,42,70,.25);flex-wrap:wrap}
.dash-hero .info{flex:1;min-width:220px}
.dash-hero .info .lbl{font-size:11.5px;color:#9FB2C9;letter-spacing:.04em;font-weight:600}
.dash-hero .info .big{font-size:26px;font-weight:900;margin-top:2px}
.dash-hero .info .big b{color:var(--gold)}
.dash-hero .progress-ring{width:88px;height:88px;flex:none}
.dash-hero .btn-gold{font-size:14px;padding:12px 22px}
.completion-bar{height:9px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:10px;width:100%;max-width:340px}
.completion-bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.dash-alerts{display:flex;flex-direction:column;gap:8px}
.dash-alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;font-size:12.5px;font-weight:500}
.dash-alert.warn{background:var(--amber-bg);color:var(--gold-dk)}
.dash-alert.err{background:var(--neg-bg);color:var(--neg)}
.dash-alert.info{background:var(--blue-bg);color:var(--blue)}

/* ══════════ PROJECT SELECTOR ══════════ */
.home-shell{min-height:100vh;background:linear-gradient(160deg,var(--navy-dk),var(--navy) 55%,#1c3a5c);padding:40px 18px}
.home-top{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;margin-bottom:30px}
.home-top .name{font-weight:800;font-size:26px}.home-top .name b{color:var(--gold)}
.home-wrap{max-width:1060px;margin:0 auto}
.home-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.home-search{flex:1;min-width:200px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);
  border-radius:10px;padding:11px 14px;color:#fff}
.home-search::placeholder{color:#8FA2B8}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;
  cursor:pointer;transition:.15s;border:2px solid transparent}
.proj-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.proj-card .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-card .pc-name{font-weight:800;font-size:16px;color:var(--navy)}
.proj-card .pc-loc{font-size:11.5px;color:var(--muted);margin-top:2px}
.proj-card .pc-stats{display:flex;gap:14px;font-size:11px;color:var(--muted);border-top:1px solid var(--hair);padding-top:10px;margin-top:2px}
.proj-card .pc-stats b{display:block;color:var(--navy);font-size:14px;font-weight:800}
.proj-card .pc-actions{display:flex;gap:6px;justify-content:flex-end}
.proj-card-new{border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;cursor:pointer;transition:.15s}
.proj-card-new:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
.proj-card-new .ic{font-size:30px}

/* ══════════ BOQ TREE ══════════ */
.boq-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.boq-search{flex:1;min-width:220px;position:relative}
.boq-search input{width:100%;padding:10px 38px 10px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px}
.boq-search input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(34,64,106,.1)}
.boq-search .ic{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.boq-search-results{position:absolute;top:calc(100% + 4px);inset-inline:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:60;max-height:340px;overflow:auto;display:none}
.boq-search-results.show{display:block}
.boq-search-row{padding:9px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--hair);font-size:12.5px}
.boq-search-row:hover{background:#F7FAFD}
.boq-search-row .code{font-weight:700;color:var(--gold-dk);direction:ltr}
.boq-search-row .path{color:var(--muted);font-size:10.5px}
.btree{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.b-node{border-bottom:1px solid var(--line)}
.b-node:last-child{border-bottom:none}
.b-hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--navy);color:#fff;transition:.15s}
.b-hdr:hover{background:var(--navy2)}
.b-hdr .code{font-weight:800;color:var(--gold);direction:ltr;font-size:12.5px}
.b-hdr .name{flex:1;font-weight:700;font-size:13.5px}
.b-body{display:block}
.b-node.collapsed .b-body{display:none}
.b-node.collapsed .b-toggle{transform:rotate(-90deg)}
.b-toggle{font-size:10px;transition:.2s;flex:none}
.b-count{background:rgba(255,255,255,.18);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.b-activity{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}

.c-hdr{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 14px;padding-inline-start:30px;cursor:pointer;background:#F0F4F9;border-bottom:1px solid var(--line)}
.c-hdr:hover{background:#E7EDF5}
.c-hdr .code{font-weight:700;color:var(--gold-dk);font-size:11.5px;direction:ltr}
.c-hdr .name{flex:1;font-size:12.5px;color:var(--navy)}
.c-body.collapsed{display:none}
.c-count{background:rgba(20,43,69,.08);color:var(--muted);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}

.s-hdr{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-inline-start:46px;cursor:pointer;background:#F7F9FC;border-bottom:1px solid var(--hair);font-size:12px}
.s-hdr:hover{background:#EFF3F8}
.s-hdr .code{font-weight:700;color:var(--navy2);font-size:11px;direction:ltr}
.s-hdr .name{flex:1;color:var(--ink)}
.s-body.collapsed{display:none}

.i-row{display:flex;align-items:center;gap:10px;padding:9px 14px;padding-inline-start:62px;border-bottom:1px solid var(--hair);font-size:12.5px;cursor:pointer}
.i-row:hover{background:#F7FAFD}
.i-row.hl{background:#FCF6E3;animation:hlpulse 1.6s ease 2}
@keyframes hlpulse{0%,100%{background:#FCF6E3}50%{background:#FBEBB8}}
.i-row .code{font-weight:700;color:var(--navy2);direction:ltr;min-width:118px}
.i-row .desc{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.i-row .unit{color:var(--muted);font-size:11px;min-width:34px}
.i-row .qty{direction:ltr;font-weight:600;min-width:70px;text-align:left}
.i-row .price{direction:ltr;color:var(--muted);min-width:70px;text-align:left;font-size:11.5px}
.i-row .actions{display:flex;gap:4px}
.boq-actions-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* ══════════ VALIDATION PANEL ══════════ */
.val-panel{display:flex;flex-direction:column;gap:8px}
.val-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:9px;font-size:12.5px}
.val-row.ok{background:var(--pos-bg);color:var(--pos)}

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: UTILITIES
// ═══════════════════════════════════════════════════════════════════════
const Util = (() => {
  function uid(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function nz(v){ if(v===''||v==null) return 0; const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,'')); return isNaN(n)?0:n; }
  function fn(v,dp=3){ const n=+v; if(isNaN(n))return'0'; return n.toLocaleString('he-IL',{minimumFractionDigits:0,maximumFractionDigits:dp}); }
  function fq(v){ const n=+v; if(isNaN(n))return'0'; return n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fnum(v){ const n=parseFloat(v); return isNaN(n)?'':(n%1===0?String(n):parseFloat(n.toFixed(3))); }
  function money(v){ const n=+v||0; return '₪'+n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function pct(v){ const n=+v||0; return n.toLocaleString('he-IL',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
  function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function clone(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }
  function todayISO(){ return new Date().toISOString().split('T')[0]; }
  function nowISO(){ return new Date().toISOString(); }
  function fdate(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso;
    return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
  function byId(id){ return document.getElementById(id); }
  function qs(sel,root){ return (root||document).querySelector(sel); }
  function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
  function normDigits(codeStr,len){ return String(codeStr||'').trim().padStart(len,'0'); }
  return {uid,nz,fn,fq,fnum,money,pct,esc,clone,todayISO,nowISO,fdate,debounce,byId,qs,qsa,normDigits};
})();
const {uid,nz,fn,fq,fnum,money,pct,esc,clone:cloneObj,todayISO,nowISO,fdate,debounce,byId,qs,qsa}=Util;

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: DATA MODEL  (constants, unit→geometry registry, factories)
// ═══════════════════════════════════════════════════════════════════════
const APP_VERSION='3.0.0';

// unit-driven measurement engine: every BOQ unit maps to exactly one geometry
// "kind" and a whitelist of shapes valid for that kind — this is what prevents
// e.g. entering a thickness on an m² item, or an area-only shape on an m³ item.
const UNIT_KIND = {
  'מ"ר':  {kind:'area',   label:'שטח'},
  'מ"ק':  {kind:'volume', label:'נפח'},
  'מ"א':  {kind:'length', label:'אורך'},
  "יח'":  {kind:'count',  label:'כמות'},
  'טון':  {kind:'count',  label:'כמות'},
  'ק"ג':  {kind:'count',  label:'כמות'},
  'שעות': {kind:'count',  label:'כמות'},
};
const UNIT_LIST = Object.keys(UNIT_KIND);

// cross-section shapes usable for AREA and VOLUME (volume = cross-section area × extrusion length)
const CROSS = {
  'מלבן':  {d:['אורך','רוחב'],              area:(a,b)=>a*b,           forKinds:['area','volume'], lbl:'אורך × רוחב'},
  'משולש': {d:['בסיס','גובה'],              area:(a,b)=>a*b/2,         forKinds:['area','volume'], lbl:'(בסיס × גובה) ÷ 2'},
  'טרפז':  {d:['בסיס א׳','בסיס ב׳','גובה'], area:(a,b,c)=>(a+b)*c/2,   forKinds:['area','volume'], lbl:'(א׳+ב׳) × גובה ÷ 2'},
  'עיגול': {d:['קוטר Ø'],                   area:(a)=>Math.PI*(a/2)**2,forKinds:['area','volume'], lbl:'π × (Ø÷2)²'},
  'חצי-עיגול': {d:['קוטר Ø'],               area:(a)=>Math.PI*(a/2)**2/2, forKinds:['area','volume'], lbl:'π × (Ø÷2)² ÷ 2'},
  'שטח מיוחד': {d:['שטח חתך'],              area:(a)=>a,               forKinds:['area','volume'], lbl:'שטח נתון', custom:true},
};
// non cross-section shapes, one per non-area/volume kind
const LINE_SHAPE={d:['אורך'],lbl:'אורך',forKinds:['length']};
const COUNT_SHAPE={d:[],lbl:'ספירה',forKinds:['count']};
function shapesForKind(kind){
  if(kind==='length') return ['קו'];
  if(kind==='count') return ["יחידה"];
  // area & volume both draw from CROSS, but "volume" requires extrusion length (t) in addition
  return Object.keys(CROSS);
}
function shapeDims(shape){
  if(shape==='קו') return LINE_SHAPE.d;
  if(shape==='יחידה') return COUNT_SHAPE.d;
  return CROSS[shape]?CROSS[shape].d:[];
}

const ROW_HIST_LABEL={created:'נוצר',corrected:'תוקן',cancelled:'בוטל'};
const ROW_STATUS_LABEL={new:'חדש',approved:'מאושר',corrected:'תוקן',cancelled:'בוטל'};

// ── factory functions ──
function makeProject(fields){

    supervisor:'', manager:'', vat:18, logo:null, logoMode:'wide',

    items:[],            // BOQ items (flat, with building/chapter/sub/item codes)
    measurements:[],     // measurement rows, each linked to an item by itemId
    accounts:[],          // Account[] — see makeAccount

function makeAccount(number){

    notes:'', createdAt:nowISO(), lockedAt:null,

}
function makeBoqItem(fields){

    id:uid('item_'), building:'01', chapter:'00', sub:'00', item:'0000',

function itemFullCode(it){ return `${it.building}.${it.chapter}.${it.sub}.${it.item}`; }
function makeMeasurement(fields){
  return Object.assign({
    id:uid('meas_'), itemId:null, isGroup:false, groupLabel:'',

  }, fields||{});

//  MODULE: STORAGE
//  IndexedDB is the primary store (large capacity, async, survives reloads).
//  A thin StorageProvider interface keeps the door open for a future
//  DriveProvider (cloud sync) without touching call sites — see DriveProvider
//  stub below. localStorage is read-only here, used solely as a migration
//  source for data created by the previous (v2) single-file version.
// ═══════════════════════════════════════════════════════════════════════
const IDB_NAME='KayanDB', IDB_VER=1;
function idbOpen(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(IDB_NAME,IDB_VER);
    rq.onupgradeneeded=()=>{
      const db=rq.result;
      if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}
function idbTx(db,store,mode){ return db.transaction(store,mode).objectStore(store); }
function idbReq(req){ return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }

class IndexedDBProvider {
  async init(){ this.db=await idbOpen(); return this; }
  async listProjects(){ return idbReq(idbTx(this.db,'projects','readonly').getAll()); }
  async getProject(id){ return idbReq(idbTx(this.db,'projects','readonly').get(id)); }
  async saveProject(p){ p.updatedAt=nowISO(); await idbReq(idbTx(this.db,'projects','readwrite').put(cloneObj(p))); return p; }
  async deleteProject(id){ return idbReq(idbTx(this.db,'projects','readwrite').delete(id)); }
  async getMeta(key,fallback){ const r=await idbReq(idbTx(this.db,'meta','readonly').get(key)); return r?r.value:fallback; }
  async setMeta(key,value){ return idbReq(idbTx(this.db,'meta','readwrite').put({key,value})); }
}
// Cloud sync abstraction — intentionally NOT wired to a real OAuth flow here:
// a static single HTML file cannot hold a client secret safely, and Google's
// Drive API requires a configured OAuth client. The interface is real and
// stable so a future build can drop in a working implementation (e.g. behind
// a small companion auth endpoint) without touching Projects/Accounts code.
// Suggested remote layout (see spec): KAYAN Projects/<project>/project-data.json,
// /Accounts/<nnn>/snapshot.json, /Accounts/<nnn>/report.pdf|xls, /Backups/.
class DriveProvider {
  async init(){ throw new Error('DriveProvider אינו מוגדר בגרסה זו — יש לחבר קליינט OAuth תקין.'); }
  isConfigured(){ return false; }
  async pushProject(){ throw new Error('לא מחובר לגוגל דרייב'); }
  async pullProject(){ throw new Error('לא מחובר לגוגל דרייב'); }
}

const Storage = {
  provider:null,
  async init(){ this.provider=await new IndexedDBProvider().init(); return this; },
  listProjects(){ return this.provider.listProjects(); },
  getProject(id){ return this.provider.getProject(id); },
  saveProject(p){ return this.provider.saveProject(p); },
  deleteProject(id){ return this.provider.deleteProject(id); },

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: MIGRATION  (legacy localStorage kayan_store_v2 / kayan_boq_v1)
// ═══════════════════════════════════════════════════════════════════════
const Migration = {
  LEGACY_STORE_KEY:'kayan_store_v2', LEGACY_SINGLE_KEY:'kayan_boq_v1',
  legacyExists(){
    try{ return !!(localStorage.getItem(this.LEGACY_STORE_KEY)||localStorage.getItem(this.LEGACY_SINGLE_KEY)); }
    catch(_){ return false; }
  },
  // shape-name migration carried over from the pre-v3 app (boxes/cylinders → cross-section + thickness)
  migrateRowShape(m){
    if(m.shape==='תיבה'){ m.shape='מלבן'; m.t=m.d3; m.d3=''; }
    else if(m.shape==='גליל'){ m.shape='עיגול'; m.t=m.d2; m.d2=''; }
    if(!('t' in m)) m.t='';
    return m;
  },
  // find-or-create a building/chapter/subchapter code from a free-text name,
  // used when legacy data has no real hierarchy (old "sections" were flat).
  resolveHierarchy(project, legacySection, codeCache){
    const rawCode=(legacySection.code||'').trim();
    const parts=rawCode.split('.');
    if(parts.length===4 && parts.every(p=>/^\d+$/.test(p))){
      const [b,c,s,i]=parts;
      project.buildings[b]=project.buildings[b]||{name:''};
      project.chapters[b+'.'+c]=project.chapters[b+'.'+c]||{name:legacySection.chapter||''};
      project.subchapters[b+'.'+c+'.'+s]=project.subchapters[b+'.'+c+'.'+s]||{name:legacySection.sub||''};
      return {building:b,chapter:c,sub:s,item:i};
    }
    // no parseable hierarchy — bucket everything under a synthetic building "00",
    // and derive chapter/sub codes from the free-text names (stable per name).
    const bCode='00';
    project.buildings[bCode]=project.buildings[bCode]||{name:'כללי (יובא מגרסה קודמת)'};
    const chName=legacySection.chapter||'ללא פרק';
    if(!codeCache.chapters.has(chName)){ codeCache.chapters.set(chName, String(codeCache.chapters.size+1).padStart(2,'0')); }
    const cCode=codeCache.chapters.get(chName);
    project.chapters[bCode+'.'+cCode]=project.chapters[bCode+'.'+cCode]||{name:chName};
    const subName=legacySection.sub||'ללא תת-פרק';
    const subKey=chName+'|'+subName;
    if(!codeCache.subs.has(subKey)){ codeCache.subs.set(subKey, String(codeCache.subs.size+1).padStart(2,'0')); }
    const sCode=codeCache.subs.get(subKey);
    project.subchapters[bCode+'.'+cCode+'.'+sCode]=project.subchapters[bCode+'.'+cCode+'.'+sCode]||{name:subName};
    if(!codeCache.items.has(rawCode||legacySection.id)){ codeCache.items.set(rawCode||legacySection.id, String(codeCache.items.size+1).padStart(4,'0')); }
    const iCode=codeCache.items.get(rawCode||legacySection.id);
    return {building:bCode,chapter:cCode,sub:sCode,item:iCode};
  },
  convertLegacyProject(legacy){
    const p=makeProject({
      name:(legacy.project&&legacy.project.name)||'פרויקט מיובא',
      location:(legacy.project&&legacy.project.loc)||'',
      contractNumber:(legacy.project&&legacy.project.contract)||'',
      contractor:(legacy.project&&legacy.project.contractor)||'',
      supervisor:(legacy.project&&legacy.project.inspector)||'',
      manager:(legacy.project&&legacy.project.manager)||'',
      vat:(legacy.project&&+legacy.project.vat)||18,
      logo:(legacy.project&&legacy.project.logo)||null,
      logoMode:(legacy.project&&legacy.project.logoMode)||'wide',
      useAreas:!!(legacy.project&&legacy.project.useAreas),
    });
    const codeCache={chapters:new Map(),subs:new Map(),items:new Map()};
    const secToItem={};
    (legacy.sections||[]).forEach(s=>{
      const h=this.resolveHierarchy(p,s,codeCache);
      const it=makeBoqItem({building:h.building,chapter:h.chapter,sub:h.sub,item:h.item,
        description:s.name||'', unit:s.unit||'מ"ק', contractQty:s.contract||'', unitPrice:s.price||''});
      p.items.push(it); secToItem[s.id]=it.id;
    });
    // account list: legacy project.lockedAccounts=[{acc,date}] maps directly to locked Account records.
    const lockedMeta=(legacy.project&&legacy.project.lockedAccounts)||[];
    const accountsByNo={};
    lockedMeta.forEach(l=>{ const a=makeAccount(l.acc); a.status='locked'; a.date=l.date||todayISO(); a.lockedAt=l.date||nowISO();
      a.notes='מיובא מגרסה קודמת — תמונת המצב שוחזרה באופן מיטבי מנתוני האישור ההיסטוריים (רמת תיקון אחת בלבד נשמרה בגרסה הקודמת).';
      accountsByNo[a.number]=a; p.accounts.push(a); });
    const draftNo=(legacy.project&&legacy.project.acc)||String(lockedMeta.length+1).padStart(3,'0');
    if(!accountsByNo[draftNo]) p.accounts.push(makeAccount(draftNo));
    // measurements + best-effort history reconstruction from apAcc/apVal/apSig/corrAcc/corrFrom
    (legacy.measurements||[]).forEach(m=>{
      this.migrateRowShape(m);
      const itemId=secToItem[m.secId]; if(!itemId && !m.isGroup) return;
      const row=makeMeasurement({itemId, isGroup:!!m.isGroup, groupLabel:m.groupLabel||'',
        desc:m.desc||'', area:m.area||'', shape:m.shape||'מלבן', d1:m.d1||'', d2:m.d2||'', d3:m.d3||'',
        t:m.t||'', qty:m.qty||'', sign:m.sign||1, notes:m.notes||''});
      if(!m.isGroup){
        const cur=calcRow(row);
        if('apAcc' in m){
          const accDate=(accountsByNo[m.apAcc]&&accountsByNo[m.apAcc].date)||todayISO();
          row.history.push({accountId:(accountsByNo[m.apAcc]&&accountsByNo[m.apAcc].id)||null,
            accountNumber:m.apAcc, action:'created', value:nz(m.apVal), prevValue:0, date:accDate});
          if(m.corrAcc){
            const cDate=(accountsByNo[m.corrAcc]&&accountsByNo[m.corrAcc].date)||todayISO();
            row.history.push({accountId:(accountsByNo[m.corrAcc]&&accountsByNo[m.corrAcc].id)||null,
              accountNumber:m.corrAcc, action:'corrected', value:cur, prevValue:nz(m.apVal), date:cDate});
          }
        }
      }
      p.items.length; p.measurements.push(row);
    });
    // reconstruct each locked account's snapshot from the history we just synthesized
    lockedMeta.forEach(l=>{ Accounts.buildSnapshotForNumber(p,l.acc); });
    const lastLocked=p.accounts.filter(a=>a.status==='locked').sort((a,b)=>+a.number-+b.number).pop();
    if(lastLocked) lastLocked.snapshot = Accounts.buildSnapshotForNumber(p,lastLocked.number,true);
    return p;
  },
  async run(){
    if(!this.legacyExists()) return [];
    const migrated=[];
    try{
      const raw=localStorage.getItem(this.LEGACY_STORE_KEY);
      if(raw){
        const st=JSON.parse(raw);
        for(const pid of Object.keys(st.projects||{})){
          const p=this.convertLegacyProject(st.projects[pid]);
          await Storage.saveProject(p); migrated.push(p);
        }
      } else {
        const raw1=localStorage.getItem(this.LEGACY_SINGLE_KEY);
        if(raw1){ const d=JSON.parse(raw1); const p=this.convertLegacyProject(d); await Storage.saveProject(p); migrated.push(p); }
      }
    }catch(e){ console.error('Migration failed', e); }
    return migrated;
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: CALCULATION ENGINE
//  Every measurement row is calculated strictly against the geometry
//  "kind" of the BOQ item it belongs to (area / volume / length / count).
//  This is what makes an invalid combination (e.g. thickness on an m² item)
//  structurally impossible rather than just warned-about — see Measurements
//  module: the UI only renders the shape picker + fields valid for the
//  item's own kind, and calcRow never receives out-of-kind inputs.
// ═══════════════════════════════════════════════════════════════════════
function itemUnitKind(item){ return (item && UNIT_KIND[item.unit] && UNIT_KIND[item.unit].kind) || 'volume'; }
function inferKindFromShape(m){ // fallback used only by legacy migration (no item context yet)
  if(m.shape==='קו') return 'length';
  if(m.shape==='יחידה') return 'count';
  return nz(m.t)>0 ? 'volume' : 'area';
}
function findItem(project,itemId){ return project.items.find(it=>it.id===itemId); }
function rowKind(m,project){
  const item = project ? findItem(project,m.itemId) : null;
  return item ? itemUnitKind(item) : inferKindFromShape(m);
}
// raw geometric value before N and sign, plus its natural unit + completeness flag
function baseVal(m,kind){
  kind = kind || inferKindFromShape(m);
  if(kind==='length') return {v:nz(m.d1), u:'מ"א', complete:nz(m.d1)>0};
  if(kind==='count')  return {v:(m.d1===''||m.d1==null)?1:nz(m.d1), u:"יח'", complete:true};
  const c=CROSS[m.shape];
  if(!c) return {v:0,u:'',complete:false};
  const area = c.custom ? nz(m.d1) : c.area(nz(m.d1),nz(m.d2),nz(m.d3));
  if(kind==='area') return {v:area, u:'מ"ר', complete:area>0};
  // volume: cross-section area × extrusion length (t) — both required
  const t=nz(m.t);
  return {v:area*t, u:'מ"ק', complete:area>0 && t>0};
}
function calcRow(m,item){
  if(m.isGroup||m.cancelled) return 0;
  const kind = item ? itemUnitKind(item) : inferKindFromShape(m);
  const {v}=baseVal(m,kind);
  const n=(m.qty===''||m.qty==null)?1:nz(m.qty);
  return v*n*(m.sign||1);
}
function rowUnit(m,kind){ return baseVal(m,kind).u; }
function rowComplete(m,kind){ return baseVal(m,kind||inferKindFromShape(m)).complete; }
function rowFormulaLabel(m,kind){
  kind=kind||inferKindFromShape(m);
  if(kind==='length') return 'אורך';
  if(kind==='count') return 'ספירה';
  const c=CROSS[m.shape]; if(!c) return '';
  return kind==='volume' ? `(${c.lbl}) × עובי` : c.lbl;
}
function rowSig(m){ return JSON.stringify([m.shape,m.d1,m.d2,m.d3,m.t,m.qty,m.sign]); }

// ── SVG drawing engine (isometric extrusion for volumes, flat face for areas) ──
function normSet(vals,maxPx,minPx){ const mx=Math.max(...vals.filter(v=>v>0),0.001);
  return vals.map(v=>!v?0:Math.max(minPx,Math.min(maxPx,(v/mx)*maxPx))); }
function dimH(x1,x2,y,l,below){ const ty=below?y+13:y-5;
  return `<line class="dim" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="dim" x1="${x1}" y1="${y-3}" x2="${x1}" y2="${y+3}"/><line class="dim" x1="${x2}" y1="${y-3}" x2="${x2}" y2="${y+3}"/><text class="dimtext" x="${(x1+x2)/2}" y="${ty}">${l}</text>`; }
function dimV(y1,y2,x,l,left){ const tx=left?x-6:x+6,an=left?'end':'start';
  return `<line class="dim" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line class="dim" x1="${x-3}" y1="${y1}" x2="${x+3}" y2="${y1}"/><line class="dim" x1="${x-3}" y1="${y2}" x2="${x+3}" y2="${y2}"/><text class="dimtext" x="${tx}" y="${(y1+y2)/2+3}" style="text-anchor:${an}">${l}</text>`; }
function isoPrism(pts,o){
  const back=pts.map(p=>[p[0]+o,p[1]-o]);
  let sides='';
  for(let i=0;i<pts.length;i++){ const j=(i+1)%pts.length;
    sides+=`<polygon class="faceSide" points="${pts[i][0]},${pts[i][1]} ${pts[j][0]},${pts[j][1]} ${back[j][0]},${back[j][1]} ${back[i][0]},${back[i][1]}"/>`; }
  const bk=`<polygon class="faceTop" points="${back.map(p=>p.join(',')).join(' ')}"/>`;
  const fr=`<polygon class="face" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  return bk+sides+fr;
}
function depthLabel(pts,o,l){
  let idx=0,best=-1e9; pts.forEach((p,i)=>{const s=p[0]-p[1];if(s>best){best=s;idx=i;}});
  const p=pts[idx];
  return `<line class="dim" x1="${p[0]+1}" y1="${p[1]-1}" x2="${p[0]+o+1}" y2="${p[1]-o-1}"/><text class="dimtext" x="${p[0]+o+9}" y="${p[1]-o+2}">${l}</text>`;
}
function shapeSVG(shape,d1,d2,d3,ded,big,t,kind){
  const W=big?175:122, H=big?118:80;
  const cls=(ded?'ded ':'')+'shp';
  d1=nz(d1);d2=nz(d2);d3=nz(d3);t=nz(t);
  if(shape==='קו'){ const[w]=normSet([d1],big?128:82,30); const y=H/2,px=(W-w)/2;
    const inner=`<line x1="${px}" y1="${y}" x2="${px+w}" y2="${y}" stroke="#2B3A52" stroke-width="3"/><line x1="${px}" y1="${y-6}" x2="${px}" y2="${y+6}" stroke="#2B3A52" stroke-width="2"/><line x1="${px+w}" y1="${y-6}" x2="${px+w}" y2="${y+6}" stroke="#2B3A52" stroke-width="2"/>${dimH(px,px+w,y-10,fnum(d1))}`;
    return svgWrap(inner,W,H,cls,big);
  }
  if(shape==='יחידה'){ const inner=`<text x="${W/2}" y="${H/2+9}" style="font:800 26px Heebo;fill:#2B3A52;text-anchor:middle">×${fnum(d1)||1}</text>`; return svgWrap(inner,W,H,cls,big); }
  if(shape==='שטח מיוחד'){
    const inner=`<rect x="${W/2-40}" y="${H/2-24}" width="80" height="48" fill="#DCE6F2" stroke="#2B3A52" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${W/2}" y="${H/2-2}" style="font:800 12px Heebo;fill:#2B3A52;text-anchor:middle">A = ${fnum(d1)}</text><text x="${W/2}" y="${H/2+14}" style="font:600 9px Heebo;fill:#6E7A88;text-anchor:middle">מ"ר (שטח נתון)</text>`;
    return svgWrap(inner,W,H,cls,big);
  }
  const vol = kind==='volume';
  const c=CROSS[shape]; if(!c) return '';
  const o = vol ? Math.max(big?12:8, Math.min(big?30:20, normSet([t,Math.max(d1,d2,d3,0.001)],big?34:24,6)[0])) : 0;
  let inner='';
  const isHalf = shape==='חצי-עיגול';
  if(shape==='עיגול'||isHalf){
    const[dia]=normSet([d1],big?78:50,20); const r=dia/2,cx=W/2;
    if(vol){ const h=Math.max(big?40:26, Math.min(big?70:48, o*3)); const ry=r/3.2,top=(H-h)/2-4;
      const arc = isHalf?`M${cx-r},${top} A${r},${ry} 0 0 1 ${cx+r},${top}`:`M${cx-r},${top} L${cx-r},${top+h} A${r},${ry} 0 0 0 ${cx+r},${top+h} L${cx+r},${top} Z`;
      inner=`<ellipse class="faceTop" cx="${cx}" cy="${top}" rx="${r}" ry="${ry}"/><path class="faceSide" d="${arc}"/><ellipse class="face" cx="${cx}" cy="${top+h}" rx="${r}" ry="${ry}"/>${dimV(top,top+h,cx+r+7,fnum(t),false)}<text class="dimtext" x="${cx}" y="${top+h+17}">Ø${fnum(d1)}</text>`;
    } else { const cy=H/2;
      if(isHalf) inner=`<path class="face" d="M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy} Z"/><line class="dim" x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}"/><text class="dimtext" x="${cx}" y="${cy-6}">Ø${fnum(d1)}</text>`;
      else inner=`<circle class="face" cx="${cx}" cy="${cy}" r="${r}"/><line class="dim" x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}"/><text class="dimtext" x="${cx}" y="${cy-6}">Ø${fnum(d1)}</text>`;
    }
    return svgWrap(inner,W,H,cls,big);
  }
  let pts=[];
  const availW=(big?118:80)-o;
  if(shape==='מלבן'){ const[w,h]=normSet([d1,d2],Math.min(big?112:74,availW),16);
    const px=(W-w)/2-o/2, py=(H-h)/2+o/2; pts=[[px,py],[px+w,py],[px+w,py+h],[px,py+h]];
    var dims=vol?`${dimH(px,px+w,py+h+4,fnum(d1),true)}${dimV(py,py+h,px-4,fnum(d2),true)}`
            :`${dimH(px,px+w,py-2,fnum(d1))}${dimV(py,py+h,px+w+3,fnum(d2),false)}`;
  }
  else if(shape==='משולש'){ const[b,h]=normSet([d1,d2],Math.min(big?104:66,availW),20);
    const px=(W-b)/2-o/2, y=(H+h)/2+o/2; pts=[[px,y],[px+b,y],[px+b/2,y-h]];
    var dims=`${dimH(px,px+b,y+4,fnum(d1),true)}${dimV(y-h,y,px+b+5,fnum(d2),false)}`;
  }
  else if(shape==='טרפז'){ const[a,b,h]=normSet([d1,d2,d3],Math.min(big?104:64,availW),16);
    const cx=W/2-o/2, y=(H+h)/2+o/2;
    pts=[[cx-a/2,y-h],[cx+a/2,y-h],[cx+b/2,y],[cx-b/2,y]];
    var dims=`${dimH(cx-a/2,cx+a/2,y-h-2,fnum(d1))}${dimH(cx-b/2,cx+b/2,y+4,fnum(d2),true)}${dimV(y-h,y,cx+Math.max(a,b)/2+6,fnum(d3),false)}`;
  }
  if(!pts.length) return '';
  if(vol) inner=isoPrism(pts,o)+dims+depthLabel(pts,o,fnum(t));
  else inner=`<polygon class="face" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+dims;
  return svgWrap(inner,W,H,cls,big);
}
function svgWrap(inner,W,H,cls,big){
  const PAD=big?22:18;
  return `<svg viewBox="${-PAD} ${-PAD} ${W+2*PAD} ${H+2*PAD}" width="${W}" height="${H}" class="${cls}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: ACCOUNTS  (draft/locked lifecycle, immutable snapshots, history)
//
//  Design note (this is the key fix over the pre-v3 data model):
//  the old app stamped each row with ONE approval account + at most one
//  correction, so a second correction silently lost the first one. Here,
//  every measurement row carries an append-only `history[]`, and every
//  LOCKED account stores a full immutable `snapshot` reconstructed from
//  that history as of its own account number. Snapshots are written once
//  and never mutated again — viewing "what Account 002 looked like" is a
//  plain read of account.snapshot, correct forever regardless of later
//  corrections. See buildSnapshotForNumber(), the single function both
//  Accounts.lock() and Migration use to freeze a point in time.
// ═══════════════════════════════════════════════════════════════════════
const Accounts = {
  list(project){ return project.accounts.slice().sort((a,b)=>+a.number-+b.number); },
  current(project){ // the single draft (open) account — auto-repairs if missing
    let d=project.accounts.find(a=>a.status==='draft');
    if(!d){ d=makeAccount(this.nextNumber(project)); project.accounts.push(d); }
    return d;
  },
  byId(project,id){ return project.accounts.find(a=>a.id===id); },
  byNumber(project,num){ return project.accounts.find(a=>a.number===String(num).padStart(3,'0')); },
  nextNumber(project){
    const nums=project.accounts.map(a=>+a.number).filter(n=>!isNaN(n));
    return String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
  },
  lockedAccounts(project){ return this.list(project).filter(a=>a.status==='locked'); },
  previousLocked(project,beforeNumber){
    const n=+beforeNumber;
    const locked=this.lockedAccounts(project).filter(a=>+a.number<n);
    return locked.length ? locked[locked.length-1] : null;
  },
  previousSnapshot(project,account){ const p=this.previousLocked(project,account.number); return p?p.snapshot:null; },

  // freeze the state of every measurement row AS OF `accountNumber`, using each
  // row's history[] (latest entry with accountNumber <= target). Used both for
  // live locking (target = the account being locked, whose history entries were
  // just appended) and for legacy-migration reconstruction.
  buildSnapshotForNumber(project,accountNumber){
    const target=+accountNumber;
    const rows=[];
    project.measurements.forEach(m=>{
      if(m.isGroup) return;
      const entries=(m.history||[]).filter(h=>+h.accountNumber<=target).sort((a,b)=>+a.accountNumber-+b.accountNumber);
      if(!entries.length) return; // row did not exist yet at this account
      const last=entries[entries.length-1];
      rows.push({id:m.id,itemId:m.itemId,value:last.action==='cancelled'?0:nz(last.value),
        cancelled:last.action==='cancelled', desc:m.desc,area:m.area,shape:m.shape,
        d1:m.d1,d2:m.d2,d3:m.d3,t:m.t,qty:m.qty,sign:m.sign,notes:m.notes});
    });
    const items=cloneObj(project.items);
    const totals=this.computeTotals(project,rows,items);
    return {accountNumber:String(accountNumber).padStart(3,'0'),lockedAt:null,items,measurements:rows,totals};
  },
  computeTotals(project,rows,items){
    const byItem={}; let grandQty=0,grandAmount=0;
    items.forEach(it=>{
      const q=rows.filter(r=>r.itemId===it.id && !r.cancelled).reduce((a,r)=>a+nz(r.value),0);
      const amt=q*nz(it.unitPrice);
      byItem[it.id]={qty:q,amount:amt};
      grandAmount+=amt;
    });
    const vat=nz(project.vat)/100;
    return {byItem, grandAmount, vatAmount:grandAmount*vat, totalWithVat:grandAmount*(1+vat)};
  },

  // per-item movement for a given account (draft = live data, locked = its own snapshot)
  itemMovement(project,item,account){
    const isDraft=account.status==='draft';
    const curRows = isDraft
      ? project.measurements.filter(m=>!m.isGroup && m.itemId===item.id)
      : (account.snapshot?account.snapshot.measurements.filter(r=>r.itemId===item.id):[]);
    const prevSnap=this.previousSnapshot(project,account);
    let previousCumulative=0,addition=0,correction=0;
    const seen=new Set();
    curRows.forEach(r=>{
      seen.add(r.id);
      const curVal = r.cancelled?0:(isDraft?calcRow(r,item):nz(r.value));
      const prevRow = prevSnap ? prevSnap.measurements.find(x=>x.id===r.id) : null;
      if(prevRow){ const pv=prevRow.cancelled?0:nz(prevRow.value); previousCumulative+=pv; correction+=(curVal-pv); }
      else addition+=curVal;
    });
    if(prevSnap) prevSnap.measurements.filter(r=>r.itemId===item.id).forEach(pr=>{
      if(!seen.has(pr.id)){ const pv=pr.cancelled?0:nz(pr.value); previousCumulative+=pv; correction-=pv; }
    });
    const currentCumulative=previousCumulative+addition+correction;
    const contractQty=nz(item.contractQty);
    const balance=contractQty-currentCumulative;
    const completionPct=contractQty>0?(currentCumulative/contractQty*100):(Math.abs(currentCumulative)>1e-9?100:0);
    return {previousCumulative,addition,correction,currentCumulative,contractQty,balance,completionPct,
      overrun:contractQty>0 && currentCumulative>contractQty+1e-9,
      amount:currentCumulative*nz(item.unitPrice), periodAmount:(addition+correction)*nz(item.unitPrice)};
  },
  // rows that actually moved in this account (for "רק תנועה בחשבון זה")
  movementRows(project,item,account){
    const isDraft=account.status==='draft';
    const curRows = isDraft
      ? project.measurements.filter(m=>!m.isGroup && m.itemId===item.id)
      : (account.snapshot?account.snapshot.measurements.filter(r=>r.itemId===item.id):[]);
    const prevSnap=this.previousSnapshot(project,account);
    return curRows.filter(r=>{
      const curVal=r.cancelled?0:(isDraft?calcRow(r,item):nz(r.value));
      const prevRow=prevSnap?prevSnap.measurements.find(x=>x.id===r.id):null;
      const prevVal=prevRow?(prevRow.cancelled?0:nz(prevRow.value)):0;
      return Math.abs(curVal-prevVal)>1e-9 || (r.cancelled && prevRow && !prevRow.cancelled);
    });
  },
  projectTotals(project,account){
    let contractTotal=0,cumulativeAmount=0,previousAmount=0,periodAmount=0;
    project.items.filter(it=>!it.cancelled).forEach(it=>{
      contractTotal+=nz(it.contractQty)*nz(it.unitPrice);
      const mv=this.itemMovement(project,it,account);
      cumulativeAmount+=mv.amount; previousAmount+=mv.previousCumulative*nz(it.unitPrice); periodAmount+=mv.periodAmount;
    });
    const vat=nz(project.vat)/100;
    return {contractTotal,cumulativeAmount,previousAmount,periodAmount,
      cumulativeWithVat:cumulativeAmount*(1+vat),periodWithVat:periodAmount*(1+vat),
      balance:contractTotal-cumulativeAmount, completionPct: contractTotal>0?(cumulativeAmount/contractTotal*100):0};
  },
  draftHasMovement(project){
    const d=this.current(project);
    return project.items.some(it=>{ const mv=this.itemMovement(project,it,d); return Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9; });
  },

  // ── LOCK: validate → stamp history on every changed row → freeze snapshot → open next draft ──
  lock(project){
    const v=Validation.run(project);
    if(v.critical.length) return {ok:false,critical:v.critical,warnings:v.warnings};
    const draft=this.current(project);
    if(draft.status!=='draft') return {ok:false,critical:[{msg:'אין חשבון טיוטה פתוח לנעילה'}],warnings:[]};
    const today=todayISO();
    project.measurements.forEach(m=>{
      if(m.isGroup) return;
      const item=findItem(project,m.itemId);
      const lastEntry=m.history.length?m.history[m.history.length-1]:null;
      if(m.cancelled){
        if(lastEntry && lastEntry.action!=='cancelled'){
          m.history.push({accountId:draft.id,accountNumber:draft.number,action:'cancelled',value:0,prevValue:nz(lastEntry.value),date:today});
        }
        return;
      }
      if(!item) return;
      const cur=calcRow(m,item);
      if(!lastEntry){
        if(Math.abs(cur)>1e-9) m.history.push({accountId:draft.id,accountNumber:draft.number,action:'created',value:cur,prevValue:0,date:today});
      } else if(Math.abs(cur-nz(lastEntry.value))>1e-9){
        m.history.push({accountId:draft.id,accountNumber:draft.number,action:'corrected',value:cur,prevValue:nz(lastEntry.value),date:today});
      }
    });
    // garbage-collect rows that were cancelled before ever being part of a locked account
    project.measurements=project.measurements.filter(m=>m.isGroup || !m.cancelled || m.history.length);
    const snapshot=this.buildSnapshotForNumber(project,draft.number);
    snapshot.lockedAt=nowISO();
    draft.status='locked'; draft.lockedAt=nowISO(); draft.snapshot=snapshot;
    const next=makeAccount(this.nextNumber(project));
    project.accounts.push(next);
    return {ok:true,warnings:v.warnings,locked:draft,next};
  },
  // safety-gated undo of the most recent lock (not part of the core spec, but
  // protects against a mis-click — refuses if the account after it already has work)
  unlockLast(project){
    const locked=this.lockedAccounts(project);
    const last=locked[locked.length-1];
    if(!last) return {ok:false,msg:'אין חשבון נעול לביטול'};
    if(this.draftHasMovement(project)) return {ok:false,msg:'לא ניתן לבטל — כבר הוזנו נתונים בחשבון הפתוח. יש להסיר אותם קודם.'};
    project.measurements.forEach(m=>{ m.history=(m.history||[]).filter(h=>h.accountNumber!==last.number); });
    const draft=project.accounts.find(a=>a.status==='draft');
    if(draft) project.accounts=project.accounts.filter(a=>a.id!==draft.id);
    last.status='draft'; last.snapshot=null; last.lockedAt=null;
    return {ok:true};
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: VALIDATION ENGINE
//  Critical findings BLOCK locking; warnings require an explicit confirm.
// ═══════════════════════════════════════════════════════════════════════
const NUM_RE=/^-?\d+([.,]\d+)?$/;
const Validation = {
  run(project){
    const critical=[], warnings=[];
    const draft=Accounts.current(project);
    // duplicate item codes
    const byCode={};
    project.items.filter(it=>!it.cancelled).forEach(it=>{ const c=itemFullCode(it); (byCode[c]=byCode[c]||[]).push(it); });
    Object.entries(byCode).forEach(([code,arr])=>{ if(arr.length>1) arr.forEach(it=>
      critical.push({code:'dup',itemId:it.id,msg:`קוד סעיף כפול: ${code} (${arr.length} מופעים)`})); });
    // orphan measurement rows
    project.measurements.forEach(m=>{ if(m.isGroup||m.cancelled) return;
      if(!findItem(project,m.itemId)) critical.push({code:'orphan',rowId:m.id,msg:'שורת מדידה מקושרת לסעיף שאינו קיים'}); });
    project.items.filter(it=>!it.cancelled).forEach(it=>{
      const kind=itemUnitKind(it);
      if(!it.unit) critical.push({code:'nounit',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסרה יחידת מידה`});
      if(!it.description) warnings.push({code:'nodesc',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסר תיאור`});
      if(it.unitPrice===''||it.unitPrice==null) warnings.push({code:'noprice',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסר מחיר יחידה`});
      if(it.contractQty===''||it.contractQty==null) warnings.push({code:'noqty',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: חסרה כמות חוזית`});
      const rows=project.measurements.filter(m=>!m.isGroup && m.itemId===it.id && !m.cancelled);
      if(!rows.length && nz(it.contractQty)>0) warnings.push({code:'nomeas',itemId:it.id,msg:`סעיף ${itemFullCode(it)}: יש כמות חוזית אך אין שורות מדידה`});
      rows.forEach(m=>{
        ['d1','d2','d3','t','qty'].forEach(k=>{ const v=m[k]; if(v!=='' && v!=null && !NUM_RE.test(String(v).trim()))
          critical.push({code:'nan',rowId:m.id,itemId:it.id,msg:`סעיף ${itemFullCode(it)}: ערך לא מספרי בשדה ${k}`}); });
        const touched = ['d1','d2','d3','t','qty'].some(k=>m[k]!=='' && m[k]!=null);
        if(!touched) return;
        const bv=baseVal(m,kind);
        if(kind==='volume' && !bv.complete) critical.push({code:'incomplete-vol',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)} (מ"ק): שורת מדידה חסרה עובי/אורך — לא ניתן לחשב נפח`});
        if(kind==='area' && nz(m.t)>0) critical.push({code:'area-thick',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)} (מ"ר): לא ניתן להזין עובי בסעיף שטח`});
        if(bv.complete && Math.abs(calcRow(m,it))<1e-9) warnings.push({code:'zero',rowId:m.id,itemId:it.id,
          msg:`סעיף ${itemFullCode(it)}: שורת מדידה מחושבת ל-0`});
      });
      const mv=Accounts.itemMovement(project,it,draft);
      if(mv.overrun) warnings.push({code:'overrun',itemId:it.id,
        msg:`סעיף ${itemFullCode(it)}: חריגה מהכמות החוזית (${pct(mv.completionPct)}, +${fn(mv.currentCumulative-mv.contractQty)} ${it.unit})`});
      if(mv.previousCumulative>1e-9 && Math.abs(mv.addition+mv.correction) > mv.previousCumulative*2)
        warnings.push({code:'deviation',itemId:it.id,
          msg:`סעיף ${itemFullCode(it)}: סטייה גדולה מהחשבון הקודם (שינוי של ${fn(mv.addition+mv.correction)} ${it.unit} בתקופה זו)`});
    });
    return {critical,warnings};
  },
};
// ═══════════════════════════════════════════════════════════════════════
//  MODULE: STATE  (current in-memory project + autosave)
// ═══════════════════════════════════════════════════════════════════════
const State = {
  project:null,
  saveTimer:null,
  scheduleSave(){
    UI.setSaveStatus('saving');
    clearTimeout(this.saveTimer);
    this.saveTimer=setTimeout(()=>this.save(),400);
  },
  async save(){
    if(!this.project) return;
    this.project.updatedAt=nowISO();
    try{ await Storage.saveProject(this.project); UI.setSaveStatus('saved'); }
    catch(e){ console.error(e); UI.setSaveStatus('err'); }
  },
};

// screen render functions register themselves here: Screens.dashboard = fn, etc.
const Screens = {};

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: APP  (boot, navigation, topbar)
// ═══════════════════════════════════════════════════════════════════════
const App = {
  async boot(){
    await Storage.init();
    const migrated=await Migration.run();
    if(migrated.length) toast(`יובאו ${migrated.length} פרויקטים מהגרסה הקודמת`,'ok');
    const lastId=await Storage.getMeta('currentProjectId',null);
    if(lastId){ const p=await Storage.getProject(lastId); if(p){ await this.openProject(lastId); return; } }
    this.goHome();
  },
  async goHome(){
    State.project=null;
    byId('app-shell').style.display='none';
    byId('home-screen').style.display='block';
    await Storage.setMeta('currentProjectId',null);
    await Projects.renderList();
  },
  async openProject(id){
    const p=await Storage.getProject(id);
    if(!p){ toast('פרויקט לא נמצא','err'); return this.goHome(); }
    State.project=p;
    await Storage.setMeta('currentProjectId',id);
    byId('home-screen').style.display='none';
    byId('app-shell').style.display='block';
    this.paintTopbar();
    this.showTab('dashboard');
  },
  paintTopbar(){
    const p=State.project; if(!p) return;
    byId('tb-proj-name').textContent=p.name||'פרויקט ללא שם';
    const draft=Accounts.current(p);
    byId('tb-proj-sub').textContent=`${p.location||''}${p.location?' · ':''}חשבון ${draft.number}`;
    this.updateBadges();
  },
  updateBadges(){
    const p=State.project; if(!p) return;
    byId('bdg-boq').textContent=p.items.filter(it=>!it.cancelled).length;
    const v=Validation.run(p);
    const errBdg=byId('bdg-accounts-warn');
  },
  showTab(tab){
    qsa('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
    const host=byId('screens-host');
    if(Screens[tab]) host.innerHTML=Screens[tab]();
    else host.innerHTML='<div class="empty"><div class="ic">🚧</div><div class="t">בבנייה</div></div>';
    this.paintTopbar();
  },
  refresh(){ // re-render whichever tab is active after a data change
    const on=qs('.tab.on'); if(on) this.showTab(on.dataset.tab);
  },
};

// ═══════════════════════════════════════════════════════════════════════
//  MODULE: PROJECTS  (home screen — selector, CRUD)
// ═══════════════════════════════════════════════════════════════════════
const Projects = {
  async all(){ return Storage.listProjects(); },
  async renderList(){
    const host=byId('proj-grid'); if(!host) return;
    const list=await this.all();
    const q=(byId('home-search').value||'').trim().toLowerCase();
    const filtered=q?list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)):list;
    filtered.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    let h=`<div class="proj-card-new" onclick="Projects.openNewModal()"><div class="ic">＋</div><div>פרויקט חדש</div></div>`;
    h+=filtered.map(p=>{
      const draft=Accounts.current(p);
      const totals=Accounts.projectTotals(p,draft);
      return `<div class="proj-card" onclick="Projects.open('${p.id}')">
        <div class="pc-top"><div><div class="pc-name">${esc(p.name||'ללא שם')}</div><div class="pc-loc">${esc(p.location||'—')}</div></div>
          <span class="stat draft">חשבון ${esc(draft.number)}</span></div>
        <div class="pc-stats">
          <div>מצטבר נוכחי<b>${money(totals.cumulativeWithVat)}</b></div>
          <div>ביצוע<b>${pct(totals.completionPct)}</b></div>
          <div>עדכון אחרון<b style="font-size:11px">${fdate(p.updatedAt)}</b></div>
        </div>
        <div class="pc-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" title="שכפול" onclick="Projects.duplicate('${p.id}')">⧉</button>
          <button class="icon-btn" title="ייצוא" onclick="Backup.exportProjectById('${p.id}')">⇩</button>
          <button class="icon-btn del" title="מחיקה" onclick="Projects.remove('${p.id}')">🗑</button>
        </div></div>`;
    }).join('');
    host.innerHTML=h;
  },
  openNewModal(){
    UI.openModal(`<div class="modal-hd">פרויקט חדש<span class="x" onclick="UI.closeModal()">✕</span></div>
      <div class="grid2">
        <div class="fld"><label>שם הפרויקט *</label><input id="np-name" placeholder="לדוגמה: מגדל רוגוזין"></div>
        <div class="fld"><label>מיקום</label><input id="np-loc"></div>
        <div class="fld"><label>מס׳ חוזה</label><input id="np-contract"></div>
        <div class="fld"><label>קבלן מבצע</label><input id="np-contractor"></div>
        <div class="fld"><label>מפקח</label><input id="np-supervisor"></div>
        <div class="fld"><label>מנהל פרויקט</label><input id="np-manager"></div>
        <div class="fld"><label>מע"מ %</label><input id="np-vat" type="number" value="18"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>
        <button class="btn btn-gold" onclick="Projects.createFromModal()">צור פרויקט</button></div>`);
    setTimeout(()=>byId('np-name').focus(),50);
  },
  async createFromModal(){
    const name=byId('np-name').value.trim();
    if(!name){ toast('יש להזין שם פרויקט','err'); return; }
    const p=makeProject({name, location:byId('np-loc').value.trim(), contractNumber:byId('np-contract').value.trim(),
      contractor:byId('np-contractor').value.trim(), supervisor:byId('np-supervisor').value.trim(),
      manager:byId('np-manager').value.trim(), vat:+byId('np-vat').value||18});
    p.accounts=[makeAccount('001')];
    await Storage.saveProject(p);
    UI.closeModal(); toast('הפרויקט נוצר');
    await this.open(p.id);
  },
  async open(id){ await App.openProject(id); },
  async duplicate(id){
    const src=await Storage.getProject(id); if(!src) return;
    // duplication is a BOQ/settings template copy: items & pricing carry over,
    // but execution history (measurements/accounts) starts fresh — duplicating
    // a project is normally "same building type, new site", not "same job twice".
    const p=makeProject({name:src.name+' (עותק)', location:src.location, contractNumber:src.contractNumber,
      contractor:src.contractor, supervisor:src.supervisor, manager:src.manager, vat:src.vat,
      logo:src.logo, logoMode:src.logoMode, useAreas:src.useAreas});
    p.buildings=cloneObj(src.buildings); p.chapters=cloneObj(src.chapters); p.subchapters=cloneObj(src.subchapters);
    p.items=cloneObj(src.items).map(it=>({...it,id:uid('item_'),createdInAccount:null}));
    p.accounts=[makeAccount('001')];
    await Storage.saveProject(p);
    toast('הפרויקט שוכפל (כתב הכמויות בלבד — ללא היסטוריית חשבונות)');
    this.renderList();
  },
  async remove(id){
    const p=await Storage.getProject(id); if(!p) return false;
    if(!confirm(`למחוק לצמיתות את הפרויקט "${p.name}"?\nפעולה זו אינה הפיכה. מומלץ לייצא גיבוי קודם.`)) return false;
    await Storage.deleteProject(id);
    toast('הפרויקט נמחק');
    if(!State.project||State.project.id!==id) this.renderList();
    return true;
  },
};

//  MODULE: BOQ  (Building → Chapter → Subchapter → Item tree)
// ═══════════════════════════════════════════════════════════════════════
const BOQ = {
  _expanded:new Set(),
  _lastHighlight:null,
  key(b,c,s){ return [b,c,s].filter(x=>x!=null).join('.'); },
  isExpanded(key){ return this._expanded.has(key); },
  toggleNode(key){ this._expanded.has(key)?this._expanded.delete(key):this._expanded.add(key); App.refresh(); },
  expandAll(){
    const p=State.project;
    this._expanded.clear();
    p.items.filter(it=>!it.cancelled).forEach(it=>{
      this._expanded.add(this.key(it.building)); this._expanded.add(this.key(it.building,it.chapter)); this._expanded.add(this.key(it.building,it.chapter,it.sub));
    });
    App.refresh();
  },
  collapseAll(){ this._expanded.clear(); App.refresh(); },
  duplicateExists(project,building,chapter,sub,item,excludeId){
    const code=`${building}.${chapter}.${sub}.${item}`;
    return project.items.some(it=>!it.cancelled && it.id!==excludeId && itemFullCode(it)===code);
  },
  ensureMeta(project,building,chapter,sub,names){
    if(building!=null){ project.buildings[building]=project.buildings[building]||{name:names&&names.building||''};
      if(names&&names.building) project.buildings[building].name=names.building; }
    if(building!=null&&chapter!=null){ const k=building+'.'+chapter; project.chapters[k]=project.chapters[k]||{name:names&&names.chapter||''};
      if(names&&names.chapter) project.chapters[k].name=names.chapter; }
    if(building!=null&&chapter!=null&&sub!=null){ const k=building+'.'+chapter+'.'+sub; project.subchapters[k]=project.subchapters[k]||{name:names&&names.sub||''};
      if(names&&names.sub) project.subchapters[k].name=names.sub; }
  },
  addOrUpdateItem(project,fields,editId){
    const building=Util.normDigits(fields.building,2), chapter=Util.normDigits(fields.chapter,2),
      sub=Util.normDigits(fields.sub,2), item=Util.normDigits(fields.item,4);
    if(this.duplicateExists(project,building,chapter,sub,item,editId))
      return {ok:false,msg:`קוד סעיף ${building}.${chapter}.${sub}.${item} כבר קיים בפרויקט זה`};
    this.ensureMeta(project,building,chapter,sub,{building:fields.buildingName,chapter:fields.chapterName,sub:fields.subName});
    let it=editId?findItem(project,editId):null;
    if(it){ Object.assign(it,{building,chapter,sub,item,description:fields.description,unit:fields.unit,
      contractQty:fields.contractQty,unitPrice:fields.unitPrice,notes:fields.notes}); }
    else{ it=makeBoqItem({building,chapter,sub,item,description:fields.description,unit:fields.unit,
      contractQty:fields.contractQty,unitPrice:fields.unitPrice,notes:fields.notes,createdInAccount:Accounts.current(project).number});
      project.items.push(it); }
    return {ok:true,item:it};
  },
  itemHasHistory(project,itemId){ return project.measurements.some(m=>!m.isGroup && m.itemId===itemId && m.history && m.history.length); },
  removeItem(project,itemId){
    if(this.itemHasHistory(project,itemId)){
      const it=findItem(project,itemId); it.cancelled=true;
      return {ok:true,soft:true};
    }
    project.items=project.items.filter(it=>it.id!==itemId);
    project.measurements=project.measurements.filter(m=>m.itemId!==itemId);
    return {ok:true,soft:false};
  },
  tree(project){
    const items=project.items.filter(it=>!it.cancelled);
    const bMap={};
    items.forEach(it=>{
      bMap[it.building]=bMap[it.building]||{chapters:{},items:[]};
      const B=bMap[it.building];
      B.chapters[it.chapter]=B.chapters[it.chapter]||{subs:{}};
      const C=B.chapters[it.chapter];
      C.subs[it.sub]=C.subs[it.sub]||{items:[]};
      C.subs[it.sub].items.push(it);
    });
    return bMap;
  },
  draftHasActivity(project,itemIds){
    const draft=Accounts.current(project);
    return itemIds.some(id=>{ const it=findItem(project,id); if(!it) return false;
      const mv=Accounts.itemMovement(project,it,draft); return Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9; });
  },
  render(){
    const p=State.project, tree=this.tree(p);
    const bKeys=Object.keys(tree).sort((a,b)=>a.localeCompare(b));
    let h=`<div class="card"><div class="card-hd">📋 כתב כמויות<span class="hd-sub">${p.items.filter(i=>!i.cancelled).length} סעיפים</span></div>
      <div class="card-bd">
      <div class="boq-toolbar">
        <div class="boq-search"><input id="boq-search-in" placeholder="חיפוש לפי קוד, תיאור, פרק…" oninput="BOQSearch.onInput(this.value)" onkeydown="BOQSearch.onKey(event)">
          <span class="ic">🔍</span><div id="boq-search-results" class="boq-search-results"></div></div>
        <button class="btn btn-ghost btn-sm" onclick="BOQ.expandAll()">⤢ הרחב הכל</button>
        <button class="btn btn-ghost btn-sm" onclick="BOQ.collapseAll()">⤡ כווץ הכל</button>
        <button class="btn btn-gold btn-sm" onclick="BOQ.openItemModal()">＋ סעיף חדש</button>
      </div>`;
    if(!bKeys.length){
      h+=`<div class="empty"><div class="ic">📋</div><div class="t">אין עדיין סעיפים בכתב הכמויות</div>
        <div class="s">הוסף סעיף ידנית או ייבא מקובץ SKN בלשונית ״ייבוא״</div></div>`;
    } else {
      h+=`<div class="btree">`+bKeys.map(b=>this.renderBuilding(p,b,tree[b])).join('')+`</div>`;
    }
    h+=`</div></div>`;
    return h;
  },
  renderBuilding(p,b,B){
    const key=this.key(b), exp=this.isExpanded(key);
    const allIds=Object.values(B.chapters).flatMap(c=>Object.values(c.subs).flatMap(s=>s.items.map(i=>i.id)));
    const count=allIds.length;
    const active=this.draftHasActivity(p,allIds);
    const name=(p.buildings[b]&&p.buildings[b].name)||'';
    const chKeys=Object.keys(B.chapters).sort((a,b2)=>a.localeCompare(b2));
    return `<div class="b-node${exp?'':' collapsed'}" data-node="${key}">
      <div class="b-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle">▼</span>
        <span class="code">מבנה ${esc(b)}</span><span class="name">${esc(name)}</span>
        ${active?'<span class="b-activity" title="פעילות בחשבון הנוכחי"></span>':''}<span class="b-count">${count} סעיפים</span></div>
      <div class="b-body">${chKeys.map(c=>this.renderChapter(p,b,c,B.chapters[c])).join('')}</div></div>`;
  },
  renderChapter(p,b,c,C){
    const key=this.key(b,c), exp=this.isExpanded(key);
    const allIds=Object.values(C.subs).flatMap(s=>s.items.map(i=>i.id));
    const name=(p.chapters[b+'.'+c]&&p.chapters[b+'.'+c].name)||'';
    const subKeys=Object.keys(C.subs).sort((a,b2)=>a.localeCompare(b2));
    return `<div class="c-node" data-node="${key}">
      <div class="c-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle" style="color:var(--navy2)">▼</span>
        <span class="code">${esc(b)}.${esc(c)}</span><span class="name">${esc(name)}</span><span class="c-count">${allIds.length}</span></div>
      <div class="c-body${exp?'':' collapsed'}">${subKeys.map(s=>this.renderSub(p,b,c,s,C.subs[s])).join('')}</div></div>`;
  },
  renderSub(p,b,c,s,S){
    const key=this.key(b,c,s), exp=this.isExpanded(key);
    const name=(p.subchapters[b+'.'+c+'.'+s]&&p.subchapters[b+'.'+c+'.'+s].name)||'';
    return `<div class="s-node" data-node="${key}">
      <div class="s-hdr" onclick="BOQ.toggleNode('${key}')"><span class="b-toggle" style="font-size:9px">▼</span>
        <span class="code">${esc(b)}.${esc(c)}.${esc(s)}</span><span class="name">${esc(name)}</span><span class="c-count">${S.items.length}</span></div>
      <div class="s-body${exp?'':' collapsed'}">${S.items.sort((x,y)=>x.item.localeCompare(y.item)).map(it=>this.renderItem(p,it)).join('')}</div></div>`;
  },
  renderItem(p,it){
    const draft=Accounts.current(p);
    const mv=Accounts.itemMovement(p,it,draft);
    const activity=Math.abs(mv.addition)+Math.abs(mv.correction)>1e-9;
    return `<div class="i-row" data-item-id="${it.id}" onclick="Measurements.openItem('${it.id}')">
      <span class="code">${esc(itemFullCode(it))}</span>
      <span class="desc">${esc(it.description||'(ללא תיאור)')}</span>
      <span class="unit-chip">${esc(it.unit)}</span>
      <span class="qty num">${it.contractQty!==''?fn(it.contractQty):'—'}</span>
      <span class="price num">${it.unitPrice!==''?money(it.unitPrice):'—'}</span>
      ${activity?'<span class="stat grow">פעיל בחשבון</span>':''}
      <span class="actions" onclick="event.stopPropagation()">
        <button class="icon-btn" title="עריכה" onclick="BOQ.openItemModal('${it.id}')">✎</button>
        <button class="icon-btn del" title="מחיקה" onclick="BOQ.confirmRemoveItem('${it.id}')">🗑</button>
      </span></div>`;
  },
  openItemModal(editId){
    const p=State.project;
    const it=editId?findItem(p,editId):null;
    const bList=Object.keys(p.buildings), cList=Object.keys(p.chapters), sList=Object.keys(p.subchapters);
    UI.openModal(`<div class="modal-hd">${it?'עריכת סעיף':'סעיף חדש'}<span class="x" onclick="UI.closeModal()">✕</span></div>
      <div class="grid4">
        <div class="fld"><label>מבנה (קוד)</label><input id="im-b" value="${it?esc(it.building):'01'}" list="dl-b"></div>
        <div class="fld"><label>פרק (קוד)</label><input id="im-c" value="${it?esc(it.chapter):'01'}" list="dl-c"></div>
        <div class="fld"><label>תת-פרק (קוד)</label><input id="im-s" value="${it?esc(it.sub):'01'}" list="dl-s"></div>
        <div class="fld"><label>סעיף (קוד)</label><input id="im-i" value="${it?esc(it.item):''}" placeholder="0010"></div>
      </div>
      <div class="grid3" style="margin-top:10px">
        <div class="fld"><label>שם מבנה</label><input id="im-bn" value="${it?esc((p.buildings[it.building]||{}).name||''):''}"></div>
        <div class="fld"><label>שם פרק</label><input id="im-cn" value="${it?esc((p.chapters[it.building+'.'+it.chapter]||{}).name||''):''}"></div>
        <div class="fld"><label>שם תת-פרק</label><input id="im-sn" value="${it?esc((p.subchapters[it.building+'.'+it.chapter+'.'+it.sub]||{}).name||''):''}"></div>
      </div>
      <div class="fld" style="margin-top:10px"><label>תיאור הסעיף</label><textarea id="im-desc">${it?esc(it.description):''}</textarea></div>
      <div class="grid3" style="margin-top:10px">
        <div class="fld"><label>יחידה</label><select id="im-unit">${UNIT_LIST.map(u=>`<option ${it&&it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
        <div class="fld"><label>כמות חוזית</label><input id="im-qty" type="text" inputmode="decimal" value="${it?esc(it.contractQty):''}"></div>
        <div class="fld"><label>מחיר יחידה</label><input id="im-price" type="text" inputmode="decimal" value="${it?esc(it.unitPrice):''}"></div>
      </div>
      <div class="fld" style="margin-top:10px"><label>הערות</label><input id="im-notes" value="${it?esc(it.notes):''}"></div>
      <datalist id="dl-b">${bList.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
      <datalist id="dl-c">${cList.map(c=>`<option value="${esc(c.split('.')[1])}">`).join('')}</datalist>
      <datalist id="dl-s">${sList.map(s=>`<option value="${esc(s.split('.')[2])}">`).join('')}</datalist>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="UI.closeModal()">ביטול</button>
        <button class="btn btn-gold" onclick="BOQ.saveItemModal(${it?`'${it.id}'`:'null'})">שמירה</button></div>`,'wide');
  },
  saveItemModal(editId){
    const fields={building:byId('im-b').value,chapter:byId('im-c').value,sub:byId('im-s').value,item:byId('im-i').value,
      buildingName:byId('im-bn').value.trim(),chapterName:byId('im-cn').value.trim(),subName:byId('im-sn').value.trim(),
      description:byId('im-desc').value.trim(),unit:byId('im-unit').value,contractQty:byId('im-qty').value.trim(),
      unitPrice:byId('im-price').value.trim(),notes:byId('im-notes').value.trim()};
    if(!fields.item){ toast('יש להזין קוד סעיף','err'); return; }
    const r=this.addOrUpdateItem(State.project,fields,editId);
    if(!r.ok){ toast('⛔ '+r.msg,'err'); return; }
    this._expanded.add(this.key(r.item.building)); this._expanded.add(this.key(r.item.building,r.item.chapter)); this._expanded.add(this.key(r.item.building,r.item.chapter,r.item.sub));
    UI.closeModal(); State.scheduleSave(); toast('הסעיף נשמר'); App.refresh();
  },
  confirmRemoveItem(id){
    const p=State.project, it=findItem(p,id); if(!it) return;
    const hasHist=this.itemHasHistory(p,id);
    if(!confirm(hasHist
      ? `לסעיף ${itemFullCode(it)} יש היסטוריית מדידות מאושרת. לא ניתן למחוק לצמיתות — הסעיף יסומן כמבוטל וימשיך להופיע בדוחות היסטוריים. להמשיך?`
      : `למחוק את הסעיף ${itemFullCode(it)}?`)) return;
    this.removeItem(p,id); State.scheduleSave(); toast('הסעיף הוסר'); App.refresh();
  },
};

//  MODULE: SMART SEARCH
// ═══════════════════════════════════════════════════════════════════════
const BOQSearch = {
  results(project,q){
    q=(q||'').trim().toLowerCase(); if(!q) return [];
    return project.items.filter(it=>!it.cancelled).filter(it=>{
      const bn=(project.buildings[it.building]||{}).name||'';
      const cn=(project.chapters[it.building+'.'+it.chapter]||{}).name||'';
      const sn=(project.subchapters[it.building+'.'+it.chapter+'.'+it.sub]||{}).name||'';
      const hay=[itemFullCode(it),it.description,bn,cn,sn].join(' ').toLowerCase();
      return hay.includes(q);
    }).slice(0,30);
  },
  onInput(v){
    const host=byId('boq-search-results');
    const res=this.results(State.project,v);
    if(!v.trim()||!res.length){ host.classList.remove('show'); host.innerHTML=''; return; }
    host.innerHTML=res.map(it=>{
      const bn=(State.project.buildings[it.building]||{}).name||'';
      return `<div class="boq-search-row" onclick="BOQSearch.goTo('${it.id}')">
        <span class="code">${esc(itemFullCode(it))}</span>
        <span style="flex:1">${esc(it.description||'(ללא תיאור)')}</span>
        <span class="path">מבנה ${esc(it.building)} ${esc(bn)}</span></div>`;
    }).join('');
    host.classList.add('show');
  },
  onKey(e){ if(e.key==='Enter'){ const first=qs('#boq-search-results .boq-search-row'); if(first) first.click(); } },
  goTo(itemId){
    const p=State.project, it=findItem(p,itemId); if(!it) return;
    byId('boq-search-results').classList.remove('show');
    BOQ._expanded.add(BOQ.key(it.building)); BOQ._expanded.add(BOQ.key(it.building,it.chapter)); BOQ._expanded.add(BOQ.key(it.building,it.chapter,it.sub));
    App.showTab('boq');
    setTimeout(()=>{
      const row=qs(`.i-row[data-item-id="${itemId}"]`);
      if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.classList.add('hl'); setTimeout(()=>row.classList.remove('hl'),3200); }
    },60);
  },
};
