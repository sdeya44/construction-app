<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#B5121B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="הצעות מחיר">
  <title>מציל חיים — הצעות מחיר</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/doc.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="vendor/html2canvas.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <button class="top-back hidden" id="top-back" aria-label="חזרה">‹</button>
    <img class="top-logo" src="assets/icon-192.png" alt="">
    <div class="top-txt"><div class="top-title" id="top-title">הצעות מחיר</div><div class="top-sub" id="top-sub">מציל חיים בע״מ</div></div>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="list" class="on"><span>📄</span>הצעות</button>
    <button data-tab="catalog"><span>📋</span>מחירון</button>
    <button data-tab="settings"><span>⚙️</span>הגדרות</button>
  </nav>

  <div id="sheet" class="sheet hidden"><div class="sheet-bg" data-close></div><div class="sheet-body" id="sheet-body"></div></div>
  <div id="busy" class="busy hidden"><div class="spin"></div><div id="busy-txt">מייצר PDF…</div></div>
  <div id="toast" class="toast"></div>

  <!-- off-screen hosts used for measuring/paginating and for PDF capture -->
  <div id="measure-host" class="doc-host" aria-hidden="true"></div>
  <div id="pdf-host" class="doc-host" aria-hidden="true"></div>
</body>
</html>
